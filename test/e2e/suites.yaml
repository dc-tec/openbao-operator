version: 1
versions:
  openbao:
    defaultImage: "ghcr.io/openbao/openbao:2.6.1"
  storageEmulators:
    rustfsImage: "docker.io/rustfs/rustfs@sha256:3c2d55977829620284ece8593901bf776bcfc0fc9972784352de4dcffdb92416"
    fakeGCSImage: "docker.io/fsouza/fake-gcs-server@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f"
    azuriteImage: "mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37"
  kubernetes:
    primary: "1.35.1"
    compatibility:
      - "1.34.3"
    releaseGate:
      - "1.34.3"
      - "1.35.1"
    # Kubernetes 1.36.0 is the next candidate once controller-runtime,
    # k8s.io dependencies, Kind images, and release-gate coverage are ready.
    nextCandidate: "1.36.0"

parallelism:
  defaultNodes: 1
  maxNodes: 4

ciLanes:
  - id: core
    name: "Core Lifecycle & Manager"
    labelFilter: "(((lifecycle && !tls && !hsm && !pkcs11) || manager) && !openshift)"
    prLabelFilter: "(((lifecycle && !tls && !hsm && !pkcs11) || (manager && (smoke || e2e-anchor))) && !openshift)"
    prScope: always
    timeoutMinutes: 45
    e2eTimeout: 40m
    parallelNodes: 2
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    installCSIHostPath: true
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: security
    name: "Security & Tenants"
    labelFilter: "(((security || tenancy || tls || (tenant && !lifecycle)) && !profile-hardened && !(tls && slow)) && !openshift)"
    prScope: always
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: true
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: backup-restore
    name: "Backup & Restore"
    labelFilter: "((dr || restore) && !openshift)"
    prLabelFilter: "((dr && e2e-anchor) && !openshift)"
    prScope: backup
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs
      - fake-gcs
      - azurite

  - id: upgrade-rolling
    name: "Upgrade Rolling"
    labelFilter: "((upgrade && (rolling || snapshot || recovery || operation-lock) && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && (rolling || operation-lock) && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs

  - id: upgrade-bluegreen-core
    name: "Upgrade Blue/Green Core"
    labelFilter: "((upgrade && bluegreen && !verification && !failure && !rollback && !chaos && !gateway && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && bluegreen && !verification && !failure && !rollback && !chaos && !gateway && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 30
    e2eTimeout: 25m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs

  - id: upgrade-bluegreen-verification
    name: "Upgrade Blue/Green Verification"
    labelFilter: "((upgrade && bluegreen && verification && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 30
    e2eTimeout: 25m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: upgrade-bluegreen-recovery
    name: "Upgrade Blue/Green Recovery"
    labelFilter: "((upgrade && bluegreen && (failure || rollback || chaos) && !verification && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && bluegreen && failure && !verification && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 30
    e2eTimeout: 25m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: upgrade-gateway
    name: "Upgrade Gateway"
    labelFilter: "((upgrade && gateway && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && gateway && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 25
    e2eTimeout: 20m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: hardened
    name: "Hardened (Signed)"
    labelFilter: "((profile-hardened || (tls && slow)) && !openshift)"
    prScope: hardened
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: false
    hardenedSigned: true
    hardenedInitImage: "ghcr.io/dc-tec/openbao-init:edge"
    hardenedUpgradeExecutorImage: "ghcr.io/dc-tec/openbao-upgrade:edge"
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: true
    preloadStorageEmulators: []

  - id: hsm
    name: "HSM / KMIP / PKCS#11"
    labelFilter: "((hsm || kmip || pkcs11) && !openshift)"
    prScope: seal
    timeoutMinutes: 45
    e2eTimeout: 40m
    parallelNodes: 1
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    openbaoImage: "openbao-softhsm:dev"
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: platform-openshift
    name: "OpenShift Platform"
    labelFilter: "(openshift && platform)"
    prScope: manual
    timeoutMinutes: 45
    e2eTimeout: 40m
    includeInPRMatrix: false
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

nightly:
  profiles:
    - id: daily
      description: "Full primary-version coverage plus compatibility smoke coverage."
      laneSets:
        - coverage: full
          kubernetes:
            - "@primary"
          lanes:
            - core
            - security
            - backup-restore
            - upgrade-rolling
            - upgrade-bluegreen-core
            - upgrade-bluegreen-verification
            - upgrade-bluegreen-recovery
            - upgrade-gateway
            - hardened
      rows:
        - lane: core
          kubernetes: "@compatibility"
          coverage: compatibility-smoke
          labelFilter: "(((lifecycle && smoke) || (manager && smoke)) && !openshift)"
          timeoutMinutes: 45
          e2eTimeout: 40m
        - lane: security
          kubernetes: "@compatibility"
          coverage: compatibility-smoke
          labelFilter: "(((security || tenancy || (tenant && !lifecycle)) && critical && !pentest) && !openshift)"
          timeoutMinutes: 45
          e2eTimeout: 40m

    - id: weekly-full
      description: "Full compatibility coverage across supported Kubernetes versions."
      laneSets:
        - coverage: full
          kubernetes:
            - "@releaseGate"
          lanes:
            - core
            - security
            - backup-restore
            - upgrade-rolling
            - upgrade-bluegreen-core
            - upgrade-bluegreen-verification
            - upgrade-bluegreen-recovery
            - upgrade-gateway
            - hardened

    - id: release-gate
      description: "Manual full compatibility gate before release promotion."
      laneSets:
        - coverage: release-gate
          kubernetes:
            - "@releaseGate"
          lanes:
            - core
            - security
            - backup-restore
            - upgrade-rolling
            - upgrade-bluegreen-core
            - upgrade-bluegreen-verification
            - upgrade-bluegreen-recovery
            - upgrade-gateway
            - hardened

