id: no-openbaocluster-controller-unapproved-adapter-imports
valid:
  - |
    package p
    import "github.com/kubebao/openbao-operator/internal/platform/constants"
    var _ = constants.LabelManagedBy
invalid:
  - |
    package p
    import kube "github.com/kubebao/openbao-operator/internal/adapter/kube"
    var _ = kube.Client
