id: no-provisioner-controller-app-subpackage-imports
valid:
  - |
    package p
    import app "github.com/kubebao/openbao-operator/internal/app/provisioner"
    var _ = app.ReconcileOpenBaoTenant
invalid:
  - |
    package p
    import subpkg "github.com/kubebao/openbao-operator/internal/app/provisioner/tenantops"
    var _ = subpkg.Run
