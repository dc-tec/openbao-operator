id: no-provisioner-controller-unapproved-adapter-imports
valid:
  - |
    package p
    import app "github.com/kubebao/openbao-operator/internal/app/provisioner"
    var _ = app.ReconcileOpenBaoTenant
invalid:
  - |
    package p
    import openbao "github.com/kubebao/openbao-operator/internal/adapter/openbao"
    var _ = openbao.Client
