id: no-openbaocluster-controller-unapproved-service-imports
valid:
  - |
    package p
    import certs "github.com/dc-tec/openbao-operator/internal/certs"
    var _ = certs.Manager
invalid:
  - |
    package p
    import upgrade "github.com/dc-tec/openbao-operator/internal/upgrade"
    var _ = upgrade.Service
