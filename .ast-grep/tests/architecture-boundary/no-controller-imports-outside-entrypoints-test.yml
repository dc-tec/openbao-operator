id: no-controller-imports-outside-entrypoints
valid:
  - |
    package p
    import app "github.com/kubebao/openbao-operator/internal/app/provisioner"
    var _ = app.ReconcileOpenBaoTenant
invalid:
  - |
    package p
    import c "github.com/kubebao/openbao-operator/internal/controller/openbaocluster"
    var _ = c.NewOpenBaoClusterReconciler

