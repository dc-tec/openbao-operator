id: no-provisioner-controller-direct-domain-imports
valid:
  - |
    package p
    import app "github.com/kubebao/openbao-operator/internal/app/provisioner"
    var _ = app.ReconcileOpenBaoTenant
invalid:
  - |
    package p
    import revision "github.com/kubebao/openbao-operator/internal/adapter/revision"
    var _ = revision.Reader
