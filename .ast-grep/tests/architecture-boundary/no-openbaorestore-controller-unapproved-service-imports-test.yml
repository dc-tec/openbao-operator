id: no-openbaorestore-controller-unapproved-service-imports
valid:
  - |
    package p
    import app "github.com/kubebao/openbao-operator/internal/app/openbaorestore"
    var _ = app.NewRestoreReconciler
invalid:
  - |
    package p
    import restore "github.com/kubebao/openbao-operator/internal/service/restore"
    var _ = restore.Manager
  - |
    package p
    import bootstrap "github.com/kubebao/openbao-operator/internal/service/bootstrap"
    var _ = bootstrap.Manager
