id: no-openbaorestore-controller-unapproved-service-imports
valid:
  - |
    package p
    import restore "github.com/dc-tec/openbao-operator/internal/restore"
    var _ = restore.Service
invalid:
  - |
    package p
    import infra "github.com/dc-tec/openbao-operator/internal/infra"
    var _ = infra.Manager
