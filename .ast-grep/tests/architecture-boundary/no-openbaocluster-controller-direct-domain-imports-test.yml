id: no-openbaocluster-controller-direct-domain-imports
valid:
  - |
    package p
    import app "github.com/kubebao/openbao-operator/internal/app/openbaocluster"
    var _ = app.GatherStatusState
invalid:
  - |
    package p
    import revision "github.com/kubebao/openbao-operator/internal/adapter/revision"
    var _ = revision.GetOpenBaoImageVersionFromLabel

