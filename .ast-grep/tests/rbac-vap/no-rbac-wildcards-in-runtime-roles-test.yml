id: no-rbac-wildcards-in-runtime-roles
valid:
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: provisioner-role
    rules:
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "patch"]
invalid:
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: provisioner-role
    rules:
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["*"]
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: provisioner-role
    rules:
      - apiGroups: ["*"]
        resources: ["namespaces"]
        verbs: ["get"]
