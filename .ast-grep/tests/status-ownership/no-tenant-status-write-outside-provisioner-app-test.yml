id: no-tenant-status-write-outside-provisioner-app
valid:
  - |
    package p
    type Tenant struct { Status struct{ Message string } }
    func f(t *Tenant) {
      t.Status.Message = "ok"
    }
invalid:
  - |
    package p
    type TenantStatus struct {
      Provisioned bool
      LastError string
    }
    type Tenant struct {
      Status TenantStatus
    }
    func f(t *Tenant) {
      t.Status.Provisioned = false
      t.Status.LastError = "boom"
    }

