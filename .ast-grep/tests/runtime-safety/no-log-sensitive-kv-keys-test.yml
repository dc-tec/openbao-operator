id: no-log-sensitive-kv-keys
valid:
  - |
    package p
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, pod string) {
      logger.Info("reconciling", "pod", pod)
    }
invalid:
  - |
    package p
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, token string) {
      logger.Info("auth", "token", token)
    }
  - |
    package p
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, value string) {
      logger.Info("auth", "X-Vault-Inline-Auth-Parameter-jwt", value)
    }
  - |
    package p
    import "net/http"
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, headers http.Header) {
      logger.Info("request", "headers", headers)
    }
