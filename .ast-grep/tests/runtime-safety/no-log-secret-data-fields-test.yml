id: no-log-secret-data-fields
valid:
  - |
    package p
    type Logger interface { Info(string, ...any) }
    type Secret struct { Name string; Data map[string][]byte }
    func f(logger Logger, secret Secret) {
      logger.Info("loaded secret", "name", secret.Name)
    }
invalid:
  - |
    package p
    type Logger interface { Info(string, ...any) }
    type Secret struct { Data map[string][]byte }
    func f(logger Logger, secret Secret) {
      logger.Info("loaded secret", "data", secret.Data)
    }
