id: no-type-aliases-in-adapter-layer
valid:
  - |
    package openbao
    type Client struct{}
  - |
    package openbao
    type (
      Client struct{}
    )
invalid:
  - |
    package openbao
    import portopenbao "github.com/kubebao/openbao-operator/internal/port/openbao"
    type ClientConfig = portopenbao.ClientConfig
