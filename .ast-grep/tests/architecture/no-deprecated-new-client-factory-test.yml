id: no-deprecated-new-client-factory
valid:
  - |
    package p
    import openbao "github.com/dc-tec/openbao-operator/internal/adapter/openbao"
    func f(ca []byte) {
      mgr := openbao.NewClientManager(openbao.ClientConfig{})
      _ = mgr.FactoryFor("ns/name", ca)
    }
invalid:
  - |
    package p
    import openbao "github.com/dc-tec/openbao-operator/internal/adapter/openbao"
    func f() {
      _ = openbao.NewClientFactory(openbao.ClientConfig{})
    }
