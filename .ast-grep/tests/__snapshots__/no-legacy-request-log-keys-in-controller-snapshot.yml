id: no-legacy-request-log-keys-in-controller
snapshots:
  ? |
    package p
    type Req struct { Namespace, Name string }
    type Logger interface { Info(string, ...any) }
    func f(log Logger, req Req) {
      log.Info("Reconciling", "namespace", req.Namespace, "name", req.Name)
    }
  : labels:
    - source: log.Info("Reconciling", "namespace", req.Namespace, "name", req.Name)
      style: primary
      start: 132
      end: 201
