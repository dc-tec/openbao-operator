id: no-log-sensitive-kv-keys
snapshots:
  ? |
    package p
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, token string) {
      logger.Info("auth", "token", token)
    }
  : labels:
    - source: logger.Info("auth", "token", token)
      style: primary
      start: 97
      end: 132
  ? |
    package p
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, value string) {
      logger.Info("auth", "X-Vault-Inline-Auth-Parameter-jwt", value)
    }
  : labels:
    - source: logger.Info("auth", "X-Vault-Inline-Auth-Parameter-jwt", value)
      style: primary
      start: 97
      end: 160
  ? |
    package p
    import "net/http"
    type Logger interface { Info(string, ...any) }
    func f(logger Logger, headers http.Header) {
      logger.Info("request", "headers", headers)
    }
  : labels:
    - source: logger.Info("request", "headers", headers)
      style: primary
      start: 122
      end: 164
