globalImportBoundaries:
  - id: no-adapter-import-controller-or-service
    message: Adapter packages must not import controller or service-layer packages directly.
    note: Keep adapter packages behind contracts and prevent upward-layer coupling.
    files:
      - internal/adapter/auth/**/*.go
      - internal/adapter/cluster/**/*.go
      - internal/adapter/config/**/*.go
      - internal/adapter/kube/**/*.go
      - internal/adapter/openbao/**/*.go
      - internal/adapter/probe/**/*.go
      - internal/adapter/raft/**/*.go
      - internal/adapter/revision/**/*.go
      - internal/adapter/security/**/*.go
      - internal/adapter/storage/**/*.go
      - internal/adapter/storageenv/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/controller
      - internal/service/backup
      - internal/service/bootstrap
      - internal/service/certs
      - internal/service/claimcontract
      - internal/service/connectionpublishing
      - internal/service/identity
      - internal/service/init
      - internal/service/networking
      - internal/service/opslifecycle
      - internal/service/provisioner
      - internal/service/restore
      - internal/service/upgrade
      - internal/service/webhookcerts
      - internal/service/workloadidentity
  - id: no-adapter-imports-in-app-layer
    message: App layer should not import adapter packages directly; depend on ports/contracts.
    note: Keep app orchestration layer independent from concrete adapters.
    files:
      - internal/app/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/auth
      - internal/adapter/cluster
      - internal/adapter/config
      - internal/adapter/kube
      - internal/adapter/openbao
      - internal/adapter/probe
      - internal/adapter/raft
      - internal/adapter/revision
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - id: no-adapter-imports-in-port-layer
    message: Port packages must not import adapter packages directly.
    note: Keep ports limited to contracts, neutral types, and domain helpers.
    files:
      - internal/port/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/auth
      - internal/adapter/cluster
      - internal/adapter/config
      - internal/adapter/kube
      - internal/adapter/openbao
      - internal/adapter/probe
      - internal/adapter/raft
      - internal/adapter/revision
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - id: no-direct-config-rendering-outside-configuration-service
    message: Config rendering should go through internal/service/configuration.
    note: Keep config.hcl semantics owned by the shared configuration service.
    files:
      - internal/service/bootstrap/manager.go
      - internal/service/upgrade/bluegreen/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/config
  - id: no-adapter-to-adapter-imports
    message: Adapter packages should not depend on other adapters; use ports/contracts.
    files:
      - internal/adapter/auth/**/*.go
      - internal/adapter/cluster/**/*.go
      - internal/adapter/config/**/*.go
      - internal/adapter/kube/**/*.go
      - internal/adapter/openbao/**/*.go
      - internal/adapter/probe/**/*.go
      - internal/adapter/raft/**/*.go
      - internal/adapter/revision/**/*.go
      - internal/adapter/security/**/*.go
      - internal/adapter/storage/**/*.go
      - internal/adapter/storageenv/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/auth
      - internal/adapter/cluster
      - internal/adapter/config
      - internal/adapter/kube
      - internal/adapter/openbao
      - internal/adapter/probe
      - internal/adapter/raft
      - internal/adapter/revision
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - id: no-controller-runtime-reconcile-apis-in-app-layer
    message: App layer should not depend on controller-runtime reconcile APIs directly.
    note: Keep reconcile request/result ownership in controller layer and use app-domain return types/facades.
    files:
      - internal/app/**/*.go
    ignores:
      - "**/*_test.go"
      # Transitional bridge points pending decomposition away from ctrl.Result/ctrl.Request.
    disallowExternalImports:
      - sigs.k8s.io/controller-runtime/pkg/reconcile
    disallowExternalExactImports:
      - sigs.k8s.io/controller-runtime
  - id: no-controller-imports-outside-entrypoints
    message: Internal non-controller packages must not import controller packages directly.
    note: Controller packages are entrypoint wiring concerns and should only be imported from cmd/*.
    files:
      - internal/**/*.go
    ignores:
      - "**/*_test.go"
      - internal/controller/**/*.go
    disallowImports:
      - internal/controller
  - id: no-statusapply-imports-outside-approved-status-writers
    message: statusapply should only be imported by the approved status-owning packages.
    note: Keep status apply helpers constrained to the dedicated workload, adminops, and operation-lock status writers.
    files:
      - internal/**/*.go
    ignores:
      - "**/*_test.go"
      - internal/service/opslifecycle/lock.go
      - internal/app/openbaocluster/patch.go
      - internal/app/openbaocluster/adminopsstatus/mutate.go
    disallowImports:
      - internal/platform/statusapply
