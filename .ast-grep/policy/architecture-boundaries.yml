modulePath: github.com/dc-tec/openbao-operator

layerCoverage:
  root: internal
  layers:
    controller:
      - controller
    app:
      - app
    service:
      - service/backup
      - service/certs
      - service/infra
      - service/init
      - service/opslifecycle
      - service/provisioner
      - service/restore
      - service/upgrade
      - service/workloadidentity
    adapter:
      - adapter/auth
      - adapter/cluster
      - adapter/config
      - adapter/kube
      - adapter/openbao
      - adapter/probe
      - adapter/raft
      - adapter/revision
      - adapter/security
      - adapter/storage
      - adapter/storageenv
    port:
      - port
    platform:
      - platform/admission
      - platform/constants
      - platform/entrypoint
      - platform/errors
      - platform/logging
      - platform/observability
      - platform/openbaotls
      - platform/predicates
      - platform/reconcile
      - platform/statusapply
      - platform/statuspatch
      - platform/testutil

controllerCoverage:
  root: internal/controller

serviceImportRoots:
  - internal/service/backup
  - internal/service/certs
  - internal/service/infra
  - internal/service/init
  - internal/service/opslifecycle
  - internal/service/provisioner
  - internal/service/restore
  - internal/service/upgrade
  - internal/service/upgrade/bluegreen
  - internal/service/upgrade/core
  - internal/service/upgrade/raftops
  - internal/service/upgrade/rolling
  - internal/service/upgrade/snapshot
  - internal/service/workloadidentity

adapterImportRoots:
  - internal/adapter/auth
  - internal/adapter/cluster
  - internal/adapter/config
  - internal/adapter/kube
  - internal/adapter/openbao
  - internal/adapter/probe
  - internal/adapter/raft
  - internal/adapter/revision
  - internal/adapter/security
  - internal/adapter/storage
  - internal/adapter/storageenv

controllerBoundaries:
  - name: openbaocluster
    displayName: OpenBaoCluster
    files:
      - internal/controller/openbaocluster/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/infra
      - internal/service/upgrade
      - internal/adapter/revision
      - internal/platform/logging
    appFacadeRoot: internal/app/openbaocluster
    allowServiceImports: []
    allowAdapterImports: []
  - name: openbaorestore
    displayName: OpenBaoRestore
    files:
      - internal/controller/openbaorestore/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/infra
      - internal/service/upgrade
      - internal/adapter/revision
      - internal/platform/logging
    appFacadeRoot: internal/app/openbaorestore
    allowServiceImports: []
    allowAdapterImports: []
  - name: provisioner
    displayName: Provisioner
    files:
      - internal/controller/provisioner/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/infra
      - internal/service/upgrade
      - internal/adapter/revision
      - internal/platform/logging
    appFacadeRoot: internal/app/provisioner
    allowServiceImports: []
    allowAdapterImports: []

serviceBoundaries:
  - name: infra
    displayName: Infra
    packageRoot: internal/service/infra
    files:
      - internal/service/infra/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports: []
  - name: backup
    displayName: Backup
    packageRoot: internal/service/backup
    files:
      - internal/service/backup/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/opslifecycle
      - internal/service/workloadidentity
  - name: restore
    displayName: Restore
    packageRoot: internal/service/restore
    files:
      - internal/service/restore/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/opslifecycle
      - internal/service/workloadidentity
  - name: upgrade-core
    displayName: Upgrade Core
    packageRoot: internal/service/upgrade/core
    files:
      - internal/service/upgrade/core/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/opslifecycle
  - name: upgrade-raftops
    displayName: Upgrade RaftOps
    packageRoot: internal/service/upgrade/raftops
    files:
      - internal/service/upgrade/raftops/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports: []
  - name: upgrade-snapshot
    displayName: Upgrade Snapshot
    packageRoot: internal/service/upgrade/snapshot
    files:
      - internal/service/upgrade/snapshot/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/upgrade
  - name: upgrade-rolling
    displayName: Rolling Upgrade
    packageRoot: internal/service/upgrade/rolling
    files:
      - internal/service/upgrade/rolling/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/opslifecycle
      - internal/service/upgrade
      - internal/service/upgrade/core
      - internal/service/upgrade/raftops
      - internal/service/upgrade/snapshot
  - name: upgrade-bluegreen
    displayName: BlueGreen Upgrade
    packageRoot: internal/service/upgrade/bluegreen
    files:
      - internal/service/upgrade/bluegreen/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/opslifecycle
      - internal/service/upgrade
      - internal/service/upgrade/core
      - internal/service/upgrade/raftops
      - internal/service/upgrade/snapshot

appBoundaries:
  - name: openbaocluster
    displayName: OpenBaoCluster
    files:
      - internal/app/openbaocluster/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/backup
      - internal/service/certs
      - internal/service/infra
      - internal/service/upgrade
      - internal/service/upgrade/bluegreen
      - internal/service/upgrade/rolling
      - internal/service/workloadidentity

globalImportBoundaries:
  - id: no-adapter-import-controller-or-service
    message: Adapter packages must not import controller or service-layer packages directly.
    note: Keep adapter packages behind contracts and prevent upward-layer coupling.
    files:
      - internal/adapter/auth/**/*.go
      - internal/adapter/cluster/**/*.go
      - internal/adapter/config/**/*.go
      - internal/adapter/kube/**/*.go
      - internal/adapter/openbao/**/*.go
      - internal/adapter/probe/**/*.go
      - internal/adapter/raft/**/*.go
      - internal/adapter/revision/**/*.go
      - internal/adapter/security/**/*.go
      - internal/adapter/storage/**/*.go
      - internal/adapter/storageenv/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/controller
      - internal/service/backup
      - internal/service/certs
      - internal/service/infra
      - internal/service/init
      - internal/service/opslifecycle
      - internal/service/provisioner
      - internal/service/restore
      - internal/service/upgrade
      - internal/service/workloadidentity
  - id: no-adapter-imports-in-app-layer
    message: App layer should not import adapter packages directly; depend on ports/contracts.
    note: Keep app orchestration layer independent from concrete adapters.
    files:
      - internal/app/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/auth
      - internal/adapter/cluster
      - internal/adapter/config
      - internal/adapter/kube
      - internal/adapter/openbao
      - internal/adapter/probe
      - internal/adapter/raft
      - internal/adapter/revision
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - id: no-adapter-imports-in-port-layer
    message: Port packages must not import adapter packages directly.
    note: Keep ports limited to contracts, neutral types, and domain helpers.
    files:
      - internal/port/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/auth
      - internal/adapter/cluster
      - internal/adapter/config
      - internal/adapter/kube
      - internal/adapter/openbao
      - internal/adapter/probe
      - internal/adapter/raft
      - internal/adapter/revision
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - id: no-adapter-to-adapter-imports
    message: Adapter packages should not depend on other adapters; use ports/contracts.
    files:
      - internal/adapter/auth/**/*.go
      - internal/adapter/cluster/**/*.go
      - internal/adapter/config/**/*.go
      - internal/adapter/kube/**/*.go
      - internal/adapter/openbao/**/*.go
      - internal/adapter/probe/**/*.go
      - internal/adapter/raft/**/*.go
      - internal/adapter/revision/**/*.go
      - internal/adapter/security/**/*.go
      - internal/adapter/storage/**/*.go
      - internal/adapter/storageenv/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/adapter/auth
      - internal/adapter/cluster
      - internal/adapter/config
      - internal/adapter/kube
      - internal/adapter/openbao
      - internal/adapter/probe
      - internal/adapter/raft
      - internal/adapter/revision
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - id: no-controller-runtime-reconcile-apis-in-app-layer
    message: App layer should not depend on controller-runtime reconcile APIs directly.
    note: Keep reconcile request/result ownership in controller layer and use app-domain return types/facades.
    files:
      - internal/app/**/*.go
    ignores:
      - "**/*_test.go"
      # Transitional bridge points pending decomposition away from ctrl.Result/ctrl.Request.
    disallowExternalImports:
      - sigs.k8s.io/controller-runtime/pkg/reconcile
    disallowExternalExactImports:
      - sigs.k8s.io/controller-runtime
  - id: no-controller-imports-outside-entrypoints
    message: Internal non-controller packages must not import controller packages directly.
    note: Controller packages are entrypoint wiring concerns and should only be imported from cmd/*.
    files:
      - internal/**/*.go
    ignores:
      - "**/*_test.go"
      - internal/controller/**/*.go
    disallowImports:
      - internal/controller
  - id: no-statusapply-imports-outside-approved-status-writers
    message: statusapply should only be imported by the approved status-owning packages.
    note: Keep status apply helpers constrained to the dedicated workload, adminops, and operation-lock status writers.
    files:
      - internal/**/*.go
    ignores:
      - "**/*_test.go"
      - internal/service/opslifecycle/lock.go
      - internal/app/openbaocluster/patch.go
      - internal/app/openbaocluster/adminopsstatus/mutate.go
    disallowImports:
      - internal/platform/statusapply
