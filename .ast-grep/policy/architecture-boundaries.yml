modulePath: github.com/dc-tec/openbao-operator

modules:
  - name: shared-platform
    displayName: Shared Platform Kernel
    required: true
    owns:
      apis:
        - LocalReference
        - NamespacedReference
        - TypedObjectReference
        - ConditionReason
      controllers: []
      apps: []
      services: []
    mayDependOn: []
  - name: core
    displayName: Core Lifecycle
    required: true
    owns:
      apis:
        - OpenBaoCluster
        - OpenBaoRestore
      controllers:
        - openbaocluster
        - openbaorestore
      apps:
        - internal/app/openbaocluster
        - internal/app/openbaorestore
      services:
        - internal/service/backup
        - internal/service/bootstrap
        - internal/service/certs
        - internal/service/configuration
        - internal/service/init
        - internal/service/networking
        - internal/service/opslifecycle
        - internal/service/restore
        - internal/service/upgrade
        - internal/service/workload
        - internal/service/workloadidentity
    mayDependOn:
      - shared-platform
  - name: tenantops
    displayName: TenantOps
    required: false
    owns:
      apis:
        - OpenBaoTenant
      controllers:
        - provisioner
      apps:
        - internal/app/provisioner
      services:
        - internal/service/provisioner
    mayDependOn:
      - core
      - shared-platform
  - name: serviceclaims
    displayName: Service Catalog / Claims
    required: false
    owns:
      apis:
        - OpenBaoBackupAuthProfile
        - OpenBaoBackupBackend
        - OpenBaoBackupProfile
        - OpenBaoBackupTarget
        - OpenBaoBootstrapProfile
        - OpenBaoClusterClaim
        - OpenBaoClusterClaimBackupRequest
        - OpenBaoClusterClaimRestoreRequest
        - OpenBaoClusterClaimUpgradeRequest
        - OpenBaoEntrypoint
        - OpenBaoExposureClass
        - OpenBaoIngressPolicy
        - OpenBaoNetworkProfile
        - OpenBaoObservabilityProfile
        - OpenBaoRuntimeProfile
        - OpenBaoServiceOffering
        - OpenBaoServiceProfile
        - OpenBaoStorageProfile
        - OpenBaoTransferProfile
        - OpenBaoUnsealProfile
        - OpenBaoUpgradePolicy
      controllers:
        - openbaoclusterclaim
        - openbaoclusterclaim/backuprequest
        - openbaoclusterclaim/restorerequest
        - openbaoclusterclaim/upgraderequest
      apps:
        - internal/app/openbaoclusterclaim
        - internal/app/openbaoclusterclaim/backuprequest
        - internal/app/openbaoclusterclaim/restorerequest
        - internal/app/openbaoclusterclaim/upgraderequest
      services:
        - internal/service/claimcontract
        - internal/service/connectionpublishing
        - internal/service/webhookcerts
    mayDependOn:
      - core
      - tenantops
      - shared-platform
    files:
      - api/v1alpha1/openbaobackupauthprofile_types.go
      - api/v1alpha1/openbaobackupbackend_types.go
      - api/v1alpha1/openbaobackupprofile_types.go
      - api/v1alpha1/openbaobackuptarget_types.go
      - api/v1alpha1/openbaobootstrapprofile_types.go
      - api/v1alpha1/openbaoclusterclaim_types.go
      - api/v1alpha1/openbaoclusterclaimbackuprequest_types.go
      - api/v1alpha1/openbaoclusterclaimrestorerequest_types.go
      - api/v1alpha1/openbaoclusterclaimupgraderequest_types.go
      - api/v1alpha1/openbaoentrypoint_types.go
      - api/v1alpha1/openbaoexposureclass_types.go
      - api/v1alpha1/openbaoingresspolicy_types.go
      - api/v1alpha1/openbaonetworkprofile_types.go
      - api/v1alpha1/openbaoobservabilityprofile_types.go
      - api/v1alpha1/openbaoruntimeprofile_types.go
      - api/v1alpha1/openbaoserviceoffering_types.go
      - api/v1alpha1/openbaoserviceprofile_types.go
      - api/v1alpha1/openbaostorageprofile_types.go
      - api/v1alpha1/openbaotransferprofile_types.go
      - api/v1alpha1/openbaounsealprofile_types.go
      - api/v1alpha1/openbaoupgradepolicy_types.go
      - cmd/controller/runtime_setup_claims.go
      - internal/app/openbaoclusterclaim/**/*.go
      - internal/controller/openbaoclusterclaim/**/*.go
      - internal/service/claimcontract/**/*.go
      - internal/service/connectionpublishing/**/*.go
      - internal/service/webhookcerts/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/placement
      - internal/service/remoteexecution
    disallowAPISymbols:
      - MultiClusterConditionReason
      - OpenBaoClusterClaimMaterializationModeMultiCluster
      - OpenBaoClusterClaimPlacementSpec
      - RemoteRef
      - TargetClusterRef
    disallowAPISymbolPatterns:
      - ManagedCluster.*
      - OpenBaoClusterExecution.*
      - RemoteOpenBaoCluster.*

layerCoverage:
  root: internal
  layers:
    controller:
      - controller
    app:
      - app
    service:
      - service/configuration
      - service/bootstrap
      - service/backup
      - service/certs
