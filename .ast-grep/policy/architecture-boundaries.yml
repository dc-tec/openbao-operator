      - adapter/openbao
      - adapter/probe
      - adapter/raft
      - adapter/revision
      - adapter/security
      - adapter/storage
      - adapter/storageenv
    port:
      - port
    platform:
      - platform/admission
      - platform/constants
      - platform/entrypoint
      - platform/errors
      - platform/logging
      - platform/observability
      - platform/openbaotls
      - platform/predicates
      - platform/reconcile
