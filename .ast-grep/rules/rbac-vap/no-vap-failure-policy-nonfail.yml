# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-vap-failure-policy-nonfail
message: ValidatingAdmissionPolicy must use failurePolicy=Fail (fail-closed).
severity: warning
language: Yaml
files:
  - config/policy/*.yaml
rule:
  pattern: |
    failurePolicy: $POLICY
constraints:
  POLICY:
    not:
      regex: '^Fail$'
note: Admission guardrails must fail closed to avoid silent policy bypass.
