# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-log-secret-data-fields
message: Do not log Secret Data/StringData values.
severity: warning
language: Go
files:
  - internal/**/*.go
  - cmd/**/*.go
ignores:
  - '**/*_test.go'
rule:
  all:
    - any:
        - pattern: $F($MSG, $KEY, $VAL)
        - pattern: $F($MSG, $K1, $V1, $KEY, $VAL)
        - pattern: $F($MSG, $K1, $V1, $K2, $V2, $KEY, $VAL)
        - pattern: $F($ERR, $MSG, $KEY, $VAL)
        - pattern: $F($ERR, $MSG, $K1, $V1, $KEY, $VAL)
        - pattern: $F($ERR, $MSG, $K1, $V1, $K2, $V2, $KEY, $VAL)
constraints:
  F:
    regex: '\.(Info|Error)$'
  VAL:
    regex: '\.(Data|StringData)(\[[^\]]+\])?$'
note: Logging secret payload bytes leaks credentials into log sinks and audit pipelines.
