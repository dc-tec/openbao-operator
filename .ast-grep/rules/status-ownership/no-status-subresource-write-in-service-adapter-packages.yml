# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-status-subresource-write-in-service-adapter-packages
message: Service/adapter packages should not persist CR status via status subresource clients.
severity: warning
language: Go
files:
  - internal/service/backup/**/*.go
  - internal/service/certs/**/*.go
  - internal/service/infra/**/*.go
  - internal/service/init/**/*.go
  - internal/service/opslifecycle/**/*.go
  - internal/service/provisioner/**/*.go
  - internal/service/restore/**/*.go
  - internal/service/upgrade/**/*.go
  - internal/adapter/auth/**/*.go
  - internal/adapter/cluster/**/*.go
  - internal/adapter/config/**/*.go
  - internal/adapter/kube/**/*.go
  - internal/adapter/openbao/**/*.go
  - internal/adapter/probe/**/*.go
  - internal/adapter/raft/**/*.go
  - internal/adapter/revision/**/*.go
  - internal/adapter/security/**/*.go
  - internal/adapter/storage/**/*.go
  - internal/adapter/storageenv/**/*.go
ignores:
  - '**/*_test.go'
rule:
  all:
    - kind: call_expression
    - regex: '\.Status\(\)\.(Apply|Patch|Update)\('
note: Keep status persistence ownership in controller/app orchestration boundaries, not service/adapter runtime packages.
