# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-status-field-write-in-adapter-packages
message: Adapter packages should not mutate CR status fields directly.
severity: warning
language: Go
files:
  - internal/adapter/auth/**/*.go
  - internal/adapter/cluster/**/*.go
  - internal/adapter/config/**/*.go
  - internal/adapter/kube/**/*.go
  - internal/adapter/openbao/**/*.go
  - internal/adapter/probe/**/*.go
  - internal/adapter/raft/**/*.go
  - internal/adapter/revision/**/*.go
  - internal/adapter/security/**/*.go
  - internal/adapter/storage/**/*.go
  - internal/adapter/storageenv/**/*.go
ignores:
  - '**/*_test.go'
rule:
  any:
    - pattern: $OBJ.Status = $VALUE
    - pattern: $OBJ.Status.$FIELD = $VALUE
note: Keep CR status mutation in app/controller-owned status flows; adapters should provide read/integration behavior.
