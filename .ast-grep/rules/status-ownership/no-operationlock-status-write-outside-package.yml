# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-operationlock-status-write-outside-package
message: Only internal/service/opslifecycle should mutate status.operationLock directly.
severity: warning
language: Go
files:
  - internal/**/*.go
ignores:
  - '**/*_test.go'
  - internal/service/opslifecycle/**/*.go
rule:
  pattern: $OBJ.Status.OperationLock = $VALUE
note: Centralize lock mutation semantics in internal/service/opslifecycle to avoid split ownership.
