# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-deprecated-new-client-factory
message: Use ClientManager.FactoryFor instead of deprecated openbao.NewClientFactory.
severity: warning
language: Go
files:
  - internal/**/*.go
  - cmd/**/*.go
ignores:
  - '**/*_test.go'
  - internal/openbao/**/*.go
rule:
  all:
    - pattern: $F($CFG)
constraints:
  F:
    regex: '^openbao\.NewClientFactory$'
note: Shared client state should be managed via ClientManager for stable runtime behavior.
