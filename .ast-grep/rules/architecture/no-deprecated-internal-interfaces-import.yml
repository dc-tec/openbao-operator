# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-deprecated-internal-interfaces-import
message: Do not import deprecated internal/interfaces package.
severity: warning
language: Go
files:
  - internal/**/*.go
  - cmd/**/*.go
ignores:
  - '**/*_test.go'
rule:
  all:
    - kind: import_spec
    - regex: '"github\.com/dc-tec/openbao-operator/internal/interfaces"'
note: Migrate to explicit packages under internal/port/* or dedicated domain contracts.

