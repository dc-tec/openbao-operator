---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaoserviceofferingrollouts.openbao.org
spec:
  group: openbao.org
  names:
    kind: OpenBaoServiceOfferingRollout
    listKind: OpenBaoServiceOfferingRolloutList
    plural: openbaoserviceofferingrollouts
    shortNames:
    - obofferingrollout
    singular: openbaoserviceofferingrollout
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.offeringRef.name
      name: Offering
      type: string
    - jsonPath: .spec.targetRevisionRef.name
      name: Target
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.total
      name: Total
      priority: 1
      type: integer
    - jsonPath: .status.succeeded
      name: Succeeded
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OpenBaoServiceOfferingRollout is an admin-owned rollout intent
          for promoting claims bound to a service offering.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenBaoServiceOfferingRolloutSpec defines the desired state
              of OpenBaoServiceOfferingRollout.
            properties:
              offeringRef:
                description: OfferingRef identifies the stable service-offering alias
                  to roll out.
                properties:
                  name:
                    description: Name is the referenced object name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              selector:
                description: Selector restricts which claims bound to the offering
                  are included.
                properties:
                  claimSelector:
                    description: ClaimSelector restricts the rollout to claims with
                      matching labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    description: Namespaces restricts the rollout to explicitly named
                      claim namespaces. Empty selects all namespaces.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              strategy:
                description: Strategy controls rollout orchestration.
                properties:
                  maxConcurrent:
                    description: MaxConcurrent limits the number of active claim upgrade
                      requests created by this rollout.
                    format: int32
                    minimum: 1
                    type: integer
                  mode:
                    default: InPlaceOnly
                    description: Mode controls which upgrade classes the rollout may
                      drive.
                    enum:
                    - InPlaceOnly
                    type: string
                type: object
              targetRevisionRef:
                description: TargetRevisionRef identifies the immutable service-profile
                  revision that the offering must currently point at.
                properties:
                  name:
                    description: Name is the referenced object name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - offeringRef
            - targetRevisionRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable after creation
              rule: self == oldSelf
          status:
            description: OpenBaoServiceOfferingRolloutStatus defines the observed
              state of OpenBaoServiceOfferingRollout.
            properties:
              blocked:
                description: Blocked is the number of selected claims whose upgrade
                  request is blocked.
                format: int32
                type: integer
              claims:
                description: Claims summarizes selected claim rollout progress.
                items:
                  description: OpenBaoServiceOfferingRolloutClaimStatus summarizes
                    rollout progress for one selected claim.
                  properties:
                    name:
                      description: Name is the claim name.
                      type: string
                    namespace:
                      description: Namespace is the claim namespace.
                      type: string
                    reason:
                      description: Reason explains the per-claim rollout state.
                      type: string
                    requestRef:
                      description: RequestRef identifies the claim upgrade request
                        created for this claim when one exists.
                      properties:
                        name:
                          description: Name is the referenced object name.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the referenced object namespace.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    state:
                      description: State is the rollout state observed for this claim.
                      enum:
                      - Pending
                      - RollingOut
                      - Succeeded
                      - Blocked
                      - Failed
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                  of the rollout state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failed:
                description: Failed is the number of selected claims whose upgrade
                  request failed.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the latest rollout generation observed
                  by the controller.
                format: int64
                type: integer
              pending:
                description: Pending is the number of selected claims waiting for
                  a rollout slot or request evaluation.
                format: int32
                type: integer
              reason:
                description: Reason explains the current rollout workflow state.
                type: string
              running:
                description: Running is the number of selected claims with an active
                  rollout request.
                format: int32
                type: integer
              state:
                description: State is the current rollout workflow state.
                enum:
                - Pending
                - Running
                - Succeeded
                - Blocked
                - Failed
                type: string
              succeeded:
                description: Succeeded is the number of selected claims that reached
                  the target revision.
                format: int32
                type: integer
              targetRevisionRef:
                description: TargetRevisionRef identifies the resolved immutable target
                  revision.
                properties:
                  name:
                    description: Name is the immutable catalog object name.
                    type: string
                  uid:
                    description: UID is the Kubernetes object UID observed when the
                      claim bound this revision.
                    type: string
                required:
                - name
                - uid
                type: object
              total:
                description: Total is the number of claims selected by this rollout.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
