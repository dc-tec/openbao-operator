{{- if and .Values.metrics.enabled .Values.metrics.rbac.enabled }}
{{- if not (gt (len .Values.metrics.rbac.subjects) 0) }}
{{- fail "metrics.rbac.enabled=true requires at least one entry in metrics.rbac.subjects" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-reader
subjects:
  {{- range .Values.metrics.rbac.subjects }}
  - kind: ServiceAccount
    name: {{ .name | quote }}
    namespace: {{ .namespace | quote }}
  {{- end }}
{{- end }}
