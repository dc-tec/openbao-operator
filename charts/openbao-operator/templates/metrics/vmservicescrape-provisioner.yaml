{{- if and (eq .Values.tenancy.mode "multi") .Values.metrics.enabled .Values.metrics.victoriaMetrics.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "openbao-operator.fullname" . }}-provisioner-metrics
  namespace: {{ .Values.metrics.victoriaMetrics.namespace | default .Release.Namespace }}
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
    {{- with .Values.metrics.victoriaMetrics.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openbao-operator.name" . }}
      app.kubernetes.io/component: provisioner
  endpoints:
    - port: https
      path: /metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: {{ .Values.metrics.victoriaMetrics.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.victoriaMetrics.scrapeTimeout | default "10s" }}
      tlsConfig:
        insecureSkipVerify: {{ .Values.metrics.victoriaMetrics.tlsConfig.insecureSkipVerify | default true }}
        {{- if .Values.metrics.victoriaMetrics.tlsConfig.serverName }}
        serverName: {{ .Values.metrics.victoriaMetrics.tlsConfig.serverName | quote }}
        {{- end }}
{{- end }}

