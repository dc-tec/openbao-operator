{{- if and (eq .Values.tenancy.mode "multi") .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "openbao-operator.fullname" . }}-provisioner-metrics
  namespace: {{ .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openbao-operator.name" . }}
      app.kubernetes.io/component: provisioner
  endpoints:
    - port: https
      path: /metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
      tlsConfig:
        insecureSkipVerify: {{ .Values.metrics.serviceMonitor.tlsConfig.insecureSkipVerify | default true }}
        {{- if .Values.metrics.serviceMonitor.tlsConfig.serverName }}
        serverName: {{ .Values.metrics.serviceMonitor.tlsConfig.serverName | quote }}
        {{- end }}
        {{- if .Values.metrics.serviceMonitor.tlsConfig.caSecret.name }}
        ca:
          secret:
            name: {{ .Values.metrics.serviceMonitor.tlsConfig.caSecret.name | quote }}
            key: {{ .Values.metrics.serviceMonitor.tlsConfig.caSecret.key | default "ca.crt" | quote }}
        {{- end }}
        {{- if .Values.metrics.serviceMonitor.tlsConfig.certSecret.name }}
        cert:
          secret:
            name: {{ .Values.metrics.serviceMonitor.tlsConfig.certSecret.name | quote }}
            key: {{ .Values.metrics.serviceMonitor.tlsConfig.certSecret.key | default "tls.crt" | quote }}
        {{- end }}
        {{- if .Values.metrics.serviceMonitor.tlsConfig.keySecret.name }}
        keySecret:
          name: {{ .Values.metrics.serviceMonitor.tlsConfig.keySecret.name | quote }}
          key: {{ .Values.metrics.serviceMonitor.tlsConfig.keySecret.key | default "tls.key" | quote }}
        {{- end }}
{{- end }}
