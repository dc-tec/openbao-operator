apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openbao-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-reader
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openbao-operator.fullname" . }}-controller-openbaocluster
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusterclaims
      - openbaoclusterclaims/status
      - openbaoclusterclaims/finalizers
      - openbaoclusterclaimbackuprequests
      - openbaoclusterclaimbackuprequests/status
      - openbaoclusterclaimbackuprequests/finalizers
      - openbaoclusterclaimrestorerequests
      - openbaoclusterclaimrestorerequests/status
      - openbaoclusterclaimrestorerequests/finalizers
      - openbaoclusterclaimupgraderequests
      - openbaoclusterclaimupgraderequests/status
      - openbaoclusterclaimupgraderequests/finalizers
      - openbaoserviceofferingrollouts
      - openbaoserviceofferingrollouts/status
      - openbaoserviceofferingrollouts/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - openbao.org
    resources:
      - openbaoserviceprofiles
      - openbaoserviceofferings
      - openbaobootstrapprofiles
      - openbaoexposureclasses
      - openbaoingresspolicies
      - openbaostorageprofiles
      - openbaounsealprofiles
      - openbaoruntimeprofiles
      - openbaoobservabilityprofiles
      - openbaonetworkprofiles
      - openbaoupgradepolicies
      - openbaobackupprofiles
      - openbaoentrypoints
      - openbaobackuptargets
      - openbaobackupbackends
      - openbaobackupauthprofiles
      - openbaotransferprofiles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - openbao.org
    resources:
      - openbaotenants
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - create
      - delete
      - get
      - patch
      - update
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - gatewayclasses
    verbs:
      - get
  - nonResourceURLs:
      - "/.well-known/openid-configuration"
      - "/openid/v1/jwks"
      - "/.well-known/jwks.json"
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openbao-operator.fullname" . }}-controller-openbaorestore
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaorestores
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-controller-metrics-auth
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openbao-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "openbao-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
