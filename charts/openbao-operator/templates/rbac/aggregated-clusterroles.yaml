
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-admin
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - "*"
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters/status
    verbs:
      - get
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-editor
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters/status
    verbs:
      - get
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-cloud-identity
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - usecloudidentities
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-helper-image
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - usecustomexecutables
      - usehelperimages
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-image-trust-roots
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - useimagetrustroots
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-restore
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - restore
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  name: {{ include "openbao-operator.fullname" . }}-openbaocluster-viewer
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters/status
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbaotenant-editor
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups:
      - openbao.org
    resources:
      - openbaotenants
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - openbao.org
    resources:
      - openbaotenants/status
    verbs:
      - get

