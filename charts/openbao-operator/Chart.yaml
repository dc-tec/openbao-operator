apiVersion: v2
name: openbao-operator
description: >-
  OpenBao Operator installs the OpenBao Kubernetes operator and its required
  cluster-scoped resources.
type: application
version: 0.3.0
appVersion: 0.3.0
icon: >-
  https://raw.githubusercontent.com/dc-tec/openbao-operator/main/docs/assets/logo.svg
home: https://github.com/dc-tec/openbao-operator
sources:
  - https://github.com/dc-tec/openbao-operator
keywords:
  - openbao
  - vault
  - secrets
  - operator
  - kubernetes
maintainers:
  - name: dc-tec
    url: https://github.com/dc-tec
kubeVersion: '>=1.33.0-0'
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: 'false'
  artifacthub.io/changes: |
    - kind: added
      description: "openbaocluster: add ingress integration readiness"
    - kind: added
      description: "openbao: improve PKCS#11 runtime ergonomics"
    - kind: fixed
      description: "backup: record manual triggers and failure time"
    - kind: fixed
      description: "config: align audit device options with OpenBao"
    - kind: fixed
      description: "config: harden generated JWT roles"
    - kind: fixed
      description: "config: use SemVer precedence for OpenBao version checks"
    - kind: fixed
      description: "deps: restore dependency update CI coverage"
    - kind: fixed
      description: "gateway: emit TLSRoute as Gateway API v1"
    - kind: fixed
      description: "helm: deduplicate generated RBAC labels"
    - kind: fixed
      description: "openbao: share JWT token cache"
    - kind: fixed
      description: "provisioner: support external tenant PSS label ownership"
    - kind: fixed
      description: "rbac: allow verification pull secret reads"
    - kind: fixed
      description: "restore: harden restore job rendering"
    - kind: fixed
      description: "storage: retry transient S3 bucket ensure failures"
    - kind: fixed
      description: "upgrade: harden rolling upgrade resume"
    - kind: fixed
      description: "workload: mount OCI plugin directory"
  artifacthub.io/images: |
    - name: openbao-operator
      image: ghcr.io/dc-tec/openbao-operator:0.3.0
    - name: openbao-init
      image: ghcr.io/dc-tec/openbao-init:0.3.0
    - name: openbao-backup
      image: ghcr.io/dc-tec/openbao-backup:0.3.0
    - name: openbao-upgrade
      image: ghcr.io/dc-tec/openbao-upgrade:0.3.0
  artifacthub.io/crds: |
    - kind: OpenBaoCluster
      version: v1alpha1
      name: openbaoclusters.openbao.org
      displayName: OpenBaoCluster
      description: Manages OpenBao cluster lifecycle, configuration, upgrades, and backups.
    - kind: OpenBaoTenant
      version: v1alpha1
      name: openbaotenants.openbao.org
      displayName: OpenBaoTenant
      description: Declares tenant onboarding and target namespace provisioning.
    - kind: OpenBaoRestore
      version: v1alpha1
      name: openbaorestores.openbao.org
      displayName: OpenBaoRestore
      description: Requests restore operations from snapshot backups.
  artifacthub.io/crdsExamples: |
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoCluster
      metadata:
        name: openbaocluster-sample
      spec:
        version: "2.5.3"
        replicas: 3
        profile: Development
        tls:
          enabled: true
          rotationPeriod: "720h"
        storage:
          size: "10Gi"
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoTenant
      metadata:
        name: openbaocluster-full-tenant
        namespace: openbao-operator-system
      spec:
        targetNamespace: openbaocluster-full
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoRestore
      metadata:
        name: openbaorestore-sample
      spec:
        cluster: openbaocluster-sample
        source:
          target:
            endpoint: https://s3.amazonaws.com
            bucket: openbao-backups
            region: us-east-1
            credentialsSecretRef:
              name: s3-credentials
          key: clusters/openbaocluster-sample/2025-01-01-120000.snap
  artifacthub.io/maintainers: |
    - name: dc-tec
      email: roel@decort.tech
  artifacthub.io/links: |
    - name: Documentation
      url: https://dc-tec.github.io/openbao-operator/latest/
    - name: Source
      url: https://github.com/dc-tec/openbao-operator
    - name: Issues
      url: https://github.com/dc-tec/openbao-operator/issues
    - name: Discussions
      url: https://github.com/dc-tec/openbao-operator/discussions
    - name: OpenBao Docs
      url: https://openbao.org/docs/
