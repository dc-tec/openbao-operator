apiVersion: v2
name: openbao-operator
description: >-
  OpenBao Operator installs the OpenBao Kubernetes operator and its required
  cluster-scoped resources.
type: application
version: 0.5.0-rc.2
appVersion: 0.5.0-rc.2
icon: >-
  https://raw.githubusercontent.com/dc-tec/openbao-operator/main/website/static/img/brand/logo.svg
home: https://github.com/dc-tec/openbao-operator
sources:
  - https://github.com/dc-tec/openbao-operator
keywords:
  - openbao
  - vault
  - secrets
  - operator
  - kubernetes
maintainers:
  - name: dc-tec
    url: https://github.com/dc-tec
kubeVersion: '>=1.33.0-0'
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: 'true'
  artifacthub.io/changes: |
    - kind: added
      description: "api: stabilize v1alpha1 contracts"
    - kind: added
      description: "config: support plugin-backed KMS seals"
    - kind: added
      description: "config: support self-init profile controls"
    - kind: added
      description: "tooling: make devenv the contributor entry point"
    - kind: added
      description: "upgrade: allow idle strategy switching"
    - kind: fixed
      description: "api: align status and lifecycle contracts"
    - kind: fixed
      description: "api: configure voter resources"
    - kind: fixed
      description: "charts: allow provisioner metrics traffic"
    - kind: fixed
      description: "charts: set single-tenant controller watch namespace"
    - kind: fixed
      description: "compat: qualify OpenBao 2.6.0"
    - kind: fixed
      description: "config: omit plugin directory without plugins"
    - kind: fixed
      description: "deps: remediate website security advisories"
    - kind: security
      description: "deps: remediate website transitive vulnerabilities"
    - kind: fixed
      description: "deps: update golang.org/x/mod to v0.40.0"
    - kind: security
      description: "deps: update vulnerable brace-expansion"
    - kind: security
      description: "deps: update vulnerable Go modules"
    - kind: security
      description: "deps: update vulnerable website transitive dependencies"
    - kind: fixed
      description: "docs: improve ultrawide layout"
    - kind: fixed
      description: "docs: restore TypeScript compatibility"
    - kind: fixed
      description: "lifecycle: require ownership proof for managed jobs"
    - kind: fixed
      description: "networking: align Gateway and TLS readiness"
    - kind: fixed
      description: "provisioner: clean up tenant governance resources"
    - kind: fixed
      description: "release: harden release candidate gates"
    - kind: fixed
      description: "release: preserve release-as through squash"
    - kind: fixed
      description: "release: preserve SPDX schema validity"
    - kind: fixed
      description: "resolve 0.5.0-rc.1 safety blockers"
    - kind: fixed
      description: "upgrade: verify blue-green validation hook images"
    - kind: fixed
      description: "release: checkout before image scans"
    - kind: changed
      description: "tooling: reduce devenv base closure"
    - kind: changed
      description: "main: request release 0.5.0-rc.2"
  artifacthub.io/images: |
    - name: openbao-operator
      image: ghcr.io/dc-tec/openbao-operator:0.5.0-rc.2
    - name: openbao-init
      image: ghcr.io/dc-tec/openbao-init:0.5.0-rc.2
    - name: openbao-backup
      image: ghcr.io/dc-tec/openbao-backup:0.5.0-rc.2
    - name: openbao-upgrade
      image: ghcr.io/dc-tec/openbao-upgrade:0.5.0-rc.2
  artifacthub.io/crds: |
    - kind: OpenBaoCluster
      version: v1alpha1
      name: openbaoclusters.openbao.org
      displayName: OpenBaoCluster
      description: Manages OpenBao cluster lifecycle, configuration, upgrades, and backups.
    - kind: OpenBaoTenant
      version: v1alpha1
      name: openbaotenants.openbao.org
      displayName: OpenBaoTenant
      description: Declares tenant onboarding and target namespace provisioning.
    - kind: OpenBaoRestore
      version: v1alpha1
      name: openbaorestores.openbao.org
      displayName: OpenBaoRestore
      description: Requests restore operations from snapshot backups.
  artifacthub.io/crdsExamples: |
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoCluster
      metadata:
        name: openbaocluster-sample
      spec:
        version: "2.6.2"
        replicas: 3
        profile: Development
        tls:
          enabled: true
          rotationPeriod: "720h"
        storage:
          size: "10Gi"
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoTenant
      metadata:
        name: openbaocluster-full-tenant
        namespace: openbao-operator-system
      spec:
        targetNamespace: openbaocluster-full
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoRestore
      metadata:
        name: openbaorestore-sample
      spec:
        cluster: openbaocluster-sample
        source:
          target:
            endpoint: https://s3.amazonaws.com
            bucket: openbao-backups
            region: us-east-1
            credentialsSecretRef:
              name: s3-credentials
          key: clusters/openbaocluster-sample/2025-01-01-120000.snap
  artifacthub.io/maintainers: |
    - name: dc-tec
      email: roel@decort.tech
  artifacthub.io/links: |
    - name: Documentation
      url: https://dc-tec.github.io/openbao-operator/latest/
    - name: Source
      url: https://github.com/dc-tec/openbao-operator
    - name: Issues
      url: https://github.com/dc-tec/openbao-operator/issues
    - name: Discussions
      url: https://github.com/dc-tec/openbao-operator/discussions
    - name: OpenBao Docs
      url: https://openbao.org/docs/
