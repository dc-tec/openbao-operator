apiVersion: v2
name: openbao-operator
description: >-
  OpenBao Operator installs the OpenBao Kubernetes operator and its required
  cluster-scoped resources.
type: application
version: 0.3.0
appVersion: 0.3.0
icon: >-
  https://raw.githubusercontent.com/dc-tec/openbao-operator/main/docs/assets/logo.svg
home: https://github.com/dc-tec/openbao-operator
sources:
  - https://github.com/dc-tec/openbao-operator
keywords:
  - openbao
  - vault
  - secrets
  - operator
  - kubernetes
maintainers:
  - name: dc-tec
    url: https://github.com/dc-tec
kubeVersion: '>=1.33.0-0'
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: 'false'
  artifacthub.io/containsSecurityUpdates: 'true'
  artifacthub.io/changes: |
    - kind: added
      description: "admission: authorize maintenance through RBAC"
    - kind: added
      description: "api: add runtime restart controls"
    - kind: added
      description: "readreplicas: add steady-state read replica topology and status"
    - kind: added
      description: "readreplicas: integrate read replicas with upgrade and restore workflows"
    - kind: fixed
      description: "admission: guard hardened security context overrides"
    - kind: fixed
      description: "helm: allow global values in chart schema"
    - kind: fixed
      description: "helm: Helm provisioner admission identity"
    - kind: fixed
      description: "infra: delete scaled-down raft PVCs"
    - kind: fixed
      description: "multitenancy: gate cluster reconcile on tenant onboarding"
    - kind: fixed
      description: "network: Require source-scoped managed Ingress access"
    - kind: fixed
      description: "openbao: stage safe raft scale-downs"
    - kind: fixed
      description: "probe: stabilize openbao workload probes"
    - kind: fixed
      description: "provisioner: reduce release reconciliation log noise"
    - kind: security
      description: "security: fail closed for configured trusted roots"
    - kind: fixed
      description: "status: mark unsafe admission mode not production-ready"
    - kind: fixed
      description: "upgrade: complete SSA ownership migration"
    - kind: fixed
      description: "upgrade: harden bluegreen and rolling recovery flakes"
    - kind: fixed
      description: "upgrade: set executor job resource requirements"
    - kind: fixed
      description: "upgrade: treat raft promote already-voter as no-op"
  artifacthub.io/images: |
    - name: openbao-operator
      image: ghcr.io/dc-tec/openbao-operator:0.2.0
    - name: openbao-init
      image: ghcr.io/dc-tec/openbao-init:0.2.0
    - name: openbao-backup
      image: ghcr.io/dc-tec/openbao-backup:0.2.0
    - name: openbao-upgrade
      image: ghcr.io/dc-tec/openbao-upgrade:0.2.0
  artifacthub.io/crds: |
    - kind: OpenBaoCluster
      version: v1alpha1
      name: openbaoclusters.openbao.org
      displayName: OpenBaoCluster
      description: Manages OpenBao cluster lifecycle, configuration, upgrades, and backups.
    - kind: OpenBaoTenant
      version: v1alpha1
      name: openbaotenants.openbao.org
      displayName: OpenBaoTenant
      description: Declares tenant onboarding and target namespace provisioning.
    - kind: OpenBaoRestore
      version: v1alpha1
      name: openbaorestores.openbao.org
      displayName: OpenBaoRestore
      description: Requests restore operations from snapshot backups.
  artifacthub.io/crdsExamples: |
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoCluster
      metadata:
        name: openbaocluster-sample
      spec:
        version: "2.5.4"
        replicas: 3
        profile: Development
        tls:
          enabled: true
          rotationPeriod: "720h"
        storage:
          size: "10Gi"
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoTenant
      metadata:
        name: openbaocluster-full-tenant
        namespace: openbao-operator-system
      spec:
        targetNamespace: openbaocluster-full
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoRestore
      metadata:
        name: openbaorestore-sample
      spec:
        cluster: openbaocluster-sample
        source:
          target:
            endpoint: https://s3.amazonaws.com
            bucket: openbao-backups
            region: us-east-1
            credentialsSecretRef:
              name: s3-credentials
          key: clusters/openbaocluster-sample/2025-01-01-120000.snap
  artifacthub.io/maintainers: |
    - name: dc-tec
      email: roel@decort.tech
  artifacthub.io/links: |
    - name: Documentation
      url: https://dc-tec.github.io/openbao-operator/latest/
    - name: Source
      url: https://github.com/dc-tec/openbao-operator
    - name: Issues
      url: https://github.com/dc-tec/openbao-operator/issues
    - name: Discussions
      url: https://github.com/dc-tec/openbao-operator/discussions
    - name: OpenBao Docs
      url: https://openbao.org/docs/
