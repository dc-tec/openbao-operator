schemaVersion: 1
release: 0.5.0
baseline: 0.4.2
decisionStatus: approved
snapshot: api/stability/v1alpha1-paths.tsv
notes:
  - The inventory defines the intended beta-stable subset; it does not graduate v1alpha1.
  - Any new non-core OpenBaoCluster field requires an explicit path-level inventory decision.
  - Condition types are automation-facing; reason sets may expand and message text is best-effort.
  - Main has no TypedObjectReference module hooks; any future hook requires an explicit inventory decision.
resources:
  - kind: OpenBaoCluster
    crd: config/crd/bases/openbao.org_openbaoclusters.yaml
    version: v1alpha1
    defaults:
      spec:
        mutability: mutable
        migration: required-if-changed
        moduleInteraction: none
        enforcement: [crd-schema, controller]
      status:
        mutability: operator-owned
        migration: required-if-changed
        moduleInteraction: none
        enforcement: [crd-schema, status-writer]
    notes:
      - The stable target is deliberately smaller than the currently served surface.
      - Unseal and backup targets retain their wire shape with discriminator consistency enforced by CEL.
      - Audit raw options remain a supported advanced compatibility contract outside the beta-stable subset.
    rules:
      - path: spec.audit
        classification: additive-unfrozen
        owner: configuration
        rationale: Declarative audit devices are supported, but the advanced fallback contract still needs a freeze decision.
      - path: spec.audit[].options
        classification: additive-unfrozen
        rationale: Raw scalar options remain supported for backward compatibility and advanced OpenBao settings, but are not part of the beta-stable subset.
      - path: spec.auditFileStorage
        classification: additive-unfrozen
        owner: configuration
      - path: spec.backup
        classification: beta-stable
        owner: backup
        omission: scheduled backups are disabled
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.backup.image
        omission: controller derives the backup image repository and operator-version tag
      - path: spec.backup.jwtAuthRole
        omission: self-init OIDC uses the operator-managed backup role; otherwise token authentication applies
      - path: spec.backup.target
        classification: beta-stable
        rationale: Retain the existing shared target shape; CEL rejects mismatched nested provider options and missing S3 endpoints without a JSON reshape.
      - path: spec.backup.target.concurrency
        omission: backup executor uses 3 concurrent upload parts
      - path: spec.backup.target.endpoint
        omission: GCS uses googleapis.com and Azure derives its endpoint; S3 requires an explicit endpoint
      - path: spec.backup.target.partSize
        omission: backup executor uses 10485760-byte upload parts
      - path: spec.backup.target.provider
        omission: provider is s3
      - path: spec.breakGlassAck
        classification: beta-stable
        owner: lifecycle-safety
        mutability: request-token
      - path: spec.configuration
        classification: beta-stable
        owner: configuration
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.configuration.cacheSize
        omission: OpenBao applies its built-in cache-size default
      - path: spec.configuration.defaultLeaseTTL
        omission: OpenBao applies its built-in default lease TTL
      - path: spec.configuration.maxLeaseTTL
        omission: OpenBao applies its built-in maximum lease TTL
      - path: spec.configuration.plugin.downloadBehavior
        omission: OpenBao fails startup when a declarative plugin download fails
      - path: spec.configuration.raft.autopilot.minQuorum
        omission: controller derives max(3, replicas/2 + 1)
      - path: spec.deletionPolicy
        classification: beta-stable
        owner: lifecycle
      - path: spec.gateway
        classification: additive-unfrozen
        owner: networking
      - path: spec.image
        classification: beta-stable
        owner: workload
        omission: controller derives the OpenBao image from spec.version
      - path: spec.imagePullSecrets
        classification: beta-stable
        owner: workload
      - path: spec.imageVerification
        classification: beta-stable
        owner: supply-chain-security
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.ingress
        classification: beta-stable
        owner: networking
        omission: managed Ingress is disabled
      - path: spec.ingress.path
        omission: path is /
      - path: spec.ingress.tlsSecretName
        omission: controller uses the cluster TLS Secret
      - path: spec.initContainer
        classification: beta-stable
        owner: workload
      - path: spec.initContainer.image
        omission: controller derives the init image repository and operator-version tag
      - path: spec.maintenance
        classification: beta-stable
        owner: lifecycle
      - path: spec.network
        classification: beta-stable
        owner: networking
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.network.dnsNamespace
        omission: DNS namespace is kube-system
      - path: spec.observability
        classification: additive-unfrozen
        owner: observability
      - path: spec.operatorImageVerification
        classification: beta-stable
        owner: supply-chain-security
        omission: disabled in Development and enabled in Hardened without inheriting spec.imageVerification
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.paused
        classification: beta-stable
        owner: lifecycle
      - path: spec.plugins
        classification: additive-unfrozen
        owner: configuration
      - path: spec.podMetadata
        classification: beta-stable
        owner: workload
      - path: spec.profile
        classification: beta-stable
        owner: security-posture
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.readReplicas
        classification: additive-unfrozen
        owner: workload
      - path: spec.recoveryKeys
        classification: additive-unfrozen
        owner: bootstrap-security
      - path: spec.replicas
        classification: beta-stable
        owner: workload
      - path: spec.resources
        classification: additive-unfrozen
        owner: workload
        rationale: Resource requirements apply to voter OpenBao containers; read replicas retain their pool-specific template setting.
      - path: spec.restore
        classification: beta-stable
        owner: restore
      - path: spec.restore.jwtAuthRole
        omission: self-init OIDC uses the operator-managed restore role
      - path: spec.runtime
        classification: beta-stable
        owner: lifecycle
      - path: spec.runtime.restartAt
        mutability: request-token
        rationale: A changed non-empty value requests a rolling restart.
      - path: spec.securityContext
        classification: beta-stable
        owner: workload-security
        omission: controller applies the profile-specific pod security context
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.selfInit
        classification: beta-stable
        owner: bootstrap-security
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.service
        classification: beta-stable
        owner: networking
      - path: spec.serviceAccount
        classification: beta-stable
        owner: workload-identity
      - path: spec.serviceAccount.name
        omission: controller uses <cluster-name>-serviceaccount
      - path: spec.storage
        classification: beta-stable
        owner: storage
      - path: spec.storage.storageClassName
        mutability: immutable
        rationale: Admission rejects storage class changes after creation.
      - path: spec.storage.size
        mutability: grow-only
        rationale: Admission permits volume expansion but rejects shrinking the requested size.
      - path: spec.telemetry
        classification: additive-unfrozen
        owner: observability
      - path: spec.tls
        classification: beta-stable
        owner: transport-security
        enforcement: [crd-schema, admission-policy, controller]
      - path: spec.tls.acme.domains
        omission: controller derives an internal Service name for private in-cluster ACME
      - path: spec.unseal
        classification: beta-stable
        owner: seal
        omission: controller uses operator-managed static unseal
        enforcement: [crd-schema, admission-policy, controller]
        rationale: Retain the existing wire shape; CEL requires the selected provider branch and rejects non-selected branches.
      - path: spec.unseal.kms
        classification: additive-unfrozen
        rationale: The plugin-backed KMS selector remains supported, while its open-ended plugin payload is not part of the initial freeze.
      - path: spec.unseal.static.currentKey
        omission: controller uses file:///etc/bao/unseal/key
      - path: spec.unseal.static.currentKeyID
        omission: controller uses operator-generated-v1
      - path: spec.unseal.type
        omission: type is static
      - path: spec.upgrade
        classification: beta-stable
        owner: upgrade
        omission: controller uses RollingUpdate without creating an upgrade executor flow
      - path: spec.upgrade.blueGreen.verification.prePromotionHook.timeoutSeconds
        omission: hook timeout is 300 seconds
      - path: spec.upgrade.image
        omission: controller derives the upgrade image repository and operator-version tag
      - path: spec.upgrade.jwtAuthRole
        omission: self-init OIDC uses the operator-managed upgrade role
      - path: spec.upgrade.requests.promote
        mutability: request-token
        rationale: A changed non-empty value requests promotion of a held blue-green upgrade.
      - path: spec.upgrade.requests.retry
        mutability: request-token
        rationale: A changed non-empty value requests retry of the current failed rolling upgrade.
      - path: spec.upgrade.requests.rollback
        mutability: request-token
        rationale: A changed non-empty value requests abort or rollback of the current blue-green upgrade.
      - path: spec.upgrade.strategy
        mutability: transition-guarded
        rationale: Admission permits isolated strategy changes only while the cluster is healthy and idle.
      - path: spec.version
        classification: beta-stable
        owner: workload
        mutability: transition-guarded
        rationale: Admission rejects downgrades below the running version and reductions below an active rolling target.
      - path: spec.workloadHardening
        classification: additive-unfrozen
        owner: workload-security
      - path: status.acceptedUpgradeStrategy
        classification: stable-automation
        owner: upgrade
      - path: status.activeLeader
        classification: informational
        owner: workload-status
      - path: status.adminOps
        classification: informational
        owner: adminops-status
      - path: status.backup
        classification: informational
        owner: backup-status
      - path: status.backup.lastBackupTime
        classification: stable-automation
        rationale: This is the replacement for deprecated status.lastBackupTime.
      - path: status.blueGreen
        classification: informational
        owner: upgrade-status
      - path: status.breakGlass
        classification: stable-automation
        owner: lifecycle-safety
        rationale: The nonce and active state participate in the explicit acknowledgement workflow.
      - path: status.breakGlass.message
        classification: informational
      - path: status.breakGlass.steps
        classification: informational
      - path: status.conditions
        classification: stable-automation
        owner: status-controller
        stableValues:
          - ACMECacheReady
          - ACMEIntegrationReady
          - APIServerNetworkReady
          - AuditFileStorageReady
          - Available
          - BackingUp
          - BackupConfigurationReady
          - CloudUnsealIdentityReady
          - Degraded
          - EtcdEncryptionWarning
          - GatewayIntegrationReady
          - IngressIntegrationReady
          - NodeSecurityCapabilityMismatch
          - OpenBaoInitialized
          - OpenBaoLeader
          - OpenBaoSealed
          - ProductionReady
          - RaftMembershipReady
          - ReadReplicaStorageConfigured
          - ReadReplicasAutopilotHealthy
          - ReadReplicasReady
          - ReadServingAvailable
          - SecurityRisk
          - StorageConfigured
          - TLSReady
          - Upgrading
          - UserAccessBootstrap
        rationale: Condition types are stable; reason sets may expand and messages are best-effort.
      - path: status.conditions[].message
        classification: informational
      - path: status.currentVersion
        classification: stable-automation
        owner: workload-status
      - path: status.initialized
        classification: stable-automation
        owner: bootstrap-status
      - path: status.observedGeneration
        classification: stable-automation
        owner: status-controller
      - path: status.operationLock
        classification: informational
        owner: lifecycle-status
      - path: status.phase
        classification: stable-automation
        owner: status-controller
      - path: status.readReplicas
        classification: informational
        owner: workload-status
      - path: status.readyReplicas
        classification: stable-automation
        owner: workload-status
      - path: status.selfInitialized
        classification: stable-automation
        owner: bootstrap-status
      - path: status.upgrade
        classification: informational
        owner: upgrade-status
      - path: status.upgradeRequests
        classification: informational
        owner: upgrade-status
      - path: status.workload
        classification: informational
        owner: workload-status

  - kind: OpenBaoRestore
    crd: config/crd/bases/openbao.org_openbaorestores.yaml
    version: v1alpha1
    defaults:
      spec:
        mutability: immutable
        migration: required-if-changed
        moduleInteraction: none
        enforcement: [crd-schema, admission-policy, restore-controller]
      status:
        mutability: operator-owned
        migration: required-if-changed
        moduleInteraction: none
        enforcement: [crd-schema, status-writer]
    notes:
      - Restore resources are immutable job requests; changed inputs require a new resource.
      - The shared BackupTarget storage shape remains a pre-beta review unit.
    rules:
      - path: spec.cluster
        classification: beta-stable
        owner: restore
      - path: spec.force
        classification: beta-stable
        owner: restore
      - path: spec.image
        classification: beta-stable
        owner: restore
        omission: controller derives the restore image from the configured backup image
      - path: spec.jwtAuthRole
        classification: beta-stable
        owner: restore-authentication
        omission: self-init OIDC uses the operator-managed restore role
      - path: spec.overrideOperationLock
        classification: beta-stable
        owner: lifecycle-safety
      - path: spec.source
        classification: beta-stable
        owner: restore
      - path: spec.source.target
        classification: beta-stable
        rationale: Shares the validated BackupTarget contract with scheduled backups.
      - path: spec.source.target.provider
        omission: provider is s3
      - path: spec.tokenSecretRef
        classification: beta-stable
        owner: restore-authentication
      - path: status.completionTime
        classification: informational
        owner: restore-status
      - path: status.conditions
        classification: stable-automation
        owner: restore-status
        stableValues:
          - OperationLockOverride
          - RestoreComplete
          - RestoreConfigurationReady
        rationale: Condition types are stable; reason sets may expand and messages are best-effort.
      - path: status.conditions[].message
        classification: informational
      - path: status.message
        classification: informational
        owner: restore-status
      - path: status.phase
        classification: stable-automation
        owner: restore-status
      - path: status.snapshotKey
        classification: informational
        owner: restore-status
      - path: status.snapshotSize
        classification: informational
        owner: restore-status
      - path: status.startTime
        classification: informational
        owner: restore-status

  - kind: OpenBaoTenant
    crd: config/crd/bases/openbao.org_openbaotenants.yaml
    version: v1alpha1
    defaults:
      spec:
        mutability: mutable
        migration: required-if-changed
        moduleInteraction: none
        enforcement: [crd-schema, admission-policy, provisioner]
      status:
        mutability: operator-owned
        migration: required-if-changed
        moduleInteraction: none
        enforcement: [crd-schema, status-writer]
    notes:
      - Target namespace identity is immutable; centrally managed quota and limit range policy remains mutable.
    rules:
      - path: spec.limitRange
        classification: beta-stable
        owner: tenant-governance
      - path: spec.quota
        classification: beta-stable
        owner: tenant-governance
      - path: spec.targetNamespace
        classification: beta-stable
        owner: tenant-governance
        mutability: immutable
      - path: status.conditions
        classification: stable-automation
        owner: tenant-status
        stableValues:
          - Provisioned
        rationale: Condition types are stable; reason sets may expand and messages are best-effort.
      - path: status.conditions[].message
        classification: informational
      - path: status.lastError
        classification: informational
        owner: tenant-status
      - path: status.provisioned
        classification: stable-automation
        owner: tenant-status
