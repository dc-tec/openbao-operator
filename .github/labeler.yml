# PR Labeler Configuration
# Maps file patterns to labels for automatic PR labeling.
#
# Routing-sensitive labels used by CI E2E reruns:
# backup, upgrades, security, provisioner, admission, controller, claims, service-catalog.

# Documentation changes
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'README.md'
          - 'CONTRIBUTING.md'
          - 'CHANGELOG.md'
          - 'LICENSE'
          - '**/*.md'
          - 'releases/**/*'
          - 'website/**/*'

# Helm chart changes
helm:
  - changed-files:
      - any-glob-to-any-file:
          - 'charts/openbao-operator/**/*'
          - 'hack/helmchart/**/*'
          - 'hack/helmvalues/**/*'

# Test changes
tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - '.ast-grep/tests/**/*'
          - 'test/**/*'
          - 'tests/**/*'
          - 'hack/ci/**/*'
          - 'hack/perfcheck/**/*'

# Security related changes
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'config/policy/**/*'
          - '.trivy*'
