          - 'test/e2e/helpers/**/*'
          - 'test/e2e/Upgrade_Operation_Lock_test.go'
          - 'test/e2e/Upgrade_Strategies_test.go'
          - 'test/e2e/Upgrade_Target_Drift_test.go'
