# Networking changes
networking:
  - changed-files:
    - any-glob-to-any-file:
      - 'config/network-policy/**/*'
      - 'internal/service/infra/network*'

# Observability / monitoring changes
observability:
  - changed-files:
    - any-glob-to-any-file:
      - 'config/prometheus/**/*'
      - 'config/grafana/**/*'

# DevOps / CI-CD changes
devops:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**/*'
      - '.github/actions/**/*'
      - '.github/scripts/**/*'
      - '.github/labeler.yml'
      - '.github/size-labeler.yml'
      - 'Makefile'
      - '**/Makefile'
      - 'hack/ci/**/*'
      - 'hack/build*'
      - 'hack/release*'
      - '.golangci.yml'
      - '.devcontainer/**/*'
      - '.vscode/**/*'
      - 'release-please-*.json'
