      - 'internal/port/backup/**/*'
      - 'internal/service/backup/**/*'
      - 'internal/service/restore/**/*'
      - 'cmd/bao-backup/**/*'
      - 'Dockerfile.backup'
      - 'hack/ci/Dockerfile.fast.backup'
      - 'test/e2e/e2e_suite_test.go'
      - 'test/e2e/framework/**/*'
      - 'test/e2e/helpers/**/*'
      - 'test/e2e/backup_restore_test.go'
      - 'test/e2e/suites.yaml'

# Restore changes
restore:
