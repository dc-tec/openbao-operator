# PR Labeler Configuration
# Maps file patterns to labels for automatic PR labeling

# Documentation changes
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'README.md'
          - 'CONTRIBUTING.md'
          - 'LICENSE'
          - '**/*.md'
          - 'releases/**/*'
          - 'website/**/*'

# Helm chart changes
helm:
  - changed-files:
      - any-glob-to-any-file:
          - 'charts/openbao-operator/**/*'
          - 'hack/helm*/**/*'
          - 'hack/helmvalues/**/*'

# Test changes
tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - 'tests/**/*'
          - 'test/**/*'
          - 'hack/ci/**/*'

# Security related changes
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'config/policy/**/*'
          - '**/security/**/*'
          - '.trivy*'
          - '.github/workflows/dependency-review.yml'
          - 'internal/adapter/security/**/*'
          - 'internal/port/security/**/*'
          - 'internal/platform/openbaotls/**/*'
          - 'internal/service/certs/**/*'
          - 'test/e2e/e2e_suite_test.go'
          - 'test/e2e/framework/**/*'
          - 'test/e2e/helpers/**/*'
          - 'test/e2e/Cluster_Profile_Hardened_test.go'
          - 'test/e2e/Cluster_TLS_ACME_test.go'
          - 'test/e2e/hardened_signed_suite.go'
          - 'test/e2e/suites.yaml'

# RBAC changes
rbac:
  - changed-files:
    - any-glob-to-any-file:
      - 'config/rbac/**/*'
      - '**/rbac/**/*'
      - '*role*.yaml'
      - 'hack/gen-rbac/**/*'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**/*'
      - 'Dockerfile*'
      - '.github/dependabot.yml'

# API / CRD changes
api:
  - changed-files:
    - any-glob-to-any-file:
      - 'api/**/*'
      - 'config/crd/**/*'

# Controller changes
controller:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/controller/**/*'
      - 'internal/app/openbaocluster/**/*'
      - 'cmd/controller/**/*'
      - 'controllers/**/*'

# Provisioner changes
provisioner:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/app/provisioner/**/*'
      - 'internal/controller/provisioner/**/*'
      - 'internal/service/provisioner/**/*'
      - 'cmd/provisioner/**/*'
      - '**/provisioner*'

# Cluster management changes
cluster:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/adapter/cluster/**/*'

# Storage backend changes (S3, GCS, Azure)
storage:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/adapter/storage/**/*'
      - '**/storage*'

# Admission controller changes
admission:
  - changed-files:
    - any-glob-to-any-file:
      - 'charts/openbao-operator/templates/admission/**/*'
      - 'config/policy/**/*'
      - 'internal/platform/admission/**/*'
      - '**/admission*'

# Authentication changes
auth:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/adapter/auth/**/*'
      - '**/auth*'

# Certificate management changes
certs:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/service/certs/**/*'
      - '**/cert*'

# Raft consensus changes
raft:
  - changed-files:
    - any-glob-to-any-file:
      - 'internal/adapter/raft/**/*'
      - '**/raft*'

# Logging changes
logging:
  - changed-files:
    - any-glob-to-any-file:
