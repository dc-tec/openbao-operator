thresholds:
  - label: size/XS
    max: 10
  - label: size/S
    max: 100
  - label: size/M
    max: 500
  - label: size/L
    max: 1000
  - label: size/XL

ignore:
  - go.sum
  - website/package-lock.json
  - vendor/**/*
  - api/v1alpha1/zz_generated.deepcopy.go
  - docs/reference/api.md
  - dist/install.yaml
  - config/crd/bases/**/*
  - charts/openbao-operator/crds/**/*
  - charts/openbao-operator/templates/rbac/**/*
  - charts/openbao-operator/templates/admission/**/*
  - .ast-grep/rules/generated/**/*
  - internal/adapter/config/testdata/**/*
  - website/versioned_docs/**/*
  - website/versioned_sidebars/**/*

comment:
  marker: "<!-- managed:pr-size-label -->"
  body: |
    This PR is large (over 1000 lines). Consider breaking it down into smaller PRs.
