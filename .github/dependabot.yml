version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      docker-images:
        patterns:
          - "*"

  # Dependabot uses the npm ecosystem value for pnpm manifests and lockfiles.
  - package-ecosystem: npm
    directory: "/.github/tools"
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      pnpm-tools:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: friday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    # Docusaurus 3.10.x still relies on baseUrl, which TypeScript 7 removed.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
    groups:
      pnpm-website:
        patterns:
          - "*"
