name: Reusable Build Images

on:
  workflow_call:
    inputs:
      build_tag:
        description: "The technical tag to apply to the images (e.g., build-sha)"
        required: true
        type: string
      ref:
        description: "Git reference to checkout"
        required: true
        type: string
      source_date_epoch:
        description: "Unix timestamp used for deterministic build metadata"
        required: false
        default: ""
        type: string
      cache-scope:
        description: "BuildKit GHA cache scope prefix for this build trust domain"
        required: false
        default: trusted
        type: string
      sign_images:
        description: "Sign pushed image digests with keyless cosign before returning build outputs"
        required: false
        default: false
        type: boolean
    outputs:
      manager_digest:
        description: "Digest of the manager image"
        value: ${{ jobs.collect-digests.outputs.manager_digest }}
      config_init_digest:
        description: "Digest of the config-init image"
        value: ${{ jobs.collect-digests.outputs.config_init_digest }}
      backup_executor_digest:
        description: "Digest of the backup-executor image"
        value: ${{ jobs.collect-digests.outputs.backup_executor_digest }}
      upgrade_executor_digest:
        description: "Digest of the upgrade-executor image"
        value: ${{ jobs.collect-digests.outputs.upgrade_executor_digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: &runner ubuntu-24.04 
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openbao-operator
            dockerfile: Dockerfile
            output_key: manager
          - image: openbao-init
            dockerfile: Dockerfile.init
            output_key: config_init
          - image: openbao-backup
            dockerfile: Dockerfile.backup
            output_key: backup_executor
          - image: openbao-upgrade
            dockerfile: Dockerfile.upgrade
            output_key: upgrade_executor
    outputs:
      manager_digest: ${{ steps.set-output.outputs.manager_digest }}
      config_init_digest: ${{ steps.set-output.outputs.config_init_digest }}
      backup_executor_digest: ${{ steps.set-output.outputs.backup_executor_digest }}
      upgrade_executor_digest: ${{ steps.set-output.outputs.upgrade_executor_digest }}
    steps:
      - name: Validate checkout ref (immutable only)
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          if [[ "${REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            exit 0
          fi
          echo "inputs.ref must be an immutable commit SHA or semver tag ref; got: ${REF}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.31.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ inputs.source_date_epoch }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.build_tag }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}-${{ matrix.image }}

      - name: Set digest output
        id: set-output
        run: |
          echo "${{ matrix.output_key }}_digest=${{ steps.build.outputs.digest }}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: ${{ inputs.sign_images }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.4

      - name: Sign image (keyless)
        if: ${{ inputs.sign_images }}
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${IMAGE_REF}"

  collect-digests:
    name: Collect Image Digests
    runs-on: *runner
    needs: [build]
    permissions:
      contents: read
      packages: read
    outputs:
      manager_digest: ${{ steps.collect.outputs.manager_digest }}
      config_init_digest: ${{ steps.collect.outputs.config_init_digest }}
      backup_executor_digest: ${{ steps.collect.outputs.backup_executor_digest }}
      upgrade_executor_digest: ${{ steps.collect.outputs.upgrade_executor_digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.31.1

      - name: Collect digests from registry
        id: collect
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          manager_digest=$(docker buildx imagetools inspect "ghcr.io/${OWNER}/openbao-operator:${BUILD_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          config_init_digest=$(docker buildx imagetools inspect "ghcr.io/${OWNER}/openbao-init:${BUILD_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          backup_executor_digest=$(docker buildx imagetools inspect "ghcr.io/${OWNER}/openbao-backup:${BUILD_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          upgrade_executor_digest=$(docker buildx imagetools inspect "ghcr.io/${OWNER}/openbao-upgrade:${BUILD_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')

          {
            echo "manager_digest=${manager_digest}"
            echo "config_init_digest=${config_init_digest}"
            echo "backup_executor_digest=${backup_executor_digest}"
            echo "upgrade_executor_digest=${upgrade_executor_digest}"
          } >> "${GITHUB_OUTPUT}"
