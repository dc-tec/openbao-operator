name: Release Please Tag

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'charts/openbao-operator/Chart.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-tag
  cancel-in-progress: true

jobs:
  release-tag:
    name: Create Release Tag And Draft Release
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Mint GitHub App token (openbao-operator-release-tag)
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_APP_ID }}
          private-key: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please (tag only)
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
