name: Release Tag

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'charts/openbao-operator/Chart.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-please-tag
  cancel-in-progress: true

jobs:
  release-tag:
    name: Create Release Tag And Draft Release
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Mint GitHub App token (openbao-operator-release-tag)
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_APP_ID }}
          private-key: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create tag and draft release
        env:
          REPO: ${{ github.repository }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash hack/ci/create-release-tag-and-draft.sh
