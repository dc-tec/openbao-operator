name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: &runner ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Compute release variables
        id: vars
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "version must be a semver tag (e.g., 0.1.0 or 0.1.0-rc.1)" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          build_tag="build-${sha}"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          chart_app_version="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" || -z "${chart_app_version}" ]]; then
            echo "failed to parse version/appVersion from ${chart_file}" >&2
            exit 1
          fi
          if [[ "${chart_version}" != "${version}" || "${chart_app_version}" != "${version}" ]]; then
            echo "Chart.yaml version mismatch with release tag" >&2
            echo "  tag:             ${version}" >&2
            echo "  chart version:   ${chart_version}" >&2
            echo "  chart appVersion:${chart_app_version}" >&2
            echo "release-please must update Chart.yaml version and appVersion to match the release tag." >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "build_tag=${build_tag}" >> "${GITHUB_OUTPUT}"

          echo "manager_image=ghcr.io/${owner}/openbao-operator" >> "${GITHUB_OUTPUT}"
          echo "config_init_image=ghcr.io/${owner}/openbao-init" >> "${GITHUB_OUTPUT}"
          echo "backup_executor_image=ghcr.io/${owner}/openbao-backup" >> "${GITHUB_OUTPUT}"
          echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade" >> "${GITHUB_OUTPUT}"

      - name: Fail fast if draft GitHub Release is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          for _ in $(seq 1 24); do
            if gh release view "${version}" >/dev/null 2>&1; then
              echo "Found GitHub Release ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Release '${version}' not found after waiting." >&2
          echo "Merge the release-please PR to create the tag and draft release." >&2
          exit 1

  build:
    name: Build Images
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.build_tag }}
      ref: ${{ github.ref }}
    secrets: inherit

  security-govulncheck:
    name: Security Gate (vulncheck)
    runs-on: *runner
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=readonly
        run: make vulncheck

  security-images:
    name: Security Gate (Trivy image ${{ matrix.image_name }})
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: manager
            image_ref: ${{ needs.prepare.outputs.manager_image }}:${{ needs.prepare.outputs.build_tag }}
          - image_name: config-init
            image_ref: ${{ needs.prepare.outputs.config_init_image }}:${{ needs.prepare.outputs.build_tag }}
          - image_name: backup-executor
            image_ref: ${{ needs.prepare.outputs.backup_executor_image }}:${{ needs.prepare.outputs.build_tag }}
          - image_name: upgrade-executor
            image_ref: ${{ needs.prepare.outputs.upgrade_executor_image }}:${{ needs.prepare.outputs.build_tag }}
    steps:
      - name: Login to GHCR (pull)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          scan-type: image
          image-ref: ${{ matrix.image_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E Gate (kind ${{ matrix.k8s }})
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - 1.33.7
          - 1.34.3
          - 1.35.0
    env:
      KIND_NODE_IMAGE: kindest/node:v${{ matrix.k8s }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Login to GHCR (pull)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Pull images (amd64) for kind load
        run: |
          set -euo pipefail
          docker pull "${{ needs.prepare.outputs.manager_image }}:${{ needs.prepare.outputs.build_tag }}"
          docker pull "${{ needs.prepare.outputs.config_init_image }}:${{ needs.prepare.outputs.build_tag }}"
          docker pull "${{ needs.prepare.outputs.backup_executor_image }}:${{ needs.prepare.outputs.build_tag }}"
          docker pull "${{ needs.prepare.outputs.upgrade_executor_image }}:${{ needs.prepare.outputs.build_tag }}"

      - name: Create Kind Cluster
        run: |
          if ! kind get clusters | grep -q "kind"; then
            kind create cluster --name kind --image "${KIND_NODE_IMAGE}"
          fi

      - name: Run full E2E
        env:
          GOFLAGS: -mod=readonly
          OPENBAO_REQUEUE_STANDARD: 10s
          E2E_TIMEOUT: 90m
          E2E_PARALLEL_NODES: "2"
          E2E_SKIP_IMAGE_BUILD: "true"

          OPERATOR_VERSION: ${{ needs.prepare.outputs.build_tag }}

          E2E_OPERATOR_IMAGE: ${{ needs.prepare.outputs.manager_image }}:${{ needs.prepare.outputs.build_tag }}
          E2E_CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}:${{ needs.prepare.outputs.build_tag }}
          E2E_BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}:${{ needs.prepare.outputs.build_tag }}
          E2E_UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}:${{ needs.prepare.outputs.build_tag }}
          KIND_CLUSTER: kind
        run: make test-e2e-ci

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-artifacts-kind-${{ matrix.k8s }}
          path: artifacts/
          retention-days: 7

  perf-gate:
    name: Performance Gate (kind v1.34.3)
    runs-on: *runner
    needs: prepare
    permissions:
      contents: read
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Verify performance thresholds
        env:
          GOFLAGS: -mod=readonly
          PERF_NODE_IMAGE: kindest/node:v1.34.3
          PERF_SCENARIO_TIMEOUT: 90m
          PERF_THRESHOLDS_OUT: hack/perf/thresholds/kind-v1.34.3.yaml
        run: make verify-perf

  verify-provenance:
    name: Verify Image Provenance
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
      MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
      CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
      CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify image attestations
        run: bash hack/ci/verify-image-attestations.sh

  promote:
    name: Promote + Publish Release
    runs-on: *runner
    needs: [prepare, build, security-govulncheck, security-images, e2e, perf-gate, verify-provenance]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.31.1

      - name: Promote tags (no rebuild)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${MANAGER_IMAGE}:${VERSION}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${VERSION}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${VERSION}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${VERSION}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.4

      - name: Sign images (keyless)
        env:
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      - name: Set Artifact Hub prerelease annotation
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
        run: |
          set -euo pipefail
          if [[ "${CHART_VERSION}" == *-* ]]; then
            PRE="true"
          else
            PRE="false"
          fi

          if ! grep -Eq '^[[:space:]]*artifacthub\.io/prerelease:' charts/openbao-operator/Chart.yaml; then
            echo "artifacthub.io/prerelease annotation not found in Chart.yaml" >&2
            exit 1
          fi

          sed -E -i.bak \
            's|^([[:space:]]*artifacthub\.io/prerelease:[[:space:]]*).*$|\1"'"${PRE}"'"|' \
            charts/openbao-operator/Chart.yaml
          rm -f charts/openbao-operator/Chart.yaml.bak

          grep -n 'artifacthub.io/prerelease:' charts/openbao-operator/Chart.yaml

      - name: Verify Artifact Hub prerelease annotation
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
        run: |
          set -euo pipefail
          if [[ "${CHART_VERSION}" == *-* ]]; then
            expected="true"
          else
            expected="false"
          fi

          actual="$(sed -nE 's/^[[:space:]]*artifacthub\.io\/prerelease:[[:space:]]*"(true|false)"[[:space:]]*$/\1/p' charts/openbao-operator/Chart.yaml | head -n1)"
          if [[ -z "${actual}" ]]; then
            echo "Could not parse artifacthub.io/prerelease from Chart.yaml" >&2
            exit 1
          fi
          if [[ "${actual}" != "${expected}" ]]; then
            echo "artifacthub.io/prerelease mismatch: expected=${expected} actual=${actual}" >&2
            exit 1
          fi

      - name: Set Artifact Hub images annotation
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart="charts/openbao-operator/Chart.yaml"

          if ! grep -Eq '^[[:space:]]*artifacthub\.io/images:' "${chart}"; then
            echo "artifacthub.io/images annotation not found in Chart.yaml" >&2
            exit 1
          fi

          awk -v owner="${OWNER}" -v version="${CHART_VERSION}" '
            BEGIN {in_images=0; replaced=0}
            /^[[:space:]]*artifacthub\.io\/images:[[:space:]]*\|[[:space:]]*$/ {
              print "  artifacthub.io/images: |"
              print "    - name: openbao-operator"
              print "      image: ghcr.io/" owner "/openbao-operator:" version
              print "    - name: openbao-init"
              print "      image: ghcr.io/" owner "/openbao-init:" version
              print "    - name: openbao-backup"
              print "      image: ghcr.io/" owner "/openbao-backup:" version
              print "    - name: openbao-upgrade"
              print "      image: ghcr.io/" owner "/openbao-upgrade:" version
              in_images=1
              replaced=1
              next
            }
            in_images {
              if ($0 ~ /^  artifacthub\.io\//) {
                in_images=0
              } else {
                next
              }
            }
            { print }
            END {
              if (replaced != 1) {
                exit 44
              }
            }
          ' "${chart}" > "${chart}.tmp" || {
            code="$?"
            rm -f "${chart}.tmp"
            if [[ "${code}" == "44" ]]; then
              echo "failed to replace artifacthub.io/images annotation block" >&2
            fi
            exit "${code}"
          }
          mv "${chart}.tmp" "${chart}"

          sed -n '/artifacthub.io\/images:/,/artifacthub.io\/maintainers:/p' "${chart}"

      - name: Verify Artifact Hub images annotation
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart="charts/openbao-operator/Chart.yaml"
          images=(
            openbao-operator
            openbao-init
            openbao-backup
            openbao-upgrade
          )
          for image in "${images[@]}"; do
            if ! grep -Eq "^[[:space:]]*image:[[:space:]]*ghcr\\.io/${OWNER}/${image}:${CHART_VERSION}[[:space:]]*$" "${chart}"; then
              echo "artifacthub.io/images entry missing or invalid for ${image}" >&2
              exit 1
            fi
          done

      - name: Lint Helm chart (release)
        run: |
          set -euo pipefail
          helm lint charts/openbao-operator

      - name: Package and push Helm chart (OCI)
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io -u "${GITHUB_ACTOR}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/openbao-operator
          if [[ ! -f "openbao-operator-${CHART_VERSION}.tgz" ]]; then
            echo "expected helm package openbao-operator-${CHART_VERSION}.tgz was not created" >&2
            ls -1 openbao-operator-*.tgz 2>/dev/null || true
            exit 1
          fi
          helm push "openbao-operator-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Setup Go (for crane)
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install crane
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.7

      - name: Resolve Helm chart digest (OCI)
        id: chart-digest
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart_ref="ghcr.io/${OWNER}/charts/openbao-operator:${CHART_VERSION}"
          chart_digest="$(crane digest "${chart_ref}")"
          echo "chart_digest=${chart_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign Helm chart by digest (OCI)
        env:
          OWNER: ${{ github.repository_owner }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "ghcr.io/${OWNER}/charts/openbao-operator@${CHART_DIGEST}"

      - name: Attest Helm chart provenance (GitHub)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/openbao-operator
          subject-digest: ${{ steps.chart-digest.outputs.chart_digest }}
          push-to-registry: true

      - name: Verify Helm chart signature (bundle format)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=true \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${{ needs.prepare.outputs.version }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${OWNER}/charts/openbao-operator@${CHART_DIGEST}" >/dev/null

      - name: Generate digest-pinned installer manifest
        env:
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          make build-installer \
            IMG="${MANAGER_IMAGE}@${MANAGER_DIGEST}" \
            OPERATOR_VERSION="${VERSION}"

      - name: Generate CRDs manifest
        run: |
          set -euo pipefail
          make build-crds

      - name: Generate SBOMs (SPDX JSON)
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
          format: spdx-json
          output-file: dist/sbom-openbao-operator.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOMs (SPDX JSON) - config-init
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
          format: spdx-json
          output-file: dist/sbom-openbao-init.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOMs (SPDX JSON) - backup executor
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
          format: spdx-json
          output-file: dist/sbom-openbao-backup.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOMs (SPDX JSON) - upgrade executor
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}
          format: spdx-json
          output-file: dist/sbom-openbao-upgrade.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum dist/install.yaml dist/crds.yaml dist/sbom-*.spdx.json > dist/checksums.txt

      - name: Attest release checksums provenance (GitHub)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/checksums.txt

      - name: Sign release checksums (keyless, bundle format)
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify release checksums signature (bundle format)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${{ needs.prepare.outputs.version }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify chart + release-asset attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: bash hack/ci/verify-release-artifact-attestations.sh

      - name: Generate provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: bash hack/ci/generate-provenance-index.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          prerelease_flag=""
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease_flag="--prerelease"
          fi

          # Source-of-truth for versioning and release notes is release-please.
          # This workflow only uploads release assets and publishes the draft release.
          if ! gh release view "${version}" >/dev/null 2>&1; then
            echo "GitHub Release '${version}' not found." >&2
            echo "Merge the release-please PR to create the tag and draft release." >&2
            exit 1
          fi

          assets=(
            dist/install.yaml
            dist/crds.yaml
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/sbom-openbao-operator.spdx.json
            dist/sbom-openbao-init.spdx.json
            dist/sbom-openbao-backup.spdx.json
            dist/sbom-openbao-upgrade.spdx.json
            dist/provenance-index.json
          )

          declare -A existing_asset_sizes=()
          while IFS=$'\t' read -r name size; do
            if [[ -n "${name}" ]]; then
              existing_asset_sizes["${name}"]="${size}"
            fi
          done < <(gh release view "${version}" --json assets --jq '.assets[]? | [.name, (.size|tostring)] | @tsv')

          tmp_existing="$(mktemp -d)"
          trap 'rm -rf "${tmp_existing}"' EXIT

          to_upload=()
          for file in "${assets[@]}"; do
            name="$(basename "${file}")"
            if [[ -n "${existing_asset_sizes[${name}]-}" ]]; then
              local_size="$(stat -c%s "${file}")"
              if [[ "${local_size}" != "${existing_asset_sizes[${name}]}" ]]; then
                echo "Release asset '${name}' already exists but size differs (local=${local_size}, release=${existing_asset_sizes[${name}]})" >&2
                echo "Immutable releases cannot delete/replace assets; investigate the mismatch or create a new release." >&2
                exit 1
              fi

              gh release download "${version}" --pattern "${name}" --dir "${tmp_existing}"
              local_sha="$(sha256sum "${file}" | awk '{print $1}')"
              release_sha="$(sha256sum "${tmp_existing}/${name}" | awk '{print $1}')"
              if [[ "${local_sha}" != "${release_sha}" ]]; then
                echo "Release asset '${name}' already exists but content differs (local_sha=${local_sha}, release_sha=${release_sha})" >&2
                echo "Immutable releases cannot delete/replace assets; investigate the mismatch or create a new release." >&2
                exit 1
              fi
              continue
            fi
            to_upload+=("${file}")
          done

          if (( ${#to_upload[@]} > 0 )); then
            gh release upload "${version}" "${to_upload[@]}"
          fi

          # Ensure releases are published and marked correctly.
          if [[ -n "${prerelease_flag}" ]]; then
            gh release edit "${version}" --title "${version}" --draft=false --prerelease
          else
            gh release edit "${version}" --title "${version}" --draft=false --latest
          fi

  deploy-docs:
    name: Deploy Versioned Docs
    runs-on: *runner
    needs: [prepare, promote]
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: Install dependencies
        run: uv pip install --system mkdocs-material mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy versioned docs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            mike deploy --push "${VERSION}"
            exit 0
          fi
          mike deploy --push --update-aliases "${VERSION}" latest
