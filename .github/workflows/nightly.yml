name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (vulncheck + Trivy FS)
    runs-on: &runner ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=vendor
        run: make vulncheck

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_minimal_role.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml,config/rbac/single_tenant_clusterrole.yaml,dist/install.yaml
          skip-dirs: test/manifests,vendor
          trivy-config: .trivy.yaml

  openbao-config-compat:
    name: OpenBao Config Compatibility (OpenBao >=2.4.0 <2.5.0)
    runs-on: *runner
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Validate HCL fixtures against upstream OpenBao parser
        env:
          REPORT_SCHEMA_DRIFT: "true"
        run: bash hack/ci/openbao-config-compat.sh 2.4.4 2.5.0

      - name: Report operator-vs-upstream config schema drift (informational)
        env:
          GOFLAGS: -mod=mod
        run: go run ./hack/tools/openbao_operator_schema_drift --openbao-image-tag 2.5.0

  build-artifacts:
    name: Build Artifacts
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build Linux Binaries
        env:
          GOFLAGS: -mod=vendor
        run: make build-linux

      - name: Upload Binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64/
          retention-days: 1

  build-e2e-images:
    name: Build E2E Images Once
    runs-on: *runner
    needs: build-artifacts
    permissions:
      contents: read
      packages: write
    outputs:
      manager_ref: ${{ steps.refs.outputs.manager_ref }}
      config_init_ref: ${{ steps.refs.outputs.config_init_ref }}
      backup_executor_ref: ${{ steps.refs.outputs.backup_executor_ref }}
      upgrade_executor_ref: ${{ steps.refs.outputs.upgrade_executor_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Binaries
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Prepare Binaries
        run: chmod +x bin/linux_amd64/*

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.31.1

      - name: Compute E2E image tag
        id: tag
        run: |
          set -euo pipefail
          echo "value=nightly-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Build operator image
        id: build-manager
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.manager
          build-args: |
            BINARY=bin/linux_amd64/manager
            TARGET=/manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-operator:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-operator
          cache-to: type=gha,mode=max,scope=openbao-operator

      - name: Build init image
        id: build-init
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.init
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-init:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-init
          cache-to: type=gha,mode=max,scope=openbao-init

      - name: Build backup image
        id: build-backup
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.backup
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-backup:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-backup
          cache-to: type=gha,mode=max,scope=openbao-backup

      - name: Build upgrade image
        id: build-upgrade
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.upgrade
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-upgrade:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-upgrade
          cache-to: type=gha,mode=max,scope=openbao-upgrade

      - name: Publish image refs
        id: refs
        run: |
          set -euo pipefail
          echo "manager_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-operator:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"
          echo "config_init_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-init:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"
          echo "backup_executor_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-backup:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"
          echo "upgrade_executor_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-upgrade:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"

  e2e:
    name: E2E (kind ${{ matrix.k8s }})
    runs-on: *runner
    needs: [build-artifacts, build-e2e-images]
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - 1.33.7
          - 1.34.3
          - 1.35.0
    env:
      KIND_NODE_IMAGE: kindest/node:v${{ matrix.k8s }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt E2E images
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-e2e-images.outputs.manager_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.config_init_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.backup_executor_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}"

      - name: Create Kind Cluster
        run: |
          if ! kind get clusters | grep -q "kind"; then
            kind create cluster --name kind --image $KIND_NODE_IMAGE
          fi

      - name: Run full E2E
        env:
          GOFLAGS: -mod=vendor
          OPENBAO_REQUEUE_STANDARD: 10s
          KIND_CLUSTER: kind
          E2E_PARALLEL_NODES: "1"
          E2E_TIMEOUT: 90m
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_ENABLE_HARDENED_SIGNED_SUITE: "true"
          E2E_OPERATOR_IMAGE: ${{ needs.build-e2e-images.outputs.manager_ref }}
          E2E_OPENBAO_IMAGE: ghcr.io/openbao/openbao:2.5.0
          E2E_CONFIG_INIT_IMAGE: ${{ needs.build-e2e-images.outputs.config_init_ref }}
          E2E_HARDENED_CONFIG_INIT_IMAGE: ghcr.io/dc-tec/openbao-init:edge
          E2E_BACKUP_EXECUTOR_IMAGE: ${{ needs.build-e2e-images.outputs.backup_executor_ref }}
          E2E_UPGRADE_EXECUTOR_IMAGE: ${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}
        run: make test-e2e-ci

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-artifacts-kind-${{ matrix.k8s }}
          path: artifacts/
          retention-days: 7

  docs:
    name: Docs Build
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build docs
        uses: ./.github/actions/mkdocs-build

  helm:
    name: Helm Chart
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=vendor
        run: make verify-helm

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null
