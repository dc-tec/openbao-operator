name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (govulncheck + Trivy FS)
    runs-on: &runner ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run govulncheck
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -test ./...

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_delegate_clusterrole.yaml,config/rbac/provisioner_minimal_role.yaml,config/rbac/single_tenant_clusterrole.yaml,dist/install.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml
          skip-dirs: test/manifests
          trivy-config: .trivy.yaml

  openbao-config-compat:
    name: OpenBao Config Compatibility (OpenBao >=2.4.0 <2.5.0)
    runs-on: *runner
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Validate HCL fixtures against upstream OpenBao parser
        env:
          REPORT_SCHEMA_DRIFT: "true"
        run: bash hack/ci/openbao-config-compat.sh 2.4.0 2.4.1 2.4.3 2.4.4

      - name: Report operator-vs-upstream config schema drift (informational)
        run: go run ./hack/tools/openbao_operator_schema_drift --openbao-image-tag 2.4.4

  build-artifacts:
    name: Build Artifacts
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build Linux Binaries
        env:
          GOFLAGS: -mod=readonly
        run: make build-linux

      - name: Upload Binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64/
          retention-days: 1

  e2e:
    name: E2E (kind ${{ matrix.k8s }})
    runs-on: *runner
    needs: build-artifacts
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - 1.33.7
          - 1.34.3
          - 1.35.0
    env:
      KIND_NODE_IMAGE: kindest/node:v${{ matrix.k8s }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Download Binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Prepare Binaries
        run: chmod +x bin/linux_amd64/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build operator image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.manager

          build-args: |
            BINARY=bin/linux_amd64/manager
            TARGET=/manager
          tags: openbao-operator:e2e
          load: true
          push: false
          cache-from: type=gha,scope=openbao-operator
          cache-to: type=gha,mode=max,scope=openbao-operator

      - name: Build init image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.init
          tags: openbao-init:e2e
          load: true
          push: false
          cache-from: type=gha,scope=openbao-init
          cache-to: type=gha,mode=max,scope=openbao-init

      - name: Build backup image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.backup
          tags: openbao-backup:e2e
          load: true
          push: false
          cache-from: type=gha,scope=openbao-backup
          cache-to: type=gha,mode=max,scope=openbao-backup

      - name: Build upgrade image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.upgrade
          tags: openbao-upgrade:e2e
          load: true
          push: false
          cache-from: type=gha,scope=openbao-upgrade
          cache-to: type=gha,mode=max,scope=openbao-upgrade

      - name: Create Kind Cluster
        run: |
          if ! kind get clusters | grep -q "kind"; then
            kind create cluster --name kind --image $KIND_NODE_IMAGE
          fi

      - name: Load Images into Kind
        run: |
          kind load docker-image openbao-operator:e2e --name kind
          kind load docker-image openbao-init:e2e --name kind
          kind load docker-image openbao-backup:e2e --name kind
          kind load docker-image openbao-upgrade:e2e --name kind

      - name: Run full E2E
        env:
          GOFLAGS: -mod=readonly
          OPENBAO_REQUEUE_STANDARD: 10s
          KIND_CLUSTER: kind
          E2E_PARALLEL_NODES: "1"
          E2E_TIMEOUT: 90m
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_OPERATOR_IMAGE: openbao-operator:e2e
          E2E_CONFIG_INIT_IMAGE: openbao-init:e2e
          E2E_BACKUP_EXECUTOR_IMAGE: openbao-backup:e2e
          E2E_UPGRADE_EXECUTOR_IMAGE: openbao-upgrade:e2e
        run: make test-e2e-ci

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-artifacts-kind-${{ matrix.k8s }}
          path: artifacts/
          retention-days: 7

  docs:
    name: Docs Build
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build docs
        uses: ./.github/actions/mkdocs-build

  helm:
    name: Helm Chart
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=readonly
        run: make verify-helm

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null
