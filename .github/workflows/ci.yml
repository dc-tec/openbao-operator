name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_full_e2e:
        description: Run the full PR E2E suite for the selected ref.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: &runner ubuntu-24.04
    outputs:
      manual_full_e2e: ${{ steps.diff.outputs.manual_full_e2e }}
      chart: ${{ steps.diff.outputs.chart }}
      workflow: ${{ steps.diff.outputs.workflow }}
      docs: ${{ steps.diff.outputs.docs }}
      go_quality: ${{ steps.diff.outputs.go_quality }}
      go_tests: ${{ steps.diff.outputs.go_tests }}
      config_compat: ${{ steps.diff.outputs.config_compat }}
      security_scan: ${{ steps.diff.outputs.security_scan }}
      e2e: ${{ steps.diff.outputs.e2e }}
      e2e_backup: ${{ steps.diff.outputs.e2e_backup }}
      e2e_upgrade: ${{ steps.diff.outputs.e2e_upgrade }}
      e2e_hardened: ${{ steps.diff.outputs.e2e_hardened }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect chart changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "manual_full_e2e=${{ inputs.force_full_e2e && 'true' || 'false' }}" >> "${GITHUB_OUTPUT}"
            for key in chart workflow docs go_quality go_tests config_compat security_scan e2e e2e_backup e2e_upgrade e2e_hardened; do
              echo "${key}=false" >> "${GITHUB_OUTPUT}"
            done
            echo "::notice::workflow_dispatch run: skipping diff-based routing and using manual inputs."
            exit 0
          fi

          echo "manual_full_e2e=false" >> "${GITHUB_OUTPUT}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

          # Ensure base exists locally (checkout may not contain it for PRs).
          git fetch --no-tags --prune --depth=1 origin "${base_sha}" || true

          changed="$(git diff --name-only "${base_sha}" "${head_sha}" || true)"
          if echo "${changed}" | grep -qE '^(charts/openbao-operator/|config/(crd|policy|rbac)/|hack/helm(chart|values)/)'; then
            echo "chart=true" >> "${GITHUB_OUTPUT}"
          else
            echo "chart=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(\.github/workflows/|\.github/actions/)'; then
            echo "workflow=true" >> "${GITHUB_OUTPUT}"
          else
            echo "workflow=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(docs/|mkdocs\.yml|README\.md|\.github/actions/mkdocs-build/)'; then
            echo "docs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "docs=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/|cmd/|api/|config/|test/|docs/reference/api\.md|go\.(mod|sum)$|vendor/|Makefile|mk/|hack/(ci/|boilerplate\.go\.txt)|\.golangci\.yml|\.github/tools/)'; then
            echo "go_quality=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go_quality=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/|cmd/|api/|config/|go\.(mod|sum)$|vendor/|Makefile|mk/|test/(integration/|unit/))'; then
            echo "go_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go_tests=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(api/|internal/adapter/config/|internal/service/infra/|internal/app/openbaocluster/|internal/controller/openbaocluster/|go\.(mod|sum)$|Makefile|mk/)'; then
            echo "config_compat=true" >> "${GITHUB_OUTPUT}"
          else
            echo "config_compat=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/|cmd/|api/|config/|charts/|Dockerfile(\..*)?$|hack/ci/|go\.(mod|sum)$|vendor/|\.trivyignore|\.trivy\.yaml|Makefile|mk/)'; then
            echo "security_scan=true" >> "${GITHUB_OUTPUT}"
          else
            echo "security_scan=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/|cmd/|api/|test/e2e/|Dockerfile(\..*)?$|hack/ci/|go\.(mod|sum)$|Makefile|mk/)'; then
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/service/backup/|internal/service/restore/|cmd/bao-backup/|test/e2e/(e2e_suite_test\.go|framework/.*|helpers/.*|backup_restore_test\.go)|Makefile|mk/)'; then
            echo "e2e_backup=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_backup=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/service/upgrade/|cmd/bao-upgrade/|test/e2e/(e2e_suite_test\.go|framework/.*|helpers/.*|Upgrade_Strategies_test\.go|Upgrade_Target_Drift_test\.go|Upgrade_Operation_Lock_test\.go)|Makefile|mk/)'; then
            echo "e2e_upgrade=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_upgrade=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/adapter/security/|internal/platform/admission/|internal/service/provisioner/|cmd/provisioner/|config/policy/|internal/controller/|cmd/controller/|test/e2e/(e2e_suite_test\.go|framework/.*|helpers/.*|Cluster_Profile_Hardened_test\.go|Cluster_TLS_ACME_test\.go|GitOps_Contract_test\.go|hardened_signed_suite\.go)|Makefile|mk/)'; then
            echo "e2e_hardened=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_hardened=false" >> "${GITHUB_OUTPUT}"
          fi
  security:
    name: Security (vulncheck + Trivy FS)
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.security_scan == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=vendor
        run: make vulncheck

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_minimal_role.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml,config/rbac/single_tenant_clusterrole.yaml,config/overlays/single-tenant/single_tenant_clusterrole.yaml,config/overlays/single-tenant-custom-identity/single_tenant_clusterrole.yaml,dist/install.yaml
          skip-dirs: test/manifests,vendor
          trivy-config: .trivy.yaml

  dependency-licenses:
    name: Dependency Licenses
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.security_scan == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify shipped dependency licenses
        run: make license-check

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.workflow == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Install actionlint
        env:
          GOFLAGS: -mod=mod
          GOBIN: ${{ github.workspace }}/bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

      - name: Run actionlint
        run: |
          "${GITHUB_WORKSPACE}/bin/actionlint" .github/workflows/*.yml

  lint:
    name: Lint
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_quality == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Node (for ast-grep install)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json

      - name: Install ast-grep
        run: npm ci --prefix .github/tools

      - name: Add local npm tools to PATH
        run: echo "${GITHUB_WORKSPACE}/.github/tools/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Verify ast-grep version
        shell: bash
        run: |
          set -euo pipefail
          version="$(ast-grep --version)"
          echo "${version}"
          test "${version}" = "ast-grep 0.41.0"

      - name: Run linter
        run: make lint-ci

  verify-fmt:
    name: Verify Formatting
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_quality == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify gofmt
        run: make verify-fmt

  tidy-check:
    name: Verify go.mod/go.sum
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_quality == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify tidy
        run: make verify-tidy

  verify-vendor:
    name: Verify vendor/
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_quality == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Verify vendor tree
        run: make verify-vendor

  verify-generated:
    name: Verify Generated Artifacts
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_quality == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify generated files
        run: make verify-generated

  test-unit:
    name: Unit Tests
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_tests == 'true'
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run unit tests
        run: make test

  test-integration:
    name: Envtest Integration
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.go_tests == 'true'
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run integration tests
        run: |
          make test-integration

  openbao-config-compat:
    name: OpenBao Config Compatibility (OpenBao >=2.4.0 <2.6.0)
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.config_compat == 'true'
    runs-on: *runner
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run OpenBao config compatibility
        uses: ./.github/actions/run-openbao-config-compat
        with:
          versions: 2.4.4 2.5.0

  docs:
    name: Docs Build
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.docs == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build docs
        uses: ./.github/actions/mkdocs-build

  helm:
    name: Helm Chart
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.chart == 'true'
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=vendor
        run: make verify-helm

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null

      - name: Verify OpenShift templating (SCC-compatible)
        run: bash hack/ci/verify-openshift-helm.sh

  helm-e2e-smoke:
    name: Helm E2E Smoke (kind)
    runs-on: *runner
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Run Helm E2E smoke
        env:
          GOFLAGS: -mod=vendor
        run: make helm-e2e-smoke

  build-artifacts:
    name: Build Artifacts
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.manual_full_e2e == 'true' || (((needs.changes.outputs.e2e == 'true' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') || contains(github.event.pull_request.labels.*.name, 'backup') || contains(github.event.pull_request.labels.*.name, 'upgrades') || contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'provisioner') || contains(github.event.pull_request.labels.*.name, 'admission') || contains(github.event.pull_request.labels.*.name, 'controller'))))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Build Linux Binaries
        env:
          GOFLAGS: -mod=vendor
        run: make build-linux

      - name: Upload Binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64/
          retention-days: 1

  build-e2e-images:
    name: Build E2E Images Once
    runs-on: *runner
    needs: [changes, build-artifacts]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.manual_full_e2e == 'true' || (((needs.changes.outputs.e2e == 'true' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') || contains(github.event.pull_request.labels.*.name, 'backup') || contains(github.event.pull_request.labels.*.name, 'upgrades') || contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'provisioner') || contains(github.event.pull_request.labels.*.name, 'admission') || contains(github.event.pull_request.labels.*.name, 'controller'))))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      packages: write
    outputs:
      manager_ref: ${{ steps.refs.outputs.manager_ref }}
      config_init_ref: ${{ steps.refs.outputs.config_init_ref }}
      backup_executor_ref: ${{ steps.refs.outputs.backup_executor_ref }}
      upgrade_executor_ref: ${{ steps.refs.outputs.upgrade_executor_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Binaries
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Prepare Binaries
        run: chmod +x bin/linux_amd64/*

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.31.1

      - name: Compute E2E image tag
        id: tag
        run: |
          set -euo pipefail
          echo "value=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Build operator image
        id: build-manager
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.manager
          build-args: |
            BINARY=bin/linux_amd64/manager
            TARGET=/manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-operator:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-operator
          cache-to: type=gha,mode=max,scope=openbao-operator

      - name: Build init image
        id: build-init
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.init
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-init:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-init
          cache-to: type=gha,mode=max,scope=openbao-init

      - name: Build backup image
        id: build-backup
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.backup
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-backup:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-backup
          cache-to: type=gha,mode=max,scope=openbao-backup

      - name: Build upgrade image
        id: build-upgrade
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.upgrade
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-upgrade:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-upgrade
          cache-to: type=gha,mode=max,scope=openbao-upgrade

      - name: Publish image refs
        id: refs
        run: |
          set -euo pipefail
          {
            echo "manager_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-operator:${{ steps.tag.outputs.value }}"
            echo "config_init_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-init:${{ steps.tag.outputs.value }}"
            echo "backup_executor_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-backup:${{ steps.tag.outputs.value }}"
            echo "upgrade_executor_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-upgrade:${{ steps.tag.outputs.value }}"
          } >> "${GITHUB_OUTPUT}"

  e2e:
    needs: [changes, build-e2e-images]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.manual_full_e2e == 'true' || (((needs.changes.outputs.e2e == 'true' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') || contains(github.event.pull_request.labels.*.name, 'backup') || contains(github.event.pull_request.labels.*.name, 'upgrades') || contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'provisioner') || contains(github.event.pull_request.labels.*.name, 'admission') || contains(github.event.pull_request.labels.*.name, 'controller'))))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    name: E2E (${{ matrix.name }})
    runs-on: *runner
    permissions:
      contents: read
      packages: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Core Lifecycle & Manager"
            label_filter: "(((lifecycle && !tls) || manager) && !openshift)"
            pr_scope: "always"
            timeout_minutes: 45
            e2e_timeout: "40m"
            exclude_pentest_on_default_pr: "false"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
            hardened_upgrade_executor_image: ""
            load_backup_executor_image: "false"
            load_upgrade_executor_image: "false"
            preload_upgrade_images: "false"
            preload_hardened_assets: "false"
          - name: "Security & Tenants"
            label_filter: "(((security || tenant || tenancy || tls) && !profile-hardened && !gitops && !(tls && slow)) && !openshift)"
            pr_scope: "always"
            timeout_minutes: 45
            e2e_timeout: "40m"
            exclude_pentest_on_default_pr: "true"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
            hardened_upgrade_executor_image: ""
            load_backup_executor_image: "false"
            load_upgrade_executor_image: "false"
            preload_upgrade_images: "false"
            preload_hardened_assets: "false"
          - name: "Backup & Restore"
            label_filter: "((dr || restore) && !openshift)"
            pr_scope: "backup"
            timeout_minutes: 45
            e2e_timeout: "40m"
            exclude_pentest_on_default_pr: "false"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
            hardened_upgrade_executor_image: ""
            load_backup_executor_image: "true"
            load_upgrade_executor_image: "false"
            preload_upgrade_images: "false"
            preload_hardened_assets: "false"
          - name: "Upgrade Rolling"
            label_filter: "((upgrade && (rolling || validation || guardrails || snapshot || recovery || operation-lock) && !hardened) && !openshift)"
            pr_scope: "upgrade"
            timeout_minutes: 45
            e2e_timeout: "40m"
            exclude_pentest_on_default_pr: "false"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
            hardened_upgrade_executor_image: ""
            load_backup_executor_image: "true"
            load_upgrade_executor_image: "true"
            preload_upgrade_images: "true"
            preload_hardened_assets: "false"
          - name: "Upgrade Blue/Green"
            label_filter: "((upgrade && (bluegreen || gateway || verification || rollback || chaos || failure) && !hardened) && !openshift)"
            pr_scope: "upgrade"
            timeout_minutes: 60
            e2e_timeout: "55m"
            exclude_pentest_on_default_pr: "false"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
            hardened_upgrade_executor_image: ""
            load_backup_executor_image: "true"
            load_upgrade_executor_image: "true"
            preload_upgrade_images: "true"
            preload_hardened_assets: "false"
          - name: "Hardened (Signed)"
            label_filter: "((profile-hardened || gitops || (tls && slow)) && !openshift)"
            pr_scope: "hardened"
            timeout_minutes: 45
            e2e_timeout: "40m"
            exclude_pentest_on_default_pr: "false"
            hardened_signed: "true"
            openbao_image: "ghcr.io/openbao/openbao:2.5.0"
            hardened_init_image: "ghcr.io/dc-tec/openbao-init:edge"
            hardened_upgrade_executor_image: "ghcr.io/dc-tec/openbao-upgrade:edge"
            load_backup_executor_image: "true"
            load_upgrade_executor_image: "true"
            preload_upgrade_images: "true"
            preload_hardened_assets: "true"
    env:
      KIND_NODE_IMAGE: kindest/node:v1.34.3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine E2E Filter
        id: filter
        run: |
          set -euo pipefail

          HAS_E2E_CHANGES="${{ needs.changes.outputs.e2e == 'true' }}"
          FULL_E2E="${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.manual_full_e2e == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')) }}"
          PR_BACKUP="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'backup') }}"
          PR_UPGRADE="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'upgrades') }}"
          PR_HARDENED="${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'provisioner') || contains(github.event.pull_request.labels.*.name, 'admission') || contains(github.event.pull_request.labels.*.name, 'controller')) }}"

          FILTER='${{ matrix.label_filter }}'
          SHOULD_RUN="false"

          case "${{ matrix.pr_scope }}" in
            always)
              if [[ "${FULL_E2E}" == "true" ]] || [[ "${HAS_E2E_CHANGES}" == "true" ]]; then
                SHOULD_RUN="true"
              fi
              ;;
            backup)
              if [[ "${FULL_E2E}" == "true" ]] || [[ "${PR_BACKUP}" == "true" ]] || [[ "${{ needs.changes.outputs.e2e_backup }}" == "true" ]]; then
                SHOULD_RUN="true"
              fi
              ;;
            upgrade)
              if [[ "${FULL_E2E}" == "true" ]] || [[ "${PR_UPGRADE}" == "true" ]] || [[ "${{ needs.changes.outputs.e2e_upgrade }}" == "true" ]]; then
                SHOULD_RUN="true"
              fi
              ;;
            hardened)
              if [[ "${FULL_E2E}" == "true" ]] || [[ "${PR_HARDENED}" == "true" ]] || [[ "${{ needs.changes.outputs.e2e_hardened }}" == "true" ]]; then
                SHOULD_RUN="true"
              fi
              ;;
          esac

          if [[ "${FULL_E2E}" != "true" ]] && [[ "${{ matrix.exclude_pentest_on_default_pr }}" == "true" ]] && [[ "${PR_HARDENED}" != "true" ]]; then
            FILTER="(${FILTER}) && !pentest"
          fi

          echo "E2E_LABEL_FILTER=$FILTER" >> "${GITHUB_ENV}"
          echo "SHOULD_RUN=$SHOULD_RUN" >> "${GITHUB_ENV}"
          if [[ "$SHOULD_RUN" == "false" ]]; then
            echo "::notice::Skipping ${{ matrix.name }} shard (routing optimization)"
          else
            echo "::notice::Running ${{ matrix.name }} with filter: $FILTER"
          fi

      - name: Setup repo tools
        if: env.SHOULD_RUN == 'true'
        uses: ./.github/actions/setup-repo-tools

      - name: Install kind (pinned)
        if: env.SHOULD_RUN == 'true'
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        if: env.SHOULD_RUN == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt E2E images
        if: env.SHOULD_RUN == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-e2e-images.outputs.manager_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.config_init_ref }}"
          if [[ "${{ matrix.load_backup_executor_image }}" == "true" ]]; then
            docker pull "${{ needs.build-e2e-images.outputs.backup_executor_ref }}"
          fi
          if [[ "${{ matrix.load_upgrade_executor_image }}" == "true" ]] && [[ -n "${{ matrix.hardened_upgrade_executor_image }}" ]]; then
            docker pull "${{ matrix.hardened_upgrade_executor_image }}"
          elif [[ "${{ matrix.load_upgrade_executor_image }}" == "true" ]]; then
            docker pull "${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}"
          fi

      - name: Create Kind Cluster
        if: env.SHOULD_RUN == 'true'
        run: |
          if ! kind get clusters | grep -q "kind"; then
            kind create cluster --name kind --image "${KIND_NODE_IMAGE}"
          fi

      - name: Run E2E Tests
        if: env.SHOULD_RUN == 'true'
        env:
          GOFLAGS: -mod=vendor
          OPENBAO_REQUEUE_STANDARD: 10s
          # E2E_LABEL_FILTER is set by previous step
          E2E_PARALLEL_NODES: "1"
          E2E_TIMEOUT: ${{ matrix.e2e_timeout }}
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_ENABLE_HARDENED_SIGNED_SUITE: ${{ matrix.hardened_signed }}
          E2E_OPERATOR_IMAGE: ${{ needs.build-e2e-images.outputs.manager_ref }}
          E2E_OPENBAO_IMAGE: ${{ matrix.openbao_image }}
          E2E_CONFIG_INIT_IMAGE: ${{ needs.build-e2e-images.outputs.config_init_ref }}
          E2E_HARDENED_CONFIG_INIT_IMAGE: ${{ matrix.hardened_init_image }}
          E2E_HARDENED_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.hardened_upgrade_executor_image }}
          E2E_BACKUP_EXECUTOR_IMAGE: ${{ needs.build-e2e-images.outputs.backup_executor_ref }}
          E2E_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.hardened_upgrade_executor_image != '' && matrix.hardened_upgrade_executor_image || needs.build-e2e-images.outputs.upgrade_executor_ref }}
          E2E_LOAD_BACKUP_EXECUTOR_IMAGE: ${{ matrix.load_backup_executor_image }}
          E2E_LOAD_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.load_upgrade_executor_image }}
          E2E_PRELOAD_UPGRADE_IMAGES: ${{ matrix.preload_upgrade_images }}
          E2E_PRELOAD_HARDENED_ASSETS: ${{ matrix.preload_hardened_assets }}
          KIND_CLUSTER: kind
        run: make test-e2e-ci

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Prepare E2E artifact name (failure)
        if: failure()
        run: |
          set -euo pipefail
          sanitized_name="$(printf '%s' '${{ matrix.name }}' | tr '/\\:*?\"<>|' '-')"
          echo "E2E_ARTIFACT_NAME=e2e-artifacts-${sanitized_name}" >> "${GITHUB_ENV}"

      - name: Upload E2E artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.E2E_ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 7

  ci-required:
    name: CI Required
    runs-on: *runner
    if: always()
    needs:
      - changes
      - security
      - dependency-licenses
      - workflow-lint
      - lint
      - verify-fmt
      - tidy-check
      - verify-vendor
      - verify-generated
      - test-unit
      - test-integration
      - openbao-config-compat
      - docs
      - helm
      - helm-e2e-smoke
      - build-artifacts
      - build-e2e-images
      - e2e
    steps:
      - name: Validate required CI graph
        env:
          CHANGES: ${{ needs.changes.result }}
          SECURITY: ${{ needs.security.result }}
          DEPENDENCY_LICENSES: ${{ needs.dependency-licenses.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          LINT: ${{ needs.lint.result }}
          VERIFY_FMT: ${{ needs.verify-fmt.result }}
          TIDY_CHECK: ${{ needs.tidy-check.result }}
          VERIFY_VENDOR: ${{ needs.verify-vendor.result }}
          VERIFY_GENERATED: ${{ needs.verify-generated.result }}
          TEST_UNIT: ${{ needs.test-unit.result }}
          TEST_INTEGRATION: ${{ needs.test-integration.result }}
          OPENBAO_CONFIG_COMPAT: ${{ needs.openbao-config-compat.result }}
          DOCS: ${{ needs.docs.result }}
          HELM: ${{ needs.helm.result }}
          HELM_E2E_SMOKE: ${{ needs.helm-e2e-smoke.result }}
          BUILD_ARTIFACTS: ${{ needs.build-artifacts.result }}
          BUILD_E2E_IMAGES: ${{ needs.build-e2e-images.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail

          failures=()
          while IFS='=' read -r job result; do
            case "${result}" in
              success|skipped)
                ;;
              *)
                failures+=("${job}:${result}")
                ;;
            esac
          done <<EOF
          changes=${CHANGES}
          security=${SECURITY}
          dependency-licenses=${DEPENDENCY_LICENSES}
          workflow-lint=${WORKFLOW_LINT}
          lint=${LINT}
          verify-fmt=${VERIFY_FMT}
          tidy-check=${TIDY_CHECK}
          verify-vendor=${VERIFY_VENDOR}
          verify-generated=${VERIFY_GENERATED}
          test-unit=${TEST_UNIT}
          test-integration=${TEST_INTEGRATION}
          openbao-config-compat=${OPENBAO_CONFIG_COMPAT}
          docs=${DOCS}
          helm=${HELM}
          helm-e2e-smoke=${HELM_E2E_SMOKE}
          build-artifacts=${BUILD_ARTIFACTS}
          build-e2e-images=${BUILD_E2E_IMAGES}
          e2e=${E2E}
          EOF

          if [[ "${#failures[@]}" -gt 0 ]]; then
            printf 'Required CI graph failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "Required CI graph completed successfully."

  prepare-edge-candidate:
    name: Prepare Edge Candidate
    runs-on: *runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      repro_build_tag: ${{ steps.vars.outputs.repro_build_tag }}
      source_date_epoch: ${{ steps.vars.outputs.source_date_epoch }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute edge variables
        id: vars
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          build_tag="edge-build-${sha}"
          repro_build_tag="edge-repro-${sha}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          version="edge-${short_sha}"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" ]]; then
            echo "failed to parse chart version from ${chart_file}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          {
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "version=${version}"
            echo "chart_version=${chart_version}"
            echo "build_tag=${build_tag}"
            echo "repro_build_tag=${repro_build_tag}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "manager_image=ghcr.io/${owner}/openbao-operator"
            echo "config_init_image=ghcr.io/${owner}/openbao-init"
            echo "backup_executor_image=ghcr.io/${owner}/openbao-backup"
            echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade"
          } >> "${GITHUB_OUTPUT}"

  build-edge-candidate:
    name: Build + Verify Edge Candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - prepare-edge-candidate
      - security
      - workflow-lint
      - lint
      - verify-fmt
      - tidy-check
      - verify-vendor
      - verify-generated
      - test-unit
      - test-integration
      - openbao-config-compat
      - docs
      - helm
      - e2e
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-channel-hardening.yml
    with:
      ref: ${{ github.sha }}
      source_ref: refs/heads/main
      version: ${{ needs.prepare-edge-candidate.outputs.version }}
      chart_version: ${{ needs.prepare-edge-candidate.outputs.chart_version }}
      build_tag: ${{ needs.prepare-edge-candidate.outputs.build_tag }}
      repro_build_tag: ${{ needs.prepare-edge-candidate.outputs.repro_build_tag }}
      source_date_epoch: ${{ needs.prepare-edge-candidate.outputs.source_date_epoch }}
      manager_image: ${{ needs.prepare-edge-candidate.outputs.manager_image }}
      config_init_image: ${{ needs.prepare-edge-candidate.outputs.config_init_image }}
      backup_executor_image: ${{ needs.prepare-edge-candidate.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ needs.prepare-edge-candidate.outputs.upgrade_executor_image }}
      byte_artifact_name: edge-byte-verified-assets
    secrets: inherit

  assemble-edge-candidate-bundle:
    name: Assemble Edge Candidate Bundle
    runs-on: *runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-edge-candidate, build-edge-candidate]
    permissions:
      contents: read
    steps:
      - name: Download byte-verified edge assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: edge-byte-verified-assets
          path: dist/candidate

      - name: Write edge metadata
        env:
          SHA: ${{ needs.prepare-edge-candidate.outputs.sha }}
          SHORT_SHA: ${{ needs.prepare-edge-candidate.outputs.short_sha }}
          VERSION: ${{ needs.prepare-edge-candidate.outputs.version }}
          CHART_VERSION: ${{ needs.prepare-edge-candidate.outputs.chart_version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare-edge-candidate.outputs.source_date_epoch }}
          MANAGER_IMAGE: ${{ needs.prepare-edge-candidate.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build-edge-candidate.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare-edge-candidate.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build-edge-candidate.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare-edge-candidate.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build-edge-candidate.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare-edge-candidate.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build-edge-candidate.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/candidate/metadata.json
          import json
          import os

          data = {
              "channel": "edge",
              "source_ref": "refs/heads/main",
              "sha": os.environ["SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "version": os.environ["VERSION"],
              "chart_version": os.environ["CHART_VERSION"],
              "source_date_epoch": os.environ["SOURCE_DATE_EPOCH"],
              "build_run_id": os.environ["GITHUB_RUN_ID"],
              "build_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifacts": {
                  "install_yaml": "install.yaml",
                  "crds_yaml": "crds.yaml",
                  "checksums_txt": "checksums.txt",
              },
              "images": {
                  "manager": {"ref": os.environ["MANAGER_IMAGE"], "digest": os.environ["MANAGER_DIGEST"]},
                  "config_init": {"ref": os.environ["CONFIG_INIT_IMAGE"], "digest": os.environ["CONFIG_INIT_DIGEST"]},
                  "backup_executor": {"ref": os.environ["BACKUP_EXECUTOR_IMAGE"], "digest": os.environ["BACKUP_EXECUTOR_DIGEST"]},
                  "upgrade_executor": {"ref": os.environ["UPGRADE_EXECUTOR_IMAGE"], "digest": os.environ["UPGRADE_EXECUTOR_DIGEST"]},
              },
          }

          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Validate edge candidate bundle contents
        run: |
          set -euo pipefail
          for path in \
            dist/candidate/install.yaml \
            dist/candidate/crds.yaml \
            dist/candidate/checksums.txt \
            dist/candidate/metadata.json; do
            test -f "${path}" || { echo "missing required edge candidate file: ${path}" >&2; exit 1; }
          done

      - name: Upload edge candidate bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: edge-candidate-bundle
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 7
