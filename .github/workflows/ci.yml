name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      chart: ${{ steps.diff.outputs.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect chart changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=""

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

          # Ensure base exists locally (checkout may not contain it for PRs).
          git fetch --no-tags --prune --depth=1 origin "${base_sha}" || true

          changed="$(git diff --name-only "${base_sha}" "${head_sha}" || true)"
          if echo "${changed}" | grep -qE '^(charts/openbao-operator/|config/(crd|policy|rbac)/|hack/helm(chart|values)/)'; then
            echo "chart=true" >> "${GITHUB_OUTPUT}"
          else
            echo "chart=false" >> "${GITHUB_OUTPUT}"
          fi

  security:
    name: Security (govulncheck + Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run govulncheck
        env:
          GOFLAGS: -mod=readonly
        run: make govulncheck

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_delegate_clusterrole.yaml,config/rbac/provisioner_minimal_role.yaml,config/rbac/single_tenant_clusterrole.yaml,dist/install.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml
          trivy-config: .trivy.yaml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run linter
        run: make lint-config lint

  verify-fmt:
    name: Verify Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify gofmt
        run: make verify-fmt

  tidy-check:
    name: Verify go.mod/go.sum
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify tidy
        run: make verify-tidy

  verify-generated:
    name: Verify Generated Artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify generated files
        run: make verify-generated

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run unit tests
        run: make test

  test-integration:
    name: Envtest Integration
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run integration tests
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          source <(setup-envtest use -p env --bin-dir $(pwd)/bin/)
          make test-integration

  openbao-config-compat:
    name: OpenBao Config Compatibility (OpenBao >=2.4.0 <2.5.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Validate HCL fixtures against upstream OpenBao parser
        run: bash hack/ci/openbao-config-compat.sh 2.4.0 2.4.4

  docs:
    name: Docs Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build docs
        uses: ./.github/actions/mkdocs-build

  helm:
    name: Helm Chart
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=readonly
        run: make verify-helm

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null

      - name: Verify OpenShift templating (SCC-compatible)
        run: bash hack/ci/verify-openshift-helm.sh

  helm-e2e-smoke:
    name: Helm E2E Smoke (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run Helm E2E smoke
        env:
          GOFLAGS: -mod=readonly
        run: make helm-e2e-smoke

  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Lifecycle & Core"
            focus: "Cluster Lifecycle|Manager|GitOps"
            slow: "false"
          - name: "Backup & Restore"
            focus: "Backup & Restore"
            slow: "true"
          - name: "Upgrades & Chaos"
            focus: "Upgrade|Chaos"
            slow: "true"
          - name: "Security & Tenants"
            focus: "Security|TLS|Tenant Isolation|Hardened|Platform"
            slow: "false"
    env:
      KIND_NODE_IMAGE: kindest/node:v1.34.3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Determine E2E Filter
        id: filter
        run: |
          # Default: Skip slow, nightly, and openshift tests
          FILTER="!slow && !nightly && !openshift"
          
          # Dynamic inclusions based on PR labels (from labeler.yml)
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'upgrades') }}" == "true" ]]; then
            FILTER="$FILTER || (upgrade)"
            echo "::notice::Including UPGRADE tests (detected 'upgrades' label)"
          fi

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'backup') }}" == "true" ]]; then
            FILTER="$FILTER || (backup)"
            echo "::notice::Including BACKUP tests (detected 'backup' label)"
          fi
          
          # Full override: If ci:full-e2e label is present, include everything except openshift
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}" == "true" ]]; then
            echo "::notice::Running FULL E2E suite (ignoring 'slow' skip)"
            FILTER="!openshift"
          else
            echo "::notice::Running E2E suite with filter: $FILTER"
          fi
          
          echo "E2E_LABEL_FILTER=$FILTER" >> $GITHUB_ENV
          
          # Smart Skip Logic
          # Default: Run if not slow, or if specifically included
          SHOULD_RUN="true"
          if [[ "${{ matrix.slow }}" == "true" ]]; then
            # Start assuming skip for slow shards
            SHOULD_RUN="false"
            
            # If full suite is requested
            if [[ "$FILTER" == "!openshift" ]]; then SHOULD_RUN="true"; fi
            
            # If explicit dynamic inclusion matches this shard
            if [[ "${{ matrix.name }}" == *"Backup"* ]] && [[ "$FILTER" == *"backup"* ]]; then SHOULD_RUN="true"; fi
            if [[ "${{ matrix.name }}" == *"Upgrade"* ]] && [[ "$FILTER" == *"upgrade"* ]]; then SHOULD_RUN="true"; fi
            # Note: Chaos has no specific label trigger yet, relies on full-e2e
          fi
          
          echo "SHOULD_RUN=$SHOULD_RUN" >> $GITHUB_ENV
          if [[ "$SHOULD_RUN" == "false" ]]; then
            echo "::notice::Skipping ${{ matrix.name }} shard (Optimization)"
          fi

      - name: Install kind (pinned)
        if: env.SHOULD_RUN == 'true'
        uses: ./.github/actions/install-kind

      - name: Set up Docker Buildx
        if: env.SHOULD_RUN == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and load images
        if: env.SHOULD_RUN == 'true'
        env:
          GOFLAGS: -mod=readonly
        run: |
          make build-linux
          
          docker build -t openbao-operator:e2e -f hack/ci/Dockerfile.fast.manager .
          docker build -t openbao-init:e2e -f hack/ci/Dockerfile.fast.init .
          docker build -t openbao-backup:e2e -f hack/ci/Dockerfile.fast.backup .
          docker build -t openbao-upgrade:e2e -f hack/ci/Dockerfile.fast.upgrade .
          
          # Create cluster explicitly if it doesn't exist
          if ! kind get clusters | grep -q "kind"; then
            kind create cluster --name kind --image $KIND_NODE_IMAGE
          fi
          
          kind load docker-image openbao-operator:e2e --name kind
          kind load docker-image openbao-init:e2e --name kind
          kind load docker-image openbao-backup:e2e --name kind
          kind load docker-image openbao-upgrade:e2e --name kind

      - name: Run E2E Tests
        if: env.SHOULD_RUN == 'true'
        env:
          GOFLAGS: -mod=readonly
          E2E_FOCUS: ${{ matrix.focus }}
          # E2E_LABEL_FILTER is set by previous step
          E2E_PARALLEL_NODES: "1"
          E2E_TIMEOUT: 40m
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_OPERATOR_IMAGE: openbao-operator:e2e
          E2E_CONFIG_INIT_IMAGE: openbao-init:e2e
          E2E_BACKUP_EXECUTOR_IMAGE: openbao-backup:e2e
          E2E_UPGRADE_EXECUTOR_IMAGE: openbao-upgrade:e2e
        run: make test-e2e-ci

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts-${{ matrix.name }}
          path: artifacts/
          retention-days: 7
