name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: &runner ubuntu-24.04
    outputs:
      chart: ${{ steps.diff.outputs.chart }}
      e2e: ${{ steps.diff.outputs.e2e }}
      e2e_backup: ${{ steps.diff.outputs.e2e_backup }}
      e2e_upgrade: ${{ steps.diff.outputs.e2e_upgrade }}
      e2e_hardened: ${{ steps.diff.outputs.e2e_hardened }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect chart changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=""

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

          # Ensure base exists locally (checkout may not contain it for PRs).
          git fetch --no-tags --prune --depth=1 origin "${base_sha}" || true

          changed="$(git diff --name-only "${base_sha}" "${head_sha}" || true)"
          if echo "${changed}" | grep -qE '^(charts/openbao-operator/|config/(crd|policy|rbac)/|hack/helm(chart|values)/)'; then
            echo "chart=true" >> "${GITHUB_OUTPUT}"
          else
            echo "chart=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/|cmd/|api/|test/e2e/|Dockerfile(\..*)?$|hack/ci/|go\.(mod|sum)$|\.github/workflows/ci\.yml|Makefile)'; then
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/backup/|internal/restore/|cmd/bao-backup/|test/e2e/|\.github/workflows/ci\.yml|Makefile)'; then
            echo "e2e_backup=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_backup=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/upgrade/|cmd/bao-upgrade/|test/e2e/|\.github/workflows/ci\.yml|Makefile)'; then
            echo "e2e_upgrade=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_upgrade=false" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(internal/security/|internal/admission/|internal/provisioner/|cmd/provisioner/|config/policy/|internal/controller/|cmd/controller/|test/e2e/|\.github/workflows/ci\.yml|Makefile)'; then
            echo "e2e_hardened=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_hardened=false" >> "${GITHUB_OUTPUT}"
          fi
  security:
    name: Security (vulncheck + Trivy FS)
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=vendor
        run: make vulncheck

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # 0.34.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_minimal_role.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml,config/rbac/single_tenant_clusterrole.yaml,dist/install.yaml
          skip-dirs: test/manifests,vendor
          trivy-config: .trivy.yaml

  lint:
    name: Lint
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run linter
        run: make lint-config lint

  verify-fmt:
    name: Verify Formatting
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify gofmt
        run: make verify-fmt

  tidy-check:
    name: Verify go.mod/go.sum
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify tidy
        run: make verify-tidy

  verify-vendor:
    name: Verify vendor/
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify vendor tree
        run: make verify-vendor

  verify-generated:
    name: Verify Generated Artifacts
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify generated files
        run: make verify-generated

  test-unit:
    name: Unit Tests
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run unit tests
        run: make test

  test-integration:
    name: Envtest Integration
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Run integration tests
        run: |
          make test-integration

  openbao-config-compat:
    name: OpenBao Config Compatibility (OpenBao >=2.4.0 <2.6.0)
    runs-on: *runner
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Validate HCL fixtures against upstream OpenBao parser
        run: bash hack/ci/openbao-config-compat.sh 2.4.4 2.5.0

  docs:
    name: Docs Build
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build docs
        uses: ./.github/actions/mkdocs-build

  helm:
    name: Helm Chart
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=vendor
        run: make verify-helm

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null

      - name: Verify OpenShift templating (SCC-compatible)
        run: bash hack/ci/verify-openshift-helm.sh

  helm-e2e-smoke:
    name: Helm E2E Smoke (kind)
    runs-on: *runner
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.1

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Run Helm E2E smoke
        env:
          GOFLAGS: -mod=vendor
        run: make helm-e2e-smoke

  build-artifacts:
    name: Build Artifacts
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build Linux Binaries
        env:
          GOFLAGS: -mod=vendor
        run: make build-linux

      - name: Upload Binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64/
          retention-days: 1

  build-e2e-images:
    name: Build E2E Images Once
    runs-on: *runner
    needs: [changes, build-artifacts]
    if: (needs.changes.outputs.e2e == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e'))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      manager_ref: ${{ steps.refs.outputs.manager_ref }}
      config_init_ref: ${{ steps.refs.outputs.config_init_ref }}
      backup_executor_ref: ${{ steps.refs.outputs.backup_executor_ref }}
      upgrade_executor_ref: ${{ steps.refs.outputs.upgrade_executor_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Binaries
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Prepare Binaries
        run: chmod +x bin/linux_amd64/*

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.31.1

      - name: Compute E2E image tag
        id: tag
        run: |
          set -euo pipefail
          echo "value=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Build operator image
        id: build-manager
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.manager
          build-args: |
            BINARY=bin/linux_amd64/manager
            TARGET=/manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-operator:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-operator
          cache-to: type=gha,mode=max,scope=openbao-operator

      - name: Build init image
        id: build-init
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.init
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-init:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-init
          cache-to: type=gha,mode=max,scope=openbao-init

      - name: Build backup image
        id: build-backup
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.backup
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-backup:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-backup
          cache-to: type=gha,mode=max,scope=openbao-backup

      - name: Build upgrade image
        id: build-upgrade
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: hack/ci/Dockerfile.fast.upgrade
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/openbao-upgrade:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=openbao-upgrade
          cache-to: type=gha,mode=max,scope=openbao-upgrade

      - name: Publish image refs
        id: refs
        run: |
          set -euo pipefail
          echo "manager_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-operator:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"
          echo "config_init_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-init:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"
          echo "backup_executor_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-backup:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"
          echo "upgrade_executor_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/openbao-upgrade:${{ steps.tag.outputs.value }}" >> "${GITHUB_OUTPUT}"

  e2e:
    needs: [changes, build-e2e-images]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: E2E (${{ matrix.name }})
    runs-on: *runner
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Lifecycle & Core"
            focus: "Cluster Lifecycle|Manager|GitOps"
            slow: "false"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
          - name: "Backup & Restore"
            focus: "Backup & Restore"
            slow: "true"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
          - name: "Upgrades & Chaos"
            focus: "Upgrade|Chaos"
            slow: "true"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
          - name: "Security & Tenants"
            focus: "Security|TLS|Tenant Isolation|Hardened|Platform"
            slow: "false"
            hardened_signed: "false"
            openbao_image: ""
            hardened_init_image: ""
          - name: "Hardened (Signed)"
            focus: "Hardened profile|GitOps contract"
            slow: "true"
            hardened_signed: "true"
            openbao_image: "ghcr.io/openbao/openbao:2.5.0"
            hardened_init_image: "ghcr.io/dc-tec/openbao-init:edge"
    env:
      KIND_NODE_IMAGE: kindest/node:v1.34.3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Determine E2E Filter
        id: filter
        run: |
          set -euo pipefail

          TRIGGER_E2E="${{ needs.changes.outputs.e2e == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')) }}"
          FULL_E2E="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}"
          PR_BACKUP="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'backup') }}"
          PR_UPGRADE="${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'upgrades') }}"
          PR_HARDENED="${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'provisioner') || contains(github.event.pull_request.labels.*.name, 'admission') || contains(github.event.pull_request.labels.*.name, 'controller')) }}"

          FILTER="!slow && !nightly && !openshift && !pentest"
          SHOULD_RUN="true"

          if [[ "${TRIGGER_E2E}" != "true" ]]; then
            SHOULD_RUN="false"
            echo "E2E_LABEL_FILTER=$FILTER" >> "${GITHUB_ENV}"
            echo "SHOULD_RUN=$SHOULD_RUN" >> "${GITHUB_ENV}"
            echo "::notice::Skipping ${{ matrix.name }} shard (no E2E-triggering changes/labels)"
            exit 0
          fi

          if [[ "${{ matrix.hardened_signed }}" == "true" ]]; then
            FILTER="!nightly && !openshift && !pentest"
            SHOULD_RUN="false"
            if [[ "${FULL_E2E}" == "true" ]]; then
              SHOULD_RUN="true"
            elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
              if [[ "${PR_HARDENED}" == "true" ]] || [[ "${{ needs.changes.outputs.e2e_hardened }}" == "true" ]]; then
                SHOULD_RUN="true"
              fi
            elif [[ "${{ needs.changes.outputs.e2e_hardened }}" == "true" ]]; then
              SHOULD_RUN="true"
            fi
          else
            if [[ "${FULL_E2E}" == "true" ]]; then
              FILTER="!openshift"
            else
              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                if [[ "${PR_UPGRADE}" == "true" ]] || [[ "${{ needs.changes.outputs.e2e_upgrade }}" == "true" ]]; then
                  FILTER="$FILTER || (upgrade)"
                fi
                if [[ "${PR_BACKUP}" == "true" ]] || [[ "${{ needs.changes.outputs.e2e_backup }}" == "true" ]]; then
                  FILTER="$FILTER || (backup)"
                fi
                if [[ "${PR_HARDENED}" == "true" ]]; then
                  FILTER="$FILTER || (pentest)"
                fi
              else
                if [[ "${{ needs.changes.outputs.e2e_upgrade }}" == "true" ]]; then
                  FILTER="$FILTER || (upgrade)"
                fi
                if [[ "${{ needs.changes.outputs.e2e_backup }}" == "true" ]]; then
                  FILTER="$FILTER || (backup)"
                fi
              fi
            fi

            if [[ "${{ matrix.slow }}" == "true" ]]; then
              SHOULD_RUN="false"
              if [[ "${FULL_E2E}" == "true" ]]; then SHOULD_RUN="true"; fi
              if [[ "${{ matrix.name }}" == *"Backup"* ]] && [[ "${FILTER}" == *"backup"* ]]; then SHOULD_RUN="true"; fi
              if [[ "${{ matrix.name }}" == *"Upgrade"* ]] && [[ "${FILTER}" == *"upgrade"* ]]; then SHOULD_RUN="true"; fi
            fi
          fi

          echo "E2E_LABEL_FILTER=$FILTER" >> "${GITHUB_ENV}"
          echo "SHOULD_RUN=$SHOULD_RUN" >> "${GITHUB_ENV}"
          if [[ "$SHOULD_RUN" == "false" ]]; then
            echo "::notice::Skipping ${{ matrix.name }} shard (targeted optimization)"
          else
            echo "::notice::Running ${{ matrix.name }} with filter: $FILTER"
          fi

      - name: Cache Tools
        if: env.SHOULD_RUN == 'true'
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install kind (pinned)
        if: env.SHOULD_RUN == 'true'
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        if: env.SHOULD_RUN == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt E2E images
        if: env.SHOULD_RUN == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-e2e-images.outputs.manager_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.config_init_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.backup_executor_ref }}"
          docker pull "${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}"

      - name: Create Kind Cluster
        if: env.SHOULD_RUN == 'true'
        run: |
          if ! kind get clusters | grep -q "kind"; then
            kind create cluster --name kind --image "${KIND_NODE_IMAGE}"
          fi

      - name: Run E2E Tests
        if: env.SHOULD_RUN == 'true'
        env:
          GOFLAGS: -mod=vendor
          OPENBAO_REQUEUE_STANDARD: 10s
          E2E_FOCUS: ${{ matrix.focus }}
          # E2E_LABEL_FILTER is set by previous step
          E2E_PARALLEL_NODES: "1"
          E2E_TIMEOUT: 40m
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_ENABLE_HARDENED_SIGNED_SUITE: ${{ matrix.hardened_signed }}
          E2E_OPERATOR_IMAGE: ${{ needs.build-e2e-images.outputs.manager_ref }}
          E2E_OPENBAO_IMAGE: ${{ matrix.openbao_image }}
          E2E_CONFIG_INIT_IMAGE: ${{ needs.build-e2e-images.outputs.config_init_ref }}
          E2E_HARDENED_CONFIG_INIT_IMAGE: ${{ matrix.hardened_init_image }}
          E2E_BACKUP_EXECUTOR_IMAGE: ${{ needs.build-e2e-images.outputs.backup_executor_ref }}
          E2E_UPGRADE_EXECUTOR_IMAGE: ${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}
          KIND_CLUSTER: kind
        run: make test-e2e-ci

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-artifacts-${{ matrix.name }}
          path: artifacts/
          retention-days: 7
