name: Publish Nightly

on:
  workflow_run:
    workflows: ["Nightly"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-nightly
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Variables
    runs-on: &runner ubuntu-24.04
    if: >-
      ${{
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          !github.event.workflow_run.repository.fork
        }}
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      date_utc: ${{ steps.vars.outputs.date_utc }}
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      repro_build_tag: ${{ steps.vars.outputs.repro_build_tag }}
      source_date_epoch: ${{ steps.vars.outputs.source_date_epoch }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute nightly variables
        id: vars
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          date_utc="$(date -u +%Y%m%d)"
          version="nightly-${date_utc}-${short_sha}"
          build_tag="nightly-build-${sha}"
          repro_build_tag="nightly-repro-${sha}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" ]]; then
            echo "failed to parse chart version from ${chart_file}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "date_utc=${date_utc}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "build_tag=${build_tag}" >> "${GITHUB_OUTPUT}"
          echo "repro_build_tag=${repro_build_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >> "${GITHUB_OUTPUT}"
          echo "manager_image=ghcr.io/${owner}/openbao-operator" >> "${GITHUB_OUTPUT}"
          echo "config_init_image=ghcr.io/${owner}/openbao-init" >> "${GITHUB_OUTPUT}"
          echo "backup_executor_image=ghcr.io/${owner}/openbao-backup" >> "${GITHUB_OUTPUT}"
          echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade" >> "${GITHUB_OUTPUT}"

  hardening:
    name: Build + Verify Channel Integrity
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-channel-hardening.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      source_ref: refs/heads/main
      version: ${{ needs.prepare.outputs.version }}
      chart_version: ${{ needs.prepare.outputs.chart_version }}
      build_tag: ${{ needs.prepare.outputs.build_tag }}
      repro_build_tag: ${{ needs.prepare.outputs.repro_build_tag }}
      source_date_epoch: ${{ needs.prepare.outputs.source_date_epoch }}
      manager_image: ${{ needs.prepare.outputs.manager_image }}
      config_init_image: ${{ needs.prepare.outputs.config_init_image }}
      backup_executor_image: ${{ needs.prepare.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ needs.prepare.outputs.upgrade_executor_image }}
      byte_artifact_name: nightly-byte-verified-assets
    secrets: inherit

  promote:
    name: Promote Nightly Tags
    runs-on: *runner
    needs: [prepare, hardening]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DATE_TAG: nightly-${{ needs.prepare.outputs.date_utc }}
      MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
      CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
      MANAGER_DIGEST: ${{ needs.hardening.outputs.manager_digest }}
      CONFIG_INIT_DIGEST: ${{ needs.hardening.outputs.config_init_digest }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.hardening.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.hardening.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download byte-verified nightly assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-byte-verified-assets
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.31.1

      - name: Promote nightly tags (no rebuild)
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${MANAGER_IMAGE}:${VERSION}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${VERSION}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${VERSION}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${VERSION}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

          docker buildx imagetools create -t "${MANAGER_IMAGE}:${DATE_TAG}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${DATE_TAG}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${DATE_TAG}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${DATE_TAG}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

          docker buildx imagetools create -t "${MANAGER_IMAGE}:nightly" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:nightly" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:nightly" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:nightly" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.4

      - name: Sign images (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Verify signatures (keyless)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${REPO}/.github/workflows/publish-nightly.yml@refs/heads/main"

          verify_signed() {
            local image_ref="$1"
            local attempts=5
            local delay=3
            local i

            for i in $(seq 1 "${attempts}"); do
              if cosign verify --new-bundle-format=true --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null; then
                return 0
              fi
              if [[ "${i}" -eq "${attempts}" ]]; then
                return 1
              fi
              sleep "${delay}"
            done
          }

          verify_signed "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          verify_signed "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          verify_signed "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          verify_signed "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Attest nightly checksums provenance (GitHub)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/checksums.txt

      - name: Sign nightly checksums (keyless, bundle format)
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify nightly checksums signature (bundle format)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/publish-nightly.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify nightly checksums attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: refs/heads/main
          OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-nightly.yml
          VERIFY_CHART: "false"
        run: bash hack/ci/verify-release-artifact-attestations.sh

      - name: Setup Go (for provenance tooling)
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Generate nightly provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CHANNEL: nightly
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: refs/heads/main
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          CHECKSUMS_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-nightly.yml
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.hardening.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.hardening.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.hardening.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.hardening.outputs.upgrade_executor_digest }}
        run: bash hack/ci/generate-channel-provenance-index.sh

      - name: Upload nightly publish artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-manifests
          path: |
            dist/install.yaml
            dist/crds.yaml
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/provenance-index.json
          if-no-files-found: error
          retention-days: 7

  publish-pages:
    name: Publish Nightly Manifests (GitHub Pages)
    runs-on: *runner
    needs: [prepare, hardening, promote]
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DATE_UTC: ${{ needs.prepare.outputs.date_utc }}
      MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
      CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
      MANAGER_DIGEST: ${{ needs.hardening.outputs.manager_digest }}
      CONFIG_INIT_DIGEST: ${{ needs.hardening.outputs.config_init_digest }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.hardening.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.hardening.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download manifests artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-manifests
          path: dist

      - name: Publish manifests to GitHub Pages (nightly/)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1

          worktree="$(mktemp -d)"
          git worktree add -B gh-pages "${worktree}/gh-pages" origin/gh-pages

          dest="${worktree}/gh-pages/nightly"
          mkdir -p "${dest}"

          cp dist/install.yaml "${dest}/install.yaml"
          cp dist/crds.yaml "${dest}/crds.yaml"
          cp dist/checksums.txt "${dest}/checksums.txt"
          cp dist/checksums.txt.bundle "${dest}/checksums.txt.bundle"
          cp dist/provenance-index.json "${dest}/provenance-index.json"

          generated_at="$(date -u +%FT%TZ)"
          export GENERATED_AT="${generated_at}"
          python3 - <<'PY' > "${dest}/metadata.json"
          import json, os

          data = {
              "version": os.environ["VERSION"],
              "sha": os.environ["SHA"],
              "date_utc": os.environ["DATE_UTC"],
              "generated_at": os.environ.get("GENERATED_AT"),
              "artifacts": {
                  "install_yaml": "install.yaml",
                  "crds_yaml": "crds.yaml",
                  "checksums_txt": "checksums.txt",
                  "checksums_bundle": "checksums.txt.bundle",
                  "provenance_index": "provenance-index.json",
              },
              "images": {
                  "manager": {"ref": os.environ["MANAGER_IMAGE"], "digest": os.environ["MANAGER_DIGEST"]},
                  "config_init": {"ref": os.environ["CONFIG_INIT_IMAGE"], "digest": os.environ["CONFIG_INIT_DIGEST"]},
                  "backup_executor": {"ref": os.environ["BACKUP_EXECUTOR_IMAGE"], "digest": os.environ["BACKUP_EXECUTOR_DIGEST"]},
                  "upgrade_executor": {"ref": os.environ["UPGRADE_EXECUTOR_IMAGE"], "digest": os.environ["UPGRADE_EXECUTOR_DIGEST"]},
              },
          }

          print(json.dumps(data, indent=2, sort_keys=True))
          PY

          cat > "${dest}/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>OpenBao Operator - Nightly</title>
              <style>
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; line-height: 1.5; }
                code { background: #f6f8fa; padding: 0.15rem 0.35rem; border-radius: 0.25rem; }
                ul { padding-left: 1.25rem; }
              </style>
            </head>
            <body>
              <h1>OpenBao Operator Nightly</h1>
              <p>This directory is updated on successful nightly builds.</p>
              <ul>
                <li><a href="install.yaml">install.yaml</a></li>
                <li><a href="crds.yaml">crds.yaml</a></li>
                <li><a href="checksums.txt">checksums.txt</a></li>
                <li><a href="checksums.txt.bundle">checksums.txt.bundle</a></li>
                <li><a href="provenance-index.json">provenance-index.json</a></li>
                <li><a href="metadata.json">metadata.json</a></li>
              </ul>
              <p>To install: <code>kubectl apply -f install.yaml</code></p>
            </body>
          </html>
          HTML

          pushd "${worktree}/gh-pages"
          git add nightly/install.yaml nightly/crds.yaml nightly/checksums.txt nightly/checksums.txt.bundle nightly/provenance-index.json nightly/metadata.json nightly/index.html

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "nightly: ${VERSION} (${SHA})"
          git push origin gh-pages
          popd
