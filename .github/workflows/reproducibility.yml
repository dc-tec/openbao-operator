name: Reproducibility Report

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer release/prerelease tag to report on (e.g. 0.2.0, 0.2.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.event.workflow_run.id || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-run:
    name: Resolve Release Run
    runs-on: &runner ubuntu-24.04
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         !github.event.workflow_run.repository.fork)
      }}
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve successful release run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            echo "run_id=${WORKFLOW_RUN_ID}" >> "${GITHUB_OUTPUT}"
            echo "tag=${WORKFLOW_RUN_HEAD_BRANCH}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! [[ "${INPUT_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "SemVer tag required (X.Y.Z or X.Y.Z-rc.N). Got: ${INPUT_TAG}" >&2
            exit 1
          fi

          ref_json="$(gh api "repos/${REPO}/git/ref/tags/${INPUT_TAG}")"
          tag_object_type="$(REF_JSON="${ref_json}" python3 -c 'import json, os; print(json.loads(os.environ["REF_JSON"])["object"]["type"])')"
          tag_object_sha="$(REF_JSON="${ref_json}" python3 -c 'import json, os; print(json.loads(os.environ["REF_JSON"])["object"]["sha"])')"
          if [[ "${tag_object_type}" == "tag" ]]; then
            head_sha="$(gh api "repos/${REPO}/git/tags/${tag_object_sha}" --jq '.object.sha')"
          else
            head_sha="${tag_object_sha}"
          fi

          gh api "repos/${REPO}/actions/workflows/release.yml/runs?event=push&status=completed&per_page=100" > runs.json
          run_id="$(HEAD_SHA="${head_sha}" python3 -c 'import json, os, pathlib; head_sha=os.environ["HEAD_SHA"]; runs=json.loads(pathlib.Path("runs.json").read_text(encoding="utf-8")).get("workflow_runs", []); print(next((str(run["id"]) for run in runs if run.get("head_sha")==head_sha and run.get("conclusion")=="success"), ""))')"

          if [[ -z "${run_id}" ]]; then
            echo "No successful Release workflow run found for tag ${INPUT_TAG}" >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "tag=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"

  report:
    name: Publish Reproducibility Report
    runs-on: *runner
    needs: resolve-run
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download reproducibility report artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.resolve-run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/upstream dist/report
          gh run download "${RUN_ID}" -n release-reproducibility-report -D dist/upstream
          artifact_dir="$(dirname "$(find dist/upstream -type f -name 'reproducibility-report.md' -print -quit)")"
          if [[ -z "${artifact_dir}" || ! -f "${artifact_dir}/reproducibility-report.md" ]]; then
            echo "release reproducibility report artifact not found for run ${RUN_ID}" >&2
            exit 1
          fi
          cp "${artifact_dir}/reproducibility-report.md" dist/report/reproducibility-report.md

      - name: Append report to job summary
        run: cat dist/report/reproducibility-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload reproducibility report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: reproducibility-report
          path: dist/report/reproducibility-report.md
          retention-days: 30
