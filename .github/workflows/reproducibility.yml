name: Reproducibility Report

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to rebuild and compare (e.g. 0.2.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Inputs
    runs-on: &runner ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      ref: ${{ steps.vars.outputs.ref }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Compute reproducibility variables
        id: vars
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if [[ -z "${tag}" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if ! [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable semver tag required (X.Y.Z). Got: ${tag}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "ref=refs/tags/${tag}" >> "${GITHUB_OUTPUT}"
          echo "build_tag=repro-${tag}-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "manager_image=ghcr.io/${owner}/openbao-operator" >> "${GITHUB_OUTPUT}"
          echo "config_init_image=ghcr.io/${owner}/openbao-init" >> "${GITHUB_OUTPUT}"
          echo "backup_executor_image=ghcr.io/${owner}/openbao-backup" >> "${GITHUB_OUTPUT}"
          echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade" >> "${GITHUB_OUTPUT}"

  rebuild:
    name: Independent Rebuild
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.build_tag }}
      ref: ${{ needs.prepare.outputs.ref }}
    secrets: inherit

  compare:
    name: Compare Release vs Rebuild Digests (report-only)
    runs-on: *runner
    needs: [prepare, rebuild]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR (read)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.31.1

      - name: Compare digests
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          MANAGER_REBUILD_DIGEST: ${{ needs.rebuild.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          CONFIG_INIT_REBUILD_DIGEST: ${{ needs.rebuild.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail

          release_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'
          }

          release_manager="$(release_digest "${MANAGER_IMAGE}:${TAG}")"
          release_config_init="$(release_digest "${CONFIG_INIT_IMAGE}:${TAG}")"
          release_backup_executor="$(release_digest "${BACKUP_EXECUTOR_IMAGE}:${TAG}")"
          release_upgrade_executor="$(release_digest "${UPGRADE_EXECUTOR_IMAGE}:${TAG}")"

          cat <<'EOF' >> "${GITHUB_STEP_SUMMARY}"
          ## Reproducibility Report (Report-Only)
          EOF
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tag: \`${TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Image | Release digest | Rebuild digest | Match |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| :--- | :--- | :--- | :---: |" >> "${GITHUB_STEP_SUMMARY}"

          status=0
          compare_one() {
            local name="$1"
            local release="$2"
            local rebuild="$3"
            local mark="✅"
            if [[ "${release}" != "${rebuild}" ]]; then
              mark="❌"
              status=1
              echo "::warning::Digest mismatch for ${name}: release=${release} rebuild=${rebuild}"
            fi
            echo "| ${name} | \`${release}\` | \`${rebuild}\` | ${mark} |" >> "${GITHUB_STEP_SUMMARY}"
          }

          compare_one "openbao-operator" "${release_manager}" "${MANAGER_REBUILD_DIGEST}"
          compare_one "openbao-init" "${release_config_init}" "${CONFIG_INIT_REBUILD_DIGEST}"
          compare_one "openbao-backup" "${release_backup_executor}" "${BACKUP_EXECUTOR_REBUILD_DIGEST}"
          compare_one "openbao-upgrade" "${release_upgrade_executor}" "${UPGRADE_EXECUTOR_REBUILD_DIGEST}"

          echo "" >> "${GITHUB_STEP_SUMMARY}"
          if (( status == 0 )); then
            echo "Result: reproducible for all image digests." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Result: digest mismatch detected. This workflow is report-only and does not fail the pipeline." >> "${GITHUB_STEP_SUMMARY}"
          fi
