name: Performance Baseline Capture

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of runs per scenario (baseline capture).
        required: false
        default: "5"
      scenario_timeout:
        description: Timeout per scenario (Go duration, e.g. 90m).
        required: false
        default: 90m
      node_image:
        description: Kind node image used for capture and verification.
        required: false
        default: kindest/node:v1.34.3

permissions:
  contents: read
  packages: read

concurrency:
  group: perf-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-baseline:
    name: Capture Performance Baseline (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Capture v2 baseline samples
        env:
          GOFLAGS: -mod=vendor
          PERF_SAMPLES: ${{ inputs.runs }}
          PERF_NODE_IMAGE: ${{ inputs.node_image }}
          PERF_SCENARIO_TIMEOUT: ${{ inputs.scenario_timeout }}
          PERF_BASELINE_DIR: hack/perf/v2/baselines
          PERF_POLICY_FILE: hack/perf/v2/policies/weekly.yaml
          PERF_ARTIFACT_DIR: dist/perf
        run: make perf-baseline

      - name: Verify captured baselines
        env:
          GOFLAGS: -mod=vendor
          PERF_NODE_IMAGE: ${{ inputs.node_image }}
          PERF_SCENARIO_TIMEOUT: ${{ inputs.scenario_timeout }}
          PERF_BASELINE_DIR: hack/perf/v2/baselines
          PERF_POLICY_FILE: hack/perf/v2/policies/weekly.yaml
          PERF_ARTIFACT_DIR: dist/perf
        run: make verify-perf

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-baseline-kind-v1.34.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hack/perf/v2/baselines/
            dist/perf/
          if-no-files-found: warn
          retention-days: 14
