name: Performance Baseline Capture

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of runs per scenario (baseline capture).
        required: false
        default: "5"
      scenario_timeout:
        description: Timeout per scenario (Go duration, e.g. 90m).
        required: false
        default: 90m
      node_image:
        description: Kind node image used for capture and verification.
        required: false
        default: kindest/node:v1.34.3

permissions:
  contents: read
  packages: read

concurrency:
  group: perf-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-baseline:
    name: Capture Performance Baseline (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install kind (pinned)
        uses: ./.github/actions/install-kind
        with:
          install-dir: bin/

      - name: Capture baseline and regenerate thresholds
        env:
          GOFLAGS: -mod=vendor
          PERF_RUNS: ${{ inputs.runs }}
          PERF_NODE_IMAGE: ${{ inputs.node_image }}
          PERF_SCENARIO_TIMEOUT: ${{ inputs.scenario_timeout }}
          PERF_BASELINE_OUT: hack/perf/baseline/kind-v1.34.3-baseline.json
          PERF_THRESHOLDS_OUT: hack/perf/thresholds/kind-v1.34.3.yaml
        run: make perf-baseline

      - name: Verify captured thresholds
        env:
          GOFLAGS: -mod=vendor
          PERF_NODE_IMAGE: ${{ inputs.node_image }}
          PERF_SCENARIO_TIMEOUT: ${{ inputs.scenario_timeout }}
          PERF_THRESHOLDS_OUT: hack/perf/thresholds/kind-v1.34.3.yaml
        run: make verify-perf

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: perf-baseline-kind-v1.34.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hack/perf/baseline/kind-v1.34.3-baseline.json
            hack/perf/thresholds/kind-v1.34.3.yaml
          if-no-files-found: warn
          retention-days: 14
