name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build docs
        uses: ./.github/actions/docs-build

      - name: Publish site root to GitHub Pages
        env:
          COMMIT_MESSAGE: "docs: publish main site (${{ github.sha }})"
        run: bash hack/docs/publish-gh-pages.sh website/build
