name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync-labels:
    name: Sync PR Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Fetch trusted labeler script and config
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

          fetch_file() {
            local path="$1"
            local destination="$2"
            mkdir -p "$(dirname "${destination}")"
            gh api "repos/${REPO}/contents/${path}?ref=${BASE_SHA}" --jq '.content' \
              | tr -d '\n' \
              | base64 --decode > "${destination}"
          }

          fetch_file ".github/scripts/sync_pr_labels.go" "${workdir}/sync_pr_labels.go"
          fetch_file ".github/labeler.yml" "${workdir}/labeler.yml"
          fetch_file ".github/size-labeler.yml" "${workdir}/size-labeler.yml"
          fetch_file "go.mod" "${workdir}/go.mod"
          fetch_file "go.sum" "${workdir}/go.sum"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ env.WORKDIR }}/go.mod

      - name: Sync PR labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELER_CONFIG_PATH: ${{ env.WORKDIR }}/labeler.yml
          SIZE_CONFIG_PATH: ${{ env.WORKDIR }}/size-labeler.yml
        run: |
          cd "${WORKDIR}"
          go run ./sync_pr_labels.go
