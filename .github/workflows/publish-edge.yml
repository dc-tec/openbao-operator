name: Publish Edge (main)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-edge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  load-candidate:
    name: Load Edge Candidate Bundle
    runs-on: &runner ubuntu-24.04
    if: >-
      ${{
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          !github.event.workflow_run.repository.fork
        }}
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      manager_image: ${{ steps.meta.outputs.manager_image }}
      manager_digest: ${{ steps.meta.outputs.manager_digest }}
      config_init_image: ${{ steps.meta.outputs.config_init_image }}
      config_init_digest: ${{ steps.meta.outputs.config_init_digest }}
      backup_executor_image: ${{ steps.meta.outputs.backup_executor_image }}
      backup_executor_digest: ${{ steps.meta.outputs.backup_executor_digest }}
      upgrade_executor_image: ${{ steps.meta.outputs.upgrade_executor_image }}
      upgrade_executor_digest: ${{ steps.meta.outputs.upgrade_executor_digest }}
    steps:
      - name: Download edge candidate bundle from triggering run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist/upstream dist/candidate
          artifacts_json="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts")"
          ARTIFACTS_JSON="${artifacts_json}" ARTIFACT_NAME="edge-candidate-bundle" python3 - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["ARTIFACTS_JSON"])
          names = [artifact["name"] for artifact in data.get("artifacts", [])]
          wanted = os.environ["ARTIFACT_NAME"]
          if wanted in names:
              sys.exit(0)
          available = ", ".join(names) if names else "<none>"
          print(f"expected upstream artifact '{wanted}' not found; available artifacts: {available}", file=sys.stderr)
          sys.exit(1)
          PY
          gh run download "${RUN_ID}" -n edge-candidate-bundle -D dist/upstream
          artifact_dir="$(dirname "$(find dist/upstream -type f -name metadata.json -print -quit)")"
          if [[ -z "${artifact_dir}" || ! -f "${artifact_dir}/metadata.json" ]]; then
            echo "edge candidate bundle metadata.json not found in upstream artifact" >&2
            exit 1
          fi
          cp -a "${artifact_dir}/." dist/candidate/

      - name: Export metadata outputs
        id: meta
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          data = json.loads(Path("dist/candidate/metadata.json").read_text(encoding="utf-8"))
          images = data["images"]
          pairs = {
              "sha": data["sha"],
              "short_sha": data["short_sha"],
              "version": data["version"],
              "chart_version": data["chart_version"],
              "source_date_epoch": data["source_date_epoch"],
              "source_ref": data["source_ref"],
              "manager_image": images["manager"]["ref"],
              "manager_digest": images["manager"]["digest"],
              "config_init_image": images["config_init"]["ref"],
              "config_init_digest": images["config_init"]["digest"],
              "backup_executor_image": images["backup_executor"]["ref"],
              "backup_executor_digest": images["backup_executor"]["digest"],
              "upgrade_executor_image": images["upgrade_executor"]["ref"],
              "upgrade_executor_digest": images["upgrade_executor"]["digest"],
          }
          for key, value in pairs.items():
              print(f"{key}={value}")
          PY

      - name: Upload local edge candidate bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: edge-candidate-bundle
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 5

  promote:
    name: Promote Edge Tags
    runs-on: *runner
    needs: load-candidate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.load-candidate.outputs.version }}
      SOURCE_REF: ${{ needs.load-candidate.outputs.source_ref }}
      MANAGER_IMAGE: ${{ needs.load-candidate.outputs.manager_image }}
      CONFIG_INIT_IMAGE: ${{ needs.load-candidate.outputs.config_init_image }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.backup_executor_image }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.upgrade_executor_image }}
      MANAGER_DIGEST: ${{ needs.load-candidate.outputs.manager_digest }}
      CONFIG_INIT_DIGEST: ${{ needs.load-candidate.outputs.config_init_digest }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout trusted workflow sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Download edge candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-candidate-bundle
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.31.1

      - name: Promote tags (no rebuild)
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${MANAGER_IMAGE}:${VERSION}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${VERSION}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${VERSION}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${VERSION}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

          docker buildx imagetools create -t "${MANAGER_IMAGE}:edge" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:edge" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:edge" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:edge" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.0.4

      - name: Sign images (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Verify signatures (keyless)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${REPO}/.github/workflows/publish-edge.yml@refs/heads/main"

          verify_signed() {
            local image_ref="$1"
            local attempts=5
            local delay=3
            local i

            for i in $(seq 1 "${attempts}"); do
              if cosign verify --new-bundle-format=true --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null; then
                return 0
              fi
              if [[ "${i}" -eq "${attempts}" ]]; then
                return 1
              fi
              sleep "${delay}"
            done
          }

          verify_signed "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          verify_signed "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          verify_signed "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          verify_signed "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Attest edge checksums provenance (GitHub)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/checksums.txt

      - name: Sign edge checksums (keyless, bundle format)
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify edge checksums signature (bundle format)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/publish-edge.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify edge checksums attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.load-candidate.outputs.version }}
          SOURCE_REF: ${{ needs.load-candidate.outputs.source_ref }}
          OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-edge.yml
          VERIFY_CHART: "false"
        run: bash hack/ci/verify-release-artifact-attestations.sh

      - name: Setup Go (for provenance tooling)
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Generate edge provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CHANNEL: edge
          VERSION: ${{ needs.load-candidate.outputs.version }}
          SHA: ${{ needs.load-candidate.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ needs.load-candidate.outputs.source_ref }}
          SOURCE_DATE_EPOCH: ${{ needs.load-candidate.outputs.source_date_epoch }}
          CHECKSUMS_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-edge.yml
          MANAGER_IMAGE: ${{ needs.load-candidate.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.load-candidate.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.load-candidate.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.load-candidate.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.upgrade_executor_digest }}
        run: bash hack/ci/generate-channel-provenance-index.sh

      - name: Upload edge publish artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: manifests-edge
          path: |
            dist/install.yaml
            dist/crds.yaml
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/provenance-index.json
          retention-days: 5

  publish-pages:
    name: Publish Edge Manifests (GitHub Pages)
    runs-on: *runner
    needs: [load-candidate, promote]
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SHA: ${{ needs.load-candidate.outputs.sha }}
      SHORT_SHA: ${{ needs.load-candidate.outputs.short_sha }}
      VERSION: ${{ needs.load-candidate.outputs.version }}
      MANAGER_IMAGE: ${{ needs.load-candidate.outputs.manager_image }}
      CONFIG_INIT_IMAGE: ${{ needs.load-candidate.outputs.config_init_image }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.backup_executor_image }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.upgrade_executor_image }}
      MANAGER_DIGEST: ${{ needs.load-candidate.outputs.manager_digest }}
      CONFIG_INIT_DIGEST: ${{ needs.load-candidate.outputs.config_init_digest }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download manifests artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifests-edge
          path: dist

      - name: Publish manifests to GitHub Pages (edge/)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1

          worktree="$(mktemp -d)"
          git worktree add -B gh-pages "${worktree}/gh-pages" origin/gh-pages

          edge_root="${worktree}/gh-pages/edge"
          dest_immutable="${edge_root}/${SHORT_SHA}"
          dest_latest="${edge_root}/latest"
          mkdir -p "${dest_immutable}" "${dest_latest}"

          generated_at="$(date -u +%FT%TZ)"
          export GENERATED_AT="${generated_at}"
          python3 - <<'PY' > dist/metadata.json
          import json, os

          data = {
              "channel": "edge",
              "version": os.environ["VERSION"],
              "sha": os.environ["SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "generated_at": os.environ.get("GENERATED_AT"),
              "artifacts": {
                  "install_yaml": "install.yaml",
                  "crds_yaml": "crds.yaml",
                  "checksums_txt": "checksums.txt",
                  "checksums_bundle": "checksums.txt.bundle",
                  "provenance_index": "provenance-index.json",
              },
              "images": {
                  "manager": {"ref": os.environ["MANAGER_IMAGE"], "digest": os.environ["MANAGER_DIGEST"]},
                  "config_init": {"ref": os.environ["CONFIG_INIT_IMAGE"], "digest": os.environ["CONFIG_INIT_DIGEST"]},
                  "backup_executor": {"ref": os.environ["BACKUP_EXECUTOR_IMAGE"], "digest": os.environ["BACKUP_EXECUTOR_DIGEST"]},
                  "upgrade_executor": {"ref": os.environ["UPGRADE_EXECUTOR_IMAGE"], "digest": os.environ["UPGRADE_EXECUTOR_DIGEST"]},
              },
          }

          print(json.dumps(data, indent=2, sort_keys=True))
          PY

          for dest in "${dest_immutable}" "${dest_latest}"; do
            cp dist/install.yaml "${dest}/install.yaml"
            cp dist/crds.yaml "${dest}/crds.yaml"
            cp dist/checksums.txt "${dest}/checksums.txt"
            cp dist/checksums.txt.bundle "${dest}/checksums.txt.bundle"
            cp dist/provenance-index.json "${dest}/provenance-index.json"
            cp dist/metadata.json "${dest}/metadata.json"
          done

          cat > "${edge_root}/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>OpenBao Operator - Edge</title>
              <style>
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; line-height: 1.5; }
                code { background: #f6f8fa; padding: 0.15rem 0.35rem; border-radius: 0.25rem; }
                ul { padding-left: 1.25rem; }
              </style>
            </head>
            <body>
              <h1>OpenBao Operator Edge</h1>
              <p>This directory is updated on successful CI runs for <code>main</code>.</p>
              <ul>
                <li><a href="latest/install.yaml">latest/install.yaml</a></li>
                <li><a href="latest/crds.yaml">latest/crds.yaml</a></li>
                <li><a href="latest/checksums.txt">latest/checksums.txt</a></li>
                <li><a href="latest/checksums.txt.bundle">latest/checksums.txt.bundle</a></li>
                <li><a href="latest/provenance-index.json">latest/provenance-index.json</a></li>
                <li><a href="latest/metadata.json">latest/metadata.json</a></li>
              </ul>
              <p>To install: <code>kubectl apply -f latest/install.yaml</code></p>
            </body>
          </html>
          HTML

          pushd "${worktree}/gh-pages"
          git add \
            "edge/${SHORT_SHA}/install.yaml" \
            "edge/${SHORT_SHA}/crds.yaml" \
            "edge/${SHORT_SHA}/checksums.txt" \
            "edge/${SHORT_SHA}/checksums.txt.bundle" \
            "edge/${SHORT_SHA}/provenance-index.json" \
            "edge/${SHORT_SHA}/metadata.json" \
            "edge/latest/install.yaml" \
            "edge/latest/crds.yaml" \
            "edge/latest/checksums.txt" \
            "edge/latest/checksums.txt.bundle" \
            "edge/latest/provenance-index.json" \
            "edge/latest/metadata.json" \
            "edge/index.html"

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "edge: ${VERSION} (${SHA})"
          git push origin gh-pages
          popd
