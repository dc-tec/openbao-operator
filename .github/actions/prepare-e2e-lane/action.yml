name: Prepare E2E lane
description: Pull lane images, create the Kind cluster, preload emulator images, and export E2E report paths.

inputs:
  kind-node-image:
    description: Kind node image to use for the lane.
    required: true
  kind-cluster:
    description: Kind cluster name.
    required: false
    default: kind
  manager-image:
    description: Manager/operator image reference.
    required: true
  config-init-image:
    description: Config init image reference.
    required: true
  backup-executor-image:
    description: Backup executor image reference.
    required: true
  upgrade-executor-image:
    description: Upgrade executor image reference.
    required: true
  hardened-upgrade-executor-image:
    description: Optional hardened upgrade executor image reference.
    required: false
    default: ""
  load-backup-executor-image:
    description: Whether to pull and load the backup executor image.
    required: false
    default: "true"
  load-upgrade-executor-image:
    description: Whether to pull and load the upgrade executor image.
    required: false
    default: "true"
  preload-storage-emulators:
    description: Whether any storage emulator image should be preloaded.
    required: false
    default: "false"
  preload-rustfs-image:
    description: Whether to preload the RustFS image.
    required: false
    default: "false"
  preload-fake-gcs-image:
    description: Whether to preload the fake-gcs-server image.
    required: false
    default: "false"
  preload-azurite-image:
    description: Whether to preload the Azurite image.
    required: false
    default: "false"
  rustfs-image:
    description: RustFS image reference.
    required: false
    default: ""
  fake-gcs-image:
    description: fake-gcs-server image reference.
    required: false
    default: ""
  azurite-image:
    description: Azurite image reference.
    required: false
    default: ""
  report-dir:
    description: Directory for lane reports.
    required: true
  artifact-name:
    description: Artifact name for uploaded lane reports.
    required: true

outputs:
  rustfs-image:
    description: RustFS image reference to pass to the E2E suite.
    value: ${{ steps.storage-emulator-images.outputs.rustfs_image }}
  fake-gcs-image:
    description: fake-gcs-server image reference to pass to the E2E suite.
    value: ${{ steps.storage-emulator-images.outputs.fake_gcs_image }}
  azurite-image:
    description: Azurite image reference to pass to the E2E suite.
    value: ${{ steps.storage-emulator-images.outputs.azurite_image }}

runs:
  using: composite
  steps:
    - name: Pull E2E images
      shell: bash
      env:
        MANAGER_IMAGE: ${{ inputs.manager-image }}
        CONFIG_INIT_IMAGE: ${{ inputs.config-init-image }}
        BACKUP_EXECUTOR_IMAGE: ${{ inputs.backup-executor-image }}
        UPGRADE_EXECUTOR_IMAGE: ${{ inputs.upgrade-executor-image }}
        HARDENED_UPGRADE_EXECUTOR_IMAGE: ${{ inputs.hardened-upgrade-executor-image }}
        LOAD_BACKUP_EXECUTOR_IMAGE: ${{ inputs.load-backup-executor-image }}
        LOAD_UPGRADE_EXECUTOR_IMAGE: ${{ inputs.load-upgrade-executor-image }}
      run: |
        set -euo pipefail

        docker pull "${MANAGER_IMAGE}"
        docker pull "${CONFIG_INIT_IMAGE}"

        if [[ "${LOAD_BACKUP_EXECUTOR_IMAGE}" == "true" ]]; then
          docker pull "${BACKUP_EXECUTOR_IMAGE}"
        fi

        if [[ "${LOAD_UPGRADE_EXECUTOR_IMAGE}" == "true" ]] && [[ -n "${HARDENED_UPGRADE_EXECUTOR_IMAGE}" ]]; then
          docker pull "${HARDENED_UPGRADE_EXECUTOR_IMAGE}"
        elif [[ "${LOAD_UPGRADE_EXECUTOR_IMAGE}" == "true" ]]; then
          docker pull "${UPGRADE_EXECUTOR_IMAGE}"
        fi

    - name: Create Kind cluster
      shell: bash
      env:
        KIND_CLUSTER: ${{ inputs.kind-cluster }}
        KIND_NODE_IMAGE: ${{ inputs.kind-node-image }}
      run: |
        set -euo pipefail

        if ! kind get clusters | grep -qx "${KIND_CLUSTER}"; then
          kind create cluster --name "${KIND_CLUSTER}" --image "${KIND_NODE_IMAGE}"
        fi

    - name: Resolve storage emulator images
      id: storage-emulator-images
      shell: bash
      env:
        KIND_CLUSTER: ${{ inputs.kind-cluster }}
        PRELOAD_STORAGE_EMULATORS: ${{ inputs.preload-storage-emulators }}
        PRELOAD_RUSTFS_IMAGE: ${{ inputs.preload-rustfs-image }}
        PRELOAD_FAKE_GCS_IMAGE: ${{ inputs.preload-fake-gcs-image }}
        PRELOAD_AZURITE_IMAGE: ${{ inputs.preload-azurite-image }}
        RUSTFS_IMAGE: ${{ inputs.rustfs-image }}
        FAKE_GCS_IMAGE: ${{ inputs.fake-gcs-image }}
        AZURITE_IMAGE: ${{ inputs.azurite-image }}
      run: |
        set -euo pipefail

        resolve_image() {
          local output_name="$1"
          local preload="$2"
          local source_image="$3"
          local loaded_image="$4"

          if [[ -z "${source_image}" ]]; then
            echo "${output_name}=" >> "${GITHUB_OUTPUT}"
            return
          fi

          if [[ "${PRELOAD_STORAGE_EMULATORS}" == "true" ]] && [[ "${preload}" == "true" ]]; then
            docker pull "${source_image}"
            docker tag "${source_image}" "${loaded_image}"
            kind load docker-image "${loaded_image}" --name "${KIND_CLUSTER}"
            echo "${output_name}=${loaded_image}" >> "${GITHUB_OUTPUT}"
            return
          fi

          echo "${output_name}=${source_image}" >> "${GITHUB_OUTPUT}"
        }

        # kind load imports digest-only images under synthetic import-* names. Tag aliases keep
        # the image references resolvable by containerd when the suite creates emulator Pods.
        resolve_image "rustfs_image" "${PRELOAD_RUSTFS_IMAGE}" "${RUSTFS_IMAGE}" "docker.io/rustfs/rustfs:openbao-e2e"
        resolve_image "fake_gcs_image" "${PRELOAD_FAKE_GCS_IMAGE}" "${FAKE_GCS_IMAGE}" "docker.io/fsouza/fake-gcs-server:openbao-e2e"
        resolve_image "azurite_image" "${PRELOAD_AZURITE_IMAGE}" "${AZURITE_IMAGE}" "mcr.microsoft.com/azure-storage/azurite:openbao-e2e"

    - name: Prepare E2E report paths
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail

        mkdir -p "${REPORT_DIR}"
        {
          echo "E2E_ARTIFACT_NAME=${ARTIFACT_NAME}"
          echo "E2E_REPORT_DIR=${REPORT_DIR}"
          echo "E2E_JUNIT_REPORT=${REPORT_DIR}/junit.xml"
          echo "E2E_JSON_REPORT=${REPORT_DIR}/ginkgo.json"
          echo "E2E_SUMMARY_REPORT=${REPORT_DIR}/summary.md"
          echo "E2E_SUMMARY_JSON=${REPORT_DIR}/summary.json"
        } >> "${GITHUB_ENV}"
