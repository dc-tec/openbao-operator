name: Docs build
description: Build and smoke-test the Docusaurus documentation site using the checked-in website lockfile.

inputs:
  node-version:
    description: Node.js version used for the docs toolchain.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: "10.34.5"

    - name: Setup Node.js
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: website/pnpm-lock.yaml

    - name: Install docs dependencies
      shell: bash
      run: pnpm --dir website install --frozen-lockfile

    - name: Install Playwright browser
      shell: bash
      run: pnpm --dir website exec playwright install --with-deps chromium

    - name: Run docs smoke suite
      shell: bash
      run: pnpm --dir website run test:e2e
