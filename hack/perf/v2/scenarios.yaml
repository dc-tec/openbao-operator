version: v2
defaults:
  warmups: 1
  samples: 3
  sampleTimeout: 30m
  cleanup: always
  artifactLevel: standard

scenarios:
  - name: lifecycle-convergence
    description: OpenBaoCluster creation to available using native Kubernetes phase observation.
    labels: [lifecycle, cluster, critical]
    executor: native-go
    existingCluster:
      enabled: true
    primaryMeasurements:
      - cluster_available_seconds
      - statefulset_created_seconds
      - first_pod_ready_seconds
      - all_pods_ready_seconds
    diagnosticMeasurements:
      - scenario_run_seconds
      - sample_total_seconds
      - observed_kubernetes_writes
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_auth_login_errors
      - openbao_auth_inline_requests
      - openbao_auth_cache_hits_total
      - openbao_auth_cache_misses_total
      - openbao_api_requests
      - openbao_workload_request_count
      - openbao_workload_request_avg_seconds
      - openbao_workload_login_request_count
      - openbao_workload_login_request_avg_seconds
      - openbao_workload_token_check_count
      - openbao_workload_token_check_avg_seconds
      - openbao_workload_in_flight_requests_max
      - openbao_workload_token_creation_count
      - openbao_workload_audit_request_failures
      - openbao_workload_audit_response_failures
    phases:
      - name: sample_started
      - name: resource_created
      - name: statefulset_created
      - name: first_pod_ready
      - name: all_pods_ready
      - name: cluster_available
      - name: scenario_completed

  - name: tenant-churn
    description: Tenant namespace and OpenBaoTenant provisioning churn using native Kubernetes phase observation.
    labels: [tenant, churn, critical]
    executor: native-go
    existingCluster:
      enabled: true
    primaryMeasurements:
      - tenant_churn_complete_seconds
      - tenant_ready_p50_seconds
      - tenant_ready_p95_seconds
    diagnosticMeasurements:
      - scenario_run_seconds
      - sample_total_seconds
      - tenant_kubernetes_writes
      - observed_kubernetes_writes
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_auth_login_errors
      - openbao_auth_inline_requests
      - openbao_auth_cache_hits_total
      - openbao_auth_cache_misses_total
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: tenant_churn_started
      - name: tenant_churn_created
      - name: tenant_churn_complete
      - name: scenario_completed

  - name: backup
    description: Backup orchestration signal, split from restore in the v2 contract.
    labels: [backup, disaster-recovery]
    executor: e2e-ginkgo
    labelFilter: dr && backup && restore && !failure-injection
    primaryMeasurements:
      - backup_last_duration_seconds
    diagnosticMeasurements:
      - scenario_run_seconds
      - sample_total_seconds
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - openbao_auth_logins
      - openbao_auth_login_errors
      - openbao_auth_inline_requests
      - openbao_auth_cache_hits_total
      - openbao_auth_cache_misses_total
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: scenario_completed

  - name: restore
    description: Restore orchestration signal, split from backup in the v2 contract.
    labels: [restore, disaster-recovery]
    executor: e2e-ginkgo
    labelFilter: dr && backup && restore && !failure-injection
    diagnosticMeasurements:
      - scenario_run_seconds
      - sample_total_seconds
      - restore_duration_bucket_p95
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - openbao_auth_logins
      - openbao_auth_login_errors
      - openbao_auth_inline_requests
      - openbao_auth_cache_hits_total
      - openbao_auth_cache_misses_total
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: scenario_completed

  - name: rolling-upgrade
    description: Rolling upgrade steady path with native phase and availability observation.
    labels: [upgrade, rolling, critical]
    executor: native-go
    existingCluster:
      enabled: true
    primaryMeasurements:
      - upgrade_total_seconds
      - upgrade_session_start_seconds
      - upgrade_pod_ready_seconds
      - upgrade_availability_probe_failures
    diagnosticMeasurements:
      - scenario_run_seconds
      - sample_total_seconds
      - upgrade_kubernetes_writes
      - observed_kubernetes_writes
      - upgrade_duration_bucket_p95
      - upgrade_pod_duration_bucket_p95
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_auth_login_errors
      - openbao_auth_inline_requests
      - openbao_auth_cache_hits_total
      - openbao_auth_cache_misses_total
      - openbao_api_requests
      - openbao_workload_request_count
      - openbao_workload_request_avg_seconds
      - openbao_workload_login_request_count
      - openbao_workload_login_request_avg_seconds
      - openbao_workload_token_check_count
      - openbao_workload_token_check_avg_seconds
      - openbao_workload_in_flight_requests_max
      - openbao_workload_token_creation_count
      - openbao_workload_audit_request_failures
      - openbao_workload_audit_response_failures
    phases:
      - name: sample_started
      - name: upgrade_requested
      - name: upgrade_session_started
      - name: upgrade_completed
      - name: scenario_completed
