version: v2
defaults:
  warmups: 1
  samples: 3
  sampleTimeout: 30m
  cleanup: always
  artifactLevel: standard

scenarios:
  - name: lifecycle-convergence
    description: OpenBaoCluster creation to available using native Kubernetes phase observation.
    labels: [lifecycle, cluster, critical]
    executor: native-go
    primaryMeasurements:
      - cluster_available_seconds
      - statefulset_created_seconds
      - first_pod_ready_seconds
      - all_pods_ready_seconds
      - sample_total_seconds
    diagnosticMeasurements:
      - observed_kubernetes_writes
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: resource_created
      - name: statefulset_created
      - name: first_pod_ready
      - name: all_pods_ready
      - name: cluster_available
      - name: scenario_completed

  - name: backup
    description: Backup orchestration signal, split from restore in the v2 contract.
    labels: [backup, disaster-recovery]
    executor: e2e-ginkgo
    labelFilter: dr && backup && restore && !failure-injection
    primaryMeasurements:
      - sample_total_seconds
      - backup_last_duration_seconds
    diagnosticMeasurements:
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: scenario_completed

  - name: restore
    description: Restore orchestration signal, split from backup in the v2 contract.
    labels: [restore, disaster-recovery]
    executor: e2e-ginkgo
    labelFilter: dr && backup && restore && !failure-injection
    primaryMeasurements:
      - sample_total_seconds
      - restore_duration_bucket_p95
    diagnosticMeasurements:
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: scenario_completed

  - name: rolling-upgrade
    description: Rolling upgrade steady path with native phase and availability observation.
    labels: [upgrade, rolling, critical]
    executor: native-go
    primaryMeasurements:
      - upgrade_total_seconds
      - upgrade_session_start_seconds
      - upgrade_pod_ready_seconds
      - upgrade_availability_probe_failures
      - sample_total_seconds
    diagnosticMeasurements:
      - upgrade_kubernetes_writes
      - observed_kubernetes_writes
      - upgrade_duration_bucket_p95
      - upgrade_pod_duration_bucket_p95
      - reconcile_duration_bucket_p95
      - reconcile_error_ratio
      - workqueue_retries_delta
      - kubernetes_writes
      - openbao_auth_logins
      - openbao_api_requests
    phases:
      - name: sample_started
      - name: upgrade_requested
      - name: upgrade_session_started
      - name: upgrade_completed
      - name: scenario_completed
