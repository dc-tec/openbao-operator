version: v1
scenarios:
  - name: lifecycle
    description: Core tenant lifecycle without disaster-recovery or upgrade workflows.
    labelFilter: lifecycle && critical && tenant && !slow && !openshift && !pentest
    metricPolicies:
      reconcile_p95_seconds:
        policy: upper_bound
        multiplier: p95
      reconcile_error_ratio:
        policy: upper_bound
        multiplier: max
      workqueue_retries_delta:
        policy: upper_bound
        severity: warn
        multiplier: max
        floor: 100

  - name: backup-restore
    description: Disaster-recovery backup and restore lifecycle.
    labelFilter: dr && backup && restore && !failure-injection
    metricPolicies:
      backup_last_duration_seconds_max:
        policy: upper_bound
        multiplier: max
      restore_p95_seconds:
        policy: upper_bound
        multiplier: p95
      reconcile_p95_seconds:
        policy: upper_bound
        multiplier: p95
      reconcile_error_ratio:
        policy: upper_bound
        multiplier: max
      workqueue_retries_delta:
        policy: upper_bound
        severity: warn
        multiplier: max
        floor: 500

  - name: rolling-upgrade
    description: Rolling upgrade steady path without snapshot-recovery coverage.
    labelFilter: upgrade && rolling && !failure && !bluegreen && !snapshot && !recovery
    metricPolicies:
      upgrade_p95_seconds:
        policy: upper_bound
        multiplier: p95
      upgrade_pod_p95_seconds:
        policy: upper_bound
        multiplier: p95
      reconcile_p95_seconds:
        policy: upper_bound
        multiplier: p95
      reconcile_error_ratio:
        policy: upper_bound
        multiplier: max
      workqueue_retries_delta:
        policy: upper_bound
        severity: warn
        multiplier: max
        floor: 200
