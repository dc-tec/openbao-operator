apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openbao-restrict-controller-secret-writes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  variables:
    - name: operator_namespace
      expression: >-
        'openbao-operator-system'
    - name: controller_serviceaccount_name
      expression: >-
        'openbao-operator-controller'
    - name: controller_principal
      expression: >-
        'system:serviceaccount:' + variables.operator_namespace + ':' + variables.controller_serviceaccount_name
    - name: is_controller
      expression: >-
        request.userInfo.username == variables.controller_principal
    - name: secret_name
      expression: >-
        request.operation == "DELETE" ?
          ((
            oldObject != null &&
            has(oldObject.metadata) &&
            oldObject.metadata.name != ''
          ) ? oldObject.metadata.name : request.name) :
          ((
            object != null &&
            has(object.metadata) &&
            object.metadata.name != ''
          ) ? object.metadata.name : request.name)
    - name: secret_labels
      expression: >-
        request.operation == "DELETE" ?
          ((
            oldObject != null &&
            has(oldObject.metadata) &&
            has(oldObject.metadata.labels)
          ) ? oldObject.metadata.labels : {}) :
          ((
            object != null &&
            has(object.metadata) &&
            has(object.metadata.labels)
          ) ? object.metadata.labels : {})
    - name: cluster_name
      expression: >-
        ("openbao.org/cluster" in variables.secret_labels) ?
          variables.secret_labels["openbao.org/cluster"] : ""
    - name: claim_namespace
      expression: >-
        ("openbao.org/claim-namespace" in variables.secret_labels) ?
          variables.secret_labels["openbao.org/claim-namespace"] : ""
    - name: claim_name
      expression: >-
        ("openbao.org/claim-name" in variables.secret_labels) ?
          variables.secret_labels["openbao.org/claim-name"] : ""
    - name: component_name
      expression: >-
        ("openbao.org/component" in variables.secret_labels) ?
          variables.secret_labels["openbao.org/component"] : ""
    - name: connection_contract
      expression: >-
        ("openbao.org/connection-contract" in variables.secret_labels) ?
          variables.secret_labels["openbao.org/connection-contract"] : ""
    - name: has_required_labels
      expression: >-
        variables.cluster_name != "" &&
        ("app.kubernetes.io/managed-by" in variables.secret_labels) &&
        variables.secret_labels["app.kubernetes.io/managed-by"] == "openbao-operator" &&
        (
          !("app.kubernetes.io/name" in variables.secret_labels) ||
          variables.secret_labels["app.kubernetes.io/name"] == "openbao"
        ) &&
        (
          !("app.kubernetes.io/instance" in variables.secret_labels) ||
          variables.secret_labels["app.kubernetes.io/instance"] == variables.cluster_name
        )
    - name: has_allowed_name
      expression: >-
        variables.cluster_name != "" &&
        variables.secret_name in [
          variables.cluster_name + "-tls-ca",
          variables.cluster_name + "-tls-server",
          variables.cluster_name + "-root-token",
          variables.cluster_name + "-unseal-key"
        ]
    - name: is_claim_bootstrap_projection_secret
      expression: >-
        variables.claim_namespace != "" &&
        variables.claim_name != "" &&
        variables.component_name == "claim-bootstrap-projection" &&
        ("openbao.org/ownership-mode" in variables.secret_labels) &&
        variables.secret_labels["openbao.org/ownership-mode"] == "ClaimManaged" &&
        ("app.kubernetes.io/managed-by" in variables.secret_labels) &&
        variables.secret_labels["app.kubernetes.io/managed-by"] == "openbao-operator" &&
        variables.secret_name.startsWith("claim-bootstrap-")
    - name: is_claim_connection_secret
      expression: >-
        variables.claim_namespace != "" &&
        variables.claim_name != "" &&
        variables.connection_contract == "primary" &&
        variables.claim_namespace == request.namespace &&
        ("app.kubernetes.io/managed-by" in variables.secret_labels) &&
        variables.secret_labels["app.kubernetes.io/managed-by"] == "openbao-operator"
    - name: is_controller_webhook_secret
      expression: >-
        request.namespace == variables.operator_namespace &&
        variables.secret_name.endsWith("-controller-webhook-certs") &&
        ("app.kubernetes.io/name" in variables.secret_labels) &&
        variables.secret_labels["app.kubernetes.io/name"] == "openbao-operator" &&
        ("app.kubernetes.io/component" in variables.secret_labels) &&
        variables.secret_labels["app.kubernetes.io/component"] == "controller-webhook" &&
        ("app.kubernetes.io/managed-by" in variables.secret_labels) &&
        variables.secret_labels["app.kubernetes.io/managed-by"] == "openbao-operator"
  validations:
    - expression: >-
        !variables.is_controller ||
        (
          (variables.has_required_labels && variables.has_allowed_name) ||
          variables.is_controller_webhook_secret ||
          variables.is_claim_bootstrap_projection_secret ||
          variables.is_claim_connection_secret
        )
      message: "The controller can only create, update, or delete operator-managed cluster Secrets, the controller webhook TLS Secret, claim bootstrap projection Secrets, or claim connection Secrets with the required labels."
