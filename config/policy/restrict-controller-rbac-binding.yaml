apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openbao-restrict-controller-rbac-binding
spec:
  policyName: openbao-restrict-controller-rbac
  validationActions: [Deny]
  matchResources:
    # This binding applies the policy to ALL Role/RoleBinding requests.
    # The policy itself filters for the specific user (is_controller variable).
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
