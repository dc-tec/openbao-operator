apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openbao-restrict-provisioner-namespace-mutations-binding
spec:
  # namePrefix is applied by config/default/kustomization.yaml, but kustomize may
  # not automatically rewrite this reference for ValidatingAdmissionPolicyBinding.
  policyName: openbao-operator-openbao-restrict-provisioner-namespace-mutations
  validationActions: [Deny]
  matchResources:
    # This binding applies the policy to ALL Namespace update requests.
    # The policy itself filters for the specific user (is_provisioner variable).
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["namespaces"]

