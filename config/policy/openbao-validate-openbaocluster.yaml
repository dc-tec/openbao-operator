apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openbao-validate-openbaocluster
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["openbao.org"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["openbaoclusters"]
  variables:
    - name: has_backup
      expression: has(object.spec.backup)
    - name: requested_upgrade_strategy
      expression: >-
        has(object.spec.upgrade) && has(object.spec.upgrade.strategy) && object.spec.upgrade.strategy != "" ? object.spec.upgrade.strategy : "RollingUpdate"
    - name: previous_upgrade_strategy
      expression: >-
        oldObject != null && has(oldObject.spec.upgrade) && has(oldObject.spec.upgrade.strategy) && oldObject.spec.upgrade.strategy != "" ? oldObject.spec.upgrade.strategy : "RollingUpdate"
    - name: has_pre_upgrade_snapshot
      expression: has(object.spec.upgrade) && has(object.spec.upgrade.preUpgradeSnapshot) && object.spec.upgrade.preUpgradeSnapshot == true
    - name: has_bluegreen_pre_upgrade_snapshot
      expression: has(object.spec.upgrade) && has(object.spec.upgrade.blueGreen) && has(object.spec.upgrade.blueGreen.preUpgradeSnapshot) && object.spec.upgrade.blueGreen.preUpgradeSnapshot == true
    - name: spec_version_normalized
      expression: >-
        object.spec.version.startsWith("v") ? object.spec.version.substring(1) : object.spec.version
    - name: spec_version_build_stripped
      expression: >-
        variables.spec_version_normalized.contains("+") ? variables.spec_version_normalized.substring(0, variables.spec_version_normalized.indexOf("+")) : variables.spec_version_normalized
    - name: spec_version_core
      expression: >-
        variables.spec_version_build_stripped.contains("-") ? variables.spec_version_build_stripped.substring(0, variables.spec_version_build_stripped.indexOf("-")) : variables.spec_version_build_stripped
    - name: spec_version_prerelease
      expression: >-
        variables.spec_version_build_stripped.contains("-") ? variables.spec_version_build_stripped.substring(variables.spec_version_build_stripped.indexOf("-") + 1) : ""
    - name: spec_version_valid
      expression: >-
        variables.spec_version_normalized.matches("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")
    - name: spec_version_parts
      expression: >-
        variables.spec_version_core.split(".").map(part, int(part))
    - name: current_version_normalized
      expression: >-
        oldObject != null && has(oldObject.status) && has(oldObject.status.currentVersion) && oldObject.status.currentVersion != "" ? (oldObject.status.currentVersion.startsWith("v") ? oldObject.status.currentVersion.substring(1) : oldObject.status.currentVersion) : ""
    - name: current_version_build_stripped
      expression: >-
        variables.current_version_normalized.contains("+") ? variables.current_version_normalized.substring(0, variables.current_version_normalized.indexOf("+")) : variables.current_version_normalized
    - name: current_version_core
      expression: >-
        variables.current_version_build_stripped.contains("-") ? variables.current_version_build_stripped.substring(0, variables.current_version_build_stripped.indexOf("-")) : variables.current_version_build_stripped
    - name: current_version_prerelease
      expression: >-
        variables.current_version_build_stripped.contains("-") ? variables.current_version_build_stripped.substring(variables.current_version_build_stripped.indexOf("-") + 1) : ""
    - name: current_version_valid
      expression: >-
        variables.current_version_normalized.matches("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")
    - name: current_version_parts
      expression: >-
        variables.current_version_core.split(".").map(part, int(part))
    - name: rolling_target_version_normalized
      expression: >-
        oldObject != null && has(oldObject.status) && has(oldObject.status.upgrade) && has(oldObject.status.upgrade.targetVersion) && oldObject.status.upgrade.targetVersion != "" ? (oldObject.status.upgrade.targetVersion.startsWith("v") ? oldObject.status.upgrade.targetVersion.substring(1) : oldObject.status.upgrade.targetVersion) : ""
    - name: rolling_target_version_build_stripped
      expression: >-
        variables.rolling_target_version_normalized.contains("+") ? variables.rolling_target_version_normalized.substring(0, variables.rolling_target_version_normalized.indexOf("+")) : variables.rolling_target_version_normalized
    - name: rolling_target_version_core
      expression: >-
        variables.rolling_target_version_build_stripped.contains("-") ? variables.rolling_target_version_build_stripped.substring(0, variables.rolling_target_version_build_stripped.indexOf("-")) : variables.rolling_target_version_build_stripped
    - name: rolling_target_version_prerelease
      expression: >-
        variables.rolling_target_version_build_stripped.contains("-") ? variables.rolling_target_version_build_stripped.substring(variables.rolling_target_version_build_stripped.indexOf("-") + 1) : ""
    - name: rolling_target_version_valid
      expression: >-
        variables.rolling_target_version_normalized.matches("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")
    - name: rolling_target_version_parts
      expression: >-
        variables.rolling_target_version_core.split(".").map(part, int(part))
    - name: rolling_upgrade_progress_started
      expression: >-
        oldObject != null && has(oldObject.status) && has(oldObject.status.upgrade) && (oldObject.status.upgrade.currentPartition < oldObject.spec.replicas || (has(oldObject.status.upgrade.completedPods) && size(oldObject.status.upgrade.completedPods) > 0))
    - name: requested_below_current_version
      expression: >-
        variables.current_version_valid &&
        variables.spec_version_valid &&
        (
          variables.spec_version_parts[0] < variables.current_version_parts[0] ||
          (variables.spec_version_parts[0] == variables.current_version_parts[0] &&
            (
              variables.spec_version_parts[1] < variables.current_version_parts[1] ||
              (variables.spec_version_parts[1] == variables.current_version_parts[1] &&
                (
                  variables.spec_version_parts[2] < variables.current_version_parts[2] ||
                  (variables.spec_version_parts[2] == variables.current_version_parts[2] &&
                    (
                      (variables.current_version_prerelease == "" && variables.spec_version_prerelease != "") ||
                      (variables.current_version_prerelease != "" &&
                        variables.spec_version_prerelease != "" &&
                        variables.spec_version_prerelease < variables.current_version_prerelease)
                    )
                  )
                )
              )
            )
          )
        )
    - name: requested_below_rolling_target
      expression: >-
        variables.rolling_upgrade_progress_started &&
        variables.rolling_target_version_valid &&
        variables.spec_version_valid &&
        (
          variables.spec_version_parts[0] < variables.rolling_target_version_parts[0] ||
          (variables.spec_version_parts[0] == variables.rolling_target_version_parts[0] &&
            (
              variables.spec_version_parts[1] < variables.rolling_target_version_parts[1] ||
              (variables.spec_version_parts[1] == variables.rolling_target_version_parts[1] &&
                (
                  variables.spec_version_parts[2] < variables.rolling_target_version_parts[2] ||
                  (variables.spec_version_parts[2] == variables.rolling_target_version_parts[2] &&
                    (
                      (variables.rolling_target_version_prerelease == "" && variables.spec_version_prerelease != "") ||
                      (variables.rolling_target_version_prerelease != "" &&
                        variables.spec_version_prerelease != "" &&
                        variables.spec_version_prerelease < variables.rolling_target_version_prerelease)
                    )
                  )
                )
              )
            )
          )
        )
  validations:
    - expression: >-
        has(object.spec.profile)
      message: spec.profile is required and must be explicitly set to Hardened or Development.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        (object.spec.tls.mode in ["External", "ACME"] &&
          has(object.spec.unseal) &&
          object.spec.unseal.type != "static" &&
          has(object.spec.selfInit) &&
          object.spec.selfInit.enabled == true &&
          !(has(object.spec.unseal.transit) && has(object.spec.unseal.transit.tlsSkipVerify) && object.spec.unseal.transit.tlsSkipVerify == true))
      message: Hardened profile requires TLS mode External or ACME, an external unseal (non-static), self-init enabled, and disallows tlsSkipVerify=true in seal configuration.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !has(object.spec.unseal) ||
        !has(object.spec.unseal.transit) ||
        !has(object.spec.unseal.transit.token) ||
        size(object.spec.unseal.transit.token) == 0
      message: Hardened profile does not allow spec.unseal.transit.token; use spec.unseal.credentialsSecretRef instead.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !has(object.spec.unseal) ||
        !has(object.spec.unseal.transit) ||
        !has(object.spec.unseal.transit.address) ||
        object.spec.unseal.transit.address.startsWith("https://")
      message: Hardened profile requires spec.unseal.transit.address to use HTTPS.
    - expression: >-
        !has(object.spec.unseal) ||
        !has(object.spec.unseal.transit) ||
        ((has(object.spec.unseal.transit.tlsClientCert) && size(object.spec.unseal.transit.tlsClientCert) > 0) ==
          (has(object.spec.unseal.transit.tlsClientKey) && size(object.spec.unseal.transit.tlsClientKey) > 0))
      message: spec.unseal.transit.tlsClientCert and spec.unseal.transit.tlsClientKey must be set together.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !has(object.spec.imageVerification) ||
        object.spec.imageVerification.enabled == true
      message: Hardened profile does not allow spec.imageVerification.enabled=false.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !has(object.spec.operatorImageVerification) ||
        object.spec.operatorImageVerification.enabled == true
      message: Hardened profile does not allow spec.operatorImageVerification.enabled=false.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !has(object.spec.imageVerification) ||
        !has(object.spec.imageVerification.failurePolicy) ||
        object.spec.imageVerification.failurePolicy != "Warn"
      message: Hardened profile does not allow spec.imageVerification.failurePolicy=Warn.
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !has(object.spec.operatorImageVerification) ||
        !has(object.spec.operatorImageVerification.failurePolicy) ||
        object.spec.operatorImageVerification.failurePolicy != "Warn"
      message: Hardened profile does not allow spec.operatorImageVerification.failurePolicy=Warn.
    - expression: >-
        !has(object.spec.initContainer) ||
        object.spec.initContainer.enabled == true
      message: spec.initContainer is optional; when set, spec.initContainer.enabled must be true.
    - expression: >-
        !has(object.spec.selfInit) ||
        object.spec.selfInit.enabled == false ||
        (has(object.spec.selfInit.requests) && size(object.spec.selfInit.requests) > 0)
      message: spec.selfInit.requests is required and must not be empty when spec.selfInit.enabled is true.
    - expression: >-
        !has(object.spec.selfInit) ||
        object.spec.selfInit.enabled == false ||
        (!has(object.spec.selfInit.requests) ||
          (size(object.spec.selfInit.requests) <= 64 &&
            object.spec.selfInit.requests.all(r,
              object.spec.selfInit.requests.filter(x, x.name == r.name).size() == 1) &&
            object.spec.selfInit.requests.all(r, size(r.path) <= 256)))
      message: spec.selfInit.requests must have unique names (max 64) and request paths must be <= 256 characters.
    - expression: >-
        !has(object.spec.selfInit) ||
        !has(object.spec.selfInit.oidc) ||
        object.spec.selfInit.oidc.enabled == false ||
        object.spec.selfInit.enabled == true
      message: spec.selfInit.oidc.enabled requires spec.selfInit.enabled to be true.
    - expression: >-
        !has(object.spec.gateway) ||
        object.spec.gateway.enabled == false ||
        (object.spec.gateway.hostname != "" && object.spec.gateway.gatewayRef.name != "")
      message: spec.gateway.hostname and spec.gateway.gatewayRef.name are required when Gateway is enabled.
    - expression: >-
        !has(object.spec.ingress) ||
        !has(object.spec.ingress.enabled) ||
        object.spec.ingress.enabled == false ||
        (has(object.spec.network) &&
          has(object.spec.network.trustedIngressPeers) &&
          size(object.spec.network.trustedIngressPeers) > 0)
      message: spec.ingress.enabled requires at least one spec.network.trustedIngressPeers entry so NetworkPolicy ingress remains source-scoped.
    - expression: >-
        !(variables.has_pre_upgrade_snapshot || variables.has_bluegreen_pre_upgrade_snapshot) ||
        variables.has_backup
      message: spec.backup is required when pre-upgrade snapshots are enabled (spec.upgrade.preUpgradeSnapshot or spec.upgrade.blueGreen.preUpgradeSnapshot).
    - expression: >-
        !variables.has_backup ||
        (object.spec.backup.schedule != "" &&
          ((has(object.spec.backup.jwtAuthRole) && object.spec.backup.jwtAuthRole != "") || has(object.spec.backup.tokenSecretRef) || ((!has(object.spec.backup.jwtAuthRole) || object.spec.backup.jwtAuthRole == "") && has(object.spec.selfInit) && object.spec.selfInit.enabled == true && has(object.spec.selfInit.oidc) && object.spec.selfInit.oidc.enabled == true)) &&
          object.spec.backup.schedule.matches("^\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+$"))
      message: spec.backup requires schedule, OpenBao auth (jwtAuthRole or tokenSecretRef, or self-init OIDC bootstrap enabled when jwtAuthRole is empty/unset for auto-creation of "openbao-operator-backup" role), and a 5-field cron expression. Storage credentials may come from target.credentialsSecretRef, target.roleArn, or the pod's ambient workload identity/default credential chain.
    - expression: >-
        oldObject == null ||
        variables.requested_upgrade_strategy == variables.previous_upgrade_strategy
      message: "spec.upgrade.strategy is immutable after creation; switching between RollingUpdate and BlueGreen is not supported."
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !(variables.has_backup || variables.has_pre_upgrade_snapshot || variables.has_bluegreen_pre_upgrade_snapshot) ||
        (has(object.spec.network) &&
          has(object.spec.network.egressRules) &&
          size(object.spec.network.egressRules) > 0)
      message: Hardened profile requires non-empty spec.network.egressRules when backups or pre-upgrade snapshots are enabled.
    # SSRF Protection: Block localhost endpoints (all profiles - localhost is never a valid backup target)
    - expression: >-
        !variables.has_backup ||
        !has(object.spec.backup.target.endpoint) ||
        object.spec.backup.target.endpoint == "" ||
        !(
          object.spec.backup.target.endpoint.contains("localhost") ||
          object.spec.backup.target.endpoint.contains("127.0.0.1") ||
          object.spec.backup.target.endpoint.contains("::1") ||
          object.spec.backup.target.endpoint.matches("^https?://[0-9]+[:/].*")
        )
      message: "Backup endpoint cannot point to localhost or use numeric IP encoding (SSRF protection)."
    # SSRF Protection: Block link-local addresses (all profiles - cloud metadata is always dangerous)
    - expression: >-
        !variables.has_backup ||
        !has(object.spec.backup.target.endpoint) ||
        object.spec.backup.target.endpoint == "" ||
        !object.spec.backup.target.endpoint.matches("^https?://169\\.254\\..*")
      message: "Backup endpoint cannot point to link-local addresses (SSRF protection against cloud metadata services)."
    # SSRF Protection: Require HTTPS for Hardened profile
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        !variables.has_backup ||
        !has(object.spec.backup.target.endpoint) ||
        object.spec.backup.target.endpoint == "" ||
        object.spec.backup.target.endpoint.startsWith("https://") ||
        object.spec.backup.target.endpoint.startsWith("s3://")
      message: "Backup endpoint must use HTTPS or S3 scheme in Hardened profile."
    # HA Enforcement: Hardened profile requires 3+ replicas for Raft quorum
    - expression: >-
        !has(object.spec.profile) ||
        object.spec.profile != "Hardened" ||
        object.spec.replicas >= 3
      message: "Hardened profile requires at least 3 replicas for Raft quorum HA. Use Profile=Development for non-HA deployments."
    # Block references to system secrets in backup/upgrade
    - expression: >-
        (!has(object.spec.backup) || !has(object.spec.backup.target.credentialsSecretRef) ||
          !object.spec.backup.target.credentialsSecretRef.name.matches("^.*-(unseal-key|root-token|tls-ca|tls-server)$")) &&
        (!has(object.spec.backup) || !has(object.spec.backup.tokenSecretRef) ||
          !object.spec.backup.tokenSecretRef.name.matches("^.*-(unseal-key|root-token|tls-ca|tls-server)$"))
      message: "References to system secrets (unseal-key, root-token, tls-ca, tls-server) are prohibited in backup configurations to prevent confused deputy attacks."
    # Storage Immutability: Prevent storage class changes (immutable in StatefulSet)
    - expression: >-
        oldObject == null ||
        (has(object.spec.storage.storageClassName) ? object.spec.storage.storageClassName : "") ==
        (has(oldObject.spec.storage.storageClassName) ? oldObject.spec.storage.storageClassName : "")
      message: "spec.storage.storageClassName is immutable after creation; set it explicitly before PVCs are created."
    # Storage Expansion: Prevent shrinking storage
    - expression: >-
        oldObject == null ||
        !has(oldObject.spec.storage.size) ||
        quantity(object.spec.storage.size).compareTo(quantity(oldObject.spec.storage.size)) >= 0
      message: "spec.storage.size cannot be decreased."
    # OIDC issuer override hardening (not used as a fetch target by the operator)
    - expression: >-
        !has(object.spec.selfInit) ||
        !has(object.spec.selfInit.oidc) ||
        !has(object.spec.selfInit.oidc.issuer) ||
        object.spec.selfInit.oidc.issuer == "" ||
        (
          object.spec.selfInit.oidc.issuer.startsWith("https://") &&
          !object.spec.selfInit.oidc.issuer.contains("@") &&
          !object.spec.selfInit.oidc.issuer.contains("?") &&
          !object.spec.selfInit.oidc.issuer.contains("#") &&
          !object.spec.selfInit.oidc.issuer.contains("localhost") &&
          !object.spec.selfInit.oidc.issuer.contains("127.0.0.1") &&
          !object.spec.selfInit.oidc.issuer.contains("::1") &&
          !object.spec.selfInit.oidc.issuer.matches("^https?://169\\.254\\..*") &&
          !object.spec.selfInit.oidc.issuer.contains("/.well-known/")
        )
      message: "spec.selfInit.oidc.issuer must be an https:// issuer URL (no userinfo/query/fragment; not localhost/link-local; must not include /.well-known/*)."
    # Self-init request lint: if a request targets auth/jwt/*, ensure the mount is enabled via sys/auth/jwt.
    - expression: >-
        !has(object.spec.selfInit) ||
        !has(object.spec.selfInit.requests) ||
        size(object.spec.selfInit.requests) == 0 ||
        !(
          object.spec.selfInit.requests.filter(r, r.path.startsWith("auth/jwt/") || r.path == "auth/jwt/config").size() > 0
        ) ||
        object.spec.selfInit.requests.filter(r, r.path == "sys/auth/jwt").size() > 0
      message: "spec.selfInit.requests contains auth/jwt/* paths but is missing a sys/auth/jwt request to enable that auth mount."
    # Self-init request lint: if a request targets auth/jwt-operator/* without operator OIDC bootstrap, ensure sys/auth/jwt-operator is present.
    - expression: >-
        !has(object.spec.selfInit) ||
        !has(object.spec.selfInit.requests) ||
        size(object.spec.selfInit.requests) == 0 ||
        !(
          object.spec.selfInit.requests.filter(r, r.path.startsWith("auth/jwt-operator/") || r.path == "auth/jwt-operator/config").size() > 0
        ) ||
        (has(object.spec.selfInit.oidc) && object.spec.selfInit.oidc.enabled == true) ||
        object.spec.selfInit.requests.filter(r, r.path == "sys/auth/jwt-operator").size() > 0
      message: "spec.selfInit.requests contains auth/jwt-operator/* paths but is missing sys/auth/jwt-operator (or spec.selfInit.oidc.enabled: true) to enable that auth mount."
    # Upgrade Safety: prevent version regressions below the running cluster version.
    - expression: >-
        !variables.requested_below_current_version
      message: "spec.version cannot be downgraded below status.currentVersion."
    # Upgrade Safety: once rolling progress has started, do not allow lowering the target version.
    - expression: >-
        !variables.requested_below_rolling_target
      message: "spec.version cannot be reduced below status.upgrade.targetVersion after rolling progress has started."
