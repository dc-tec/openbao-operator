apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openbao-restrict-controller-serviceaccounts-binding
spec:
  policyName: openbao-restrict-controller-serviceaccounts
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["serviceaccounts"]
