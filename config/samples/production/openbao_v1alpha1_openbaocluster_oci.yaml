# OpenBaoCluster with OCI KMS Auto-Unseal
#
# This example demonstrates using Oracle Cloud Infrastructure (OCI) Key Management Service
# for auto-unseal instead of storing the unseal key in Kubernetes Secrets.
#
# Prerequisites:
# - OCI KMS vault and master encryption key created
# - OCI KMS permissions for the runtime principal
# - Default OCI principal configured (for example instance principal), or OCI API-key credentials
#
# See: https://openbao.org/docs/configuration/seal/ocikms/
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-oci
spec:
  profile: Hardened
  version: "2.4.4"
  replicas: 3
  tls:
    enabled: true
    mode: External
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"
      file: "/var/log/openbao/openbao.log"
      rotateDuration: "24h"
  # OCI KMS seal configuration
  unseal:
    type: ocikms
    ocikms:
      # OCID of the master encryption key
      keyID: "ocid1.key.oc1.us-ashburn-1.example.uniqueid"
      # OCI KMS crypto endpoint
      cryptoEndpoint: "https://kms.us-ashburn-1.oraclecloud.com"
      # OCI KMS management endpoint
      managementEndpoint: "https://kms.us-ashburn-1.oraclecloud.com"
      # Optional: enable OCI API-key authentication through an OCI SDK config file.
      # When omitted or false, OpenBao uses the default OCI principal flow.
      # authTypeAPIKey: true
    # Optional: If using OCI API-key authentication
    # credentialsSecretRef:
    #   name: oci-kms-credentials
    #
    # The referenced Secret must contain:
    # - config: OCI SDK config file with a [DEFAULT] profile
    # - the private key file referenced by key_file in that config, mounted under /etc/bao/seal-creds
  # Self-initialization (required for Hardened profile)
  selfInit:
    enabled: true
---
# Example: Create OCI KMS credentials Secret (only if using authTypeAPIKey: true)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: oci-kms-credentials
#   namespace: openbaocluster-oci
# type: Opaque
# stringData:
#   config: |
#     [DEFAULT]
#     user=ocid1.user.oc1..example
#     fingerprint=aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99
#     tenancy=ocid1.tenancy.oc1..example
#     region=us-ashburn-1
#     key_file=/etc/bao/seal-creds/private.pem
#   private.pem: |
#     -----BEGIN RSA PRIVATE KEY-----
#     ...
#     -----END RSA PRIVATE KEY-----
