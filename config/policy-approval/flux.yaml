apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openbao-approval-chart
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/dc-tec/openbao-operator.git
  ref:
    commit: REPLACE_WITH_REVIEWED_COMMIT
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: example-policy
  namespace: flux-system
spec:
  interval: 10m
  timeout: 6m
  releaseName: example-policy
  targetNamespace: openbao-admin
  chart:
    spec:
      chart: ./charts/openbao-policy-approval
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openbao-approval-chart
  install:
    disableWaitForJobs: false
  upgrade:
    disableWaitForJobs: false
  values:
    cluster:
      name: example
      namespace: bao
    tls:
      caConfigMapName: bao-ca
    # Add image and approval.from/to for a later approval request.
