namespace: openbao-operator-system

resources:
  - ../../default

# Optional: add an extra prefix for all resources in this overlay.
# Keep the trailing dash if you set one.
# namePrefix: demo-

replacements:
  - source:
      version: v1
      kind: ServiceAccount
      name: openbao-operator-controller
      fieldPath: metadata.name
    targets:
      - select:
          group: apps
          version: v1
          kind: Deployment
          name: openbao-operator-controller
        fieldPaths:
          - spec.template.spec.containers.[name=manager].env.[name=OPERATOR_SERVICE_ACCOUNT_NAME].value
      - select:
          group: apps
          version: v1
          kind: Deployment
          name: openbao-operator-provisioner
        fieldPaths:
          - spec.template.spec.containers.[name=manager].env.[name=OPERATOR_SERVICE_ACCOUNT_NAME].value
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-controller-statefulset-mutations
        fieldPaths:
          - spec.variables.[name=controller_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-managed-resource-mutations
        fieldPaths:
          - spec.variables.[name=controller_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-controller-rbac
        fieldPaths:
          - spec.variables.[name=controller_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-controller-serviceaccounts
        fieldPaths:
          - spec.variables.[name=controller_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-controller-secret-writes
        fieldPaths:
          - spec.variables.[name=controller_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-rbac
        fieldPaths:
          - spec.variables.[name=controller_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
  - source:
      version: v1
      kind: ServiceAccount
      name: openbao-operator-controller
      fieldPath: metadata.namespace
    targets:
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-controller-statefulset-mutations
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-managed-resource-mutations
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-controller-rbac
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-controller-serviceaccounts
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-controller-secret-writes
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-namespace-mutations
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-rbac
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-tenant-governance
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-validate-openbao-tenant
        fieldPaths:
          - spec.variables.[name=operator_namespace].expression
        options:
          delimiter: "'"
          index: 1
  - source:
      version: v1
      kind: ServiceAccount
      name: openbao-operator-provisioner
      fieldPath: metadata.name
    targets:
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-namespace-mutations
        fieldPaths:
          - spec.variables.[name=provisioner_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-rbac
        fieldPaths:
          - spec.variables.[name=provisioner_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-restrict-provisioner-tenant-governance
        fieldPaths:
          - spec.variables.[name=provisioner_serviceaccount_name].expression
        options:
          delimiter: "'"
          index: 1
  - source:
      version: v1
      kind: ConfigMap
      name: maintenance-break-glass-settings
      fieldPath: data.BREAK_GLASS_GROUPS_JSON
    targets:
      - select:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-managed-resource-mutations
        fieldPaths:
          - spec.variables.[name=break_glass_admin_groups].expression
