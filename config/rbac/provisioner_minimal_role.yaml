apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provisioner-role
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/component: provisioner
    app.kubernetes.io/managed-by: kustomize
rules:
  # 1. Namespace Access (get/update/patch only - no list/watch)
  # SECURITY: The Provisioner no longer watches namespaces. Instead, it watches
  # OpenBaoTenant CRDs which explicitly declare target namespaces. This eliminates
  # the ability for a compromised Provisioner to survey the cluster topology.
  # The Provisioner only needs get/update/patch to:
  # - Verify target namespace exists (get)
  # - Apply Pod Security Standards labels (update/patch)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - update
      - patch

  # 2. ServiceAccount Access (get only - no list/watch)
  # SECURITY: The Provisioner only needs to get specific ServiceAccounts in the operator
  # namespace during initialization. Cache is disabled for ServiceAccounts to prevent
  # requiring cluster-wide list/watch permissions.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get

  # 4. OpenBaoTenant CRD Management
  # Required to watch and manage OpenBaoTenant resources which declare target namespaces.
  - apiGroups:
      - openbao.org
    resources:
      - openbaotenants
      - openbaotenants/status
      - openbaotenants/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch

  # 4b. OpenBaoCluster read-only access
  # Required for the tenant secrets RBAC sync controller to build per-namespace Secret allowlists.
  - apiGroups:
      - openbao.org
    resources:
      - openbaoclusters
    verbs:
      - get
      - list
      - watch

  # 4c. Admission policy dependency checks (get only)
  # Required for fail-closed startup validation that ValidatingAdmissionPolicies are present and enforced.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - get

  # 4d. Tenant quota/limits management (namespaced)
  # NOTE: Server-Side Apply may create objects when they don't exist yet, which requires 'create' permission.
  - apiGroups:
      - ""
    resources:
      - resourcequotas
      - limitranges
    verbs:
      - get
      - create
      - patch

  # 5. Tenant onboarding resources (Server-Side Apply)
  # SECURITY: The Provisioner uses Server-Side Apply (PATCH) against fixed resource names.
  # NOTE: Server-Side Apply may create objects when they don't exist yet, which requires 'create' permission.
  # Admission policy enforcement restricts which RBAC objects can be created and what they may contain.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    resourceNames:
      - openbao-operator-tenant-role
      - openbao-operator-tenant-secrets-reader
      - openbao-operator-tenant-secrets-writer
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    resourceNames:
      - openbao-operator-tenant-rolebinding
      - openbao-operator-tenant-secrets-reader-rolebinding
      - openbao-operator-tenant-secrets-writer-rolebinding
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - bind
      - escalate
    resourceNames:
      - openbao-operator-tenant-role
      - openbao-operator-tenant-secrets-reader
      - openbao-operator-tenant-secrets-writer
