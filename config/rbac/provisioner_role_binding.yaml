---
# ClusterRoleBinding for the Provisioner Controller
# This binds the operator ServiceAccount to the Provisioner ClusterRole,
# allowing it to onboard tenant namespaces by creating fixed Role/RoleBinding resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/component: provisioner
    app.kubernetes.io/managed-by: kustomize
  name: provisioner-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provisioner-role
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: system
